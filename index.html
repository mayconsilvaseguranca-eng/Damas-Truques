  const others=[];for(let k=1;k<=s.np;k++){const i=(ui.orient+k)%s.np;if(v===null||i!==v)others.push(i);}
  const recent=s.log.map((l,i)=>[l,i]).filter(([l])=>l.to===undefined||l.to===v).slice(-40).reverse().map(([l,i])=>{const c=l.card&&CARD[l.card];
    return `<li class="${c?'withcard':''}"><span class="lt">T${l.t}</span><span class="lbody">${c?`<button class="logchip d-${c.deck} ${c.kind==='armadilha'?'trap':'acao'}" data-log="${i}" aria-label="Ver a carta ${esc(c.name)}">${typeIcon(c.kind)}${esc(c.name)}</button> `:''}${esc(l.text)}</span></li>`;}).join('');
  return `
   ${ui.tut?coachHTML():''}<div ${ui.tut?'hidden ':''}class="plates compact${others.length===1?' solo':others.length===3?' trio':''}">${others.map(i=>plateHTML(i,false)).join('')}</div>
   <div class="boardrow">${v!==null?inforail(v):''}<div class="boardwrap" style="--bw:${N>8?'560px':'460px'}"><div class="boardin"><div class="board n${N}${N>8?' big':''}" id="board" style="--n:${N}">${cells}</div>${previewSVG(pv,N,toView,pvColor)}</div>${sheet}</div>${rail}${askPop}</div>
   ${handArea}
   <details id="logdet" ${ui.logOpen?'open':''}><summary>Histórico da partida <span class="zhint">· toque numa carta para ver o que ela faz</span></summary><ul class="loglist">${recent}</ul></details>

function renderOverlay(){
  const o=$('overlay');let html='';
  if(inGame()&&needPass()){
    const me=S.current,P=S.players[me];
    html=`<div class="overlay"><div class="ov-in d-${P.deck}"><p class="eyebrow">Turno ${S.turn} · passe o celular</p>
      <span class="bigchar">${charSVG(P.deck)}</span>
      <h2>Vez do ${J(me)}</h2><p class="hint">Suas peças têm a cor do baralho ${DECKS[P.deck].name}. Só toque quando o celular estiver com você.</p>
      <button class="btn primary" id="ready">Mostrar minha mão</button></div></div>`;
  }else if(NET.role==='guest'&&NET.hostLost&&(inGame()||ui.screen==='lobby')){
    html=`<div class="overlay"><div class="ov-in"><p class="eyebrow">Sala ${esc(NET.code)}</p><div class="netspin" aria-hidden="true"></div>
      <h2>Esperando o anfitrião</h2><p class="hint">A conexão com quem criou a sala caiu. Se ele voltar ao jogo, a partida continua de onde parou.</p>
      <div class="ov-row"><button class="btn ghost" id="netleave">Sair da sala</button></div></div></div>`;
  }else if(inGame()&&S.phase==='over'&&NET.on){
    const w=S.winner,host=NET.role==='host';
    html=`<div class="overlay"><div class="ov-in"><p class="eyebrow">Fim de jogo · turno ${S.turn}</p>
      ${w!==null?`<span class="bigchar">${charSVG(S.players[w].deck)}</span><h2>${w===NET.seat?'Você venceu!':esc(J(w))+' venceu!'}</h2>`:'<h2>Empate</h2>'}<p class="hint">${esc(S.reason)}</p>
      ${host?`<div class="ov-row"><button class="btn primary" id="rematch">Revanche</button><button class="btn ghost" id="tosetup">Voltar à sala</button><button class="btn ghost" id="netleave">Fechar sala</button></div>`
        :`<p class="hint">Esperando o anfitrião escolher a revanche…</p><div class="ov-row"><button class="btn ghost" id="netleave">Sair da sala</button></div>`}</div></div>`;
  }else if(ui.tut&&ui.tut.show){html=tutOverlayHTML();
  }else if(ui.tutDeck&&ui.screen==='tutclasses'){html=tutDeckHTML();
  }else if(inGame()&&S.phase==='over'&&!ui.tut){
    const w=S.winner;
    html=`<div class="overlay"><div class="ov-in"><p class="eyebrow">Fim de jogo · turno ${S.turn}</p>
      ${w!==null?`<span class="bigchar">${charSVG(S.players[w].deck)}</span><h2>${label(w)} venceu!</h2>`:'<h2>Empate</h2>'}<p class="hint">${esc(S.reason)}</p>
      <div class="ov-row"><button class="btn primary" id="rematch">Revanche</button><button class="btn ghost" id="tosetup">Trocar baralhos</button><button class="btn ghost" id="tomenu">Menu</button></div></div></div>`;
  }else if(ui.logView!=null&&S&&S.log[ui.logView]){
    const l=S.log[ui.logView],c=CARD[l.card];
    html=`<div class="overlay logmodal" id="logbg"><div class="ov-in d-${c.deck}"><p class="eyebrow">Histórico · turno ${l.t}</p>
      ${cardHTML(c,{full:true})}
      <div class="caption" style="--dk:${DCOLOR[c.deck]}"><small style="margin:0 0 4px">O que aconteceu</small>${esc(l.text)}</div>
      <button class="btn primary" id="closelog">Voltar ao jogo</button></div></div>`;
  }else if(ui.deckView!=null&&inGame()&&S.players[ui.deckView]){
    const i=ui.deckView,P=S.players[i],d=DECKS[P.deck],cs=CARDS.filter(c=>c.deck===P.deck),me=viewer()===i;
    const st=(n,l)=>`<span><b>${n}</b> ${l}</span>`;
    html=`<div class="overlay logmodal deckmodal" id="deckbg"><div class="ov-in d-${P.deck}"><p class="eyebrow">${me?'Seu baralho':'Baralho do '+esc(J(i))}</p>
      <span class="bigchar">${charSVG(P.deck)}</span><h2 class="dv-title">${charName(P.deck)}</h2><p class="dv-char">${icon(P.deck)}${charLine(P.deck)}</p><p class="hint">${d.blurb}</p>
      <div class="dv-stats">${me?st(P.hand.length,'na mão')+st(P.traps.length,'armadas')+st(P.pile.length,'no monte')+st(P.discard.length,'no descarte'):st(P.traps.length,P.traps.length===1?'armadilha armada':'armadilhas armadas')}</div>
      <div class="dv-grid">${cs.map(c=>cardHTML(c,{full:true})).join('')}</div>
      <button class="btn primary" id="closedeck">Voltar ao jogo</button></div></div>`;
  }else if(ui.quit&&NET.on){
    html=`<div class="overlay"><div class="ov-in"><h2>${NET.role==='host'?'Fechar a sala?':'Sair da sala?'}</h2><p class="hint">${NET.role==='host'?'A partida acaba para todo mundo.':'Um bot joga no seu lugar. Dá para voltar pela tela Jogar online.'}</p>
      <div class="ov-row"><button class="btn primary" id="quitno">Continuar jogando</button><button class="btn ghost" id="netleave">${NET.role==='host'?'Fechar sala':'Sair da sala'}</button></div></div></div>`;
  }else if(ui.quit){
    html=`<div class="overlay"><div class="ov-in"><h2>Pausar a partida?</h2><p class="hint">Voltando ao menu, a partida fica salva neste aparelho e você continua de onde parou. Se encerrar, ela é apagada.</p>
      <div class="ov-row"><button class="btn primary" id="pausemenu">Voltar ao menu</button><button class="btn ghost" id="quitno">Continuar jogando</button><button class="btn ghost" id="quityes">Encerrar partida</button></div></div></div>`;
    if(false)html=`<div class="overlay"><div class="ov-in"><h2>Sair da partida?</h2><p class="hint">O progresso desta partida será perdido.</p>
      <div class="ov-row"><button class="btn primary" id="quityes">Sair</button><button class="btn ghost" id="quitno">Continuar jogando</button></div></div></div>`;
  }
  if(o.dataset.h!==html){o.innerHTML=html;o.dataset.h=html;}
}

/* ---------- aba de cartas ---------- */
function renderCards(){
  return `<p class="lead">Todas as cartas do jogo, separadas por baralho. Cada baralho tem 12 cartas.</p>
   <div class="legend">
     <div>${cardHTML(CARD.passo,{mini:true})}<p><b>Ação</b>Carta clara com raio. Você usa na sua vez, antes de mover, e ela resolve na hora.</p></div>
     <div>${cardHTML(CARD.anular,{mini:true})}<p><b>Armadilha</b>Carta escura com moldura listrada. Fica virada para baixo (máx. 2) e dispara sozinha quando um oponente faz o que está escrito.</p></div>
   </div>
   ${renderBalance()}`+
   Object.entries(DECKS).map(([k,d])=>{const cs=CARDS.filter(c=>c.deck===k),b=BALANCE.decks[k];
     return `<section class="deck-sec d-${k}" id="baralho-${k}"><div class="ds-head">${charSVG(k,'dschar')}<div><h2>${charName(k)}</h2><p class="dv-char">${icon(k)}${charLine(k)}</p></div></div><p class="meta">${d.blurb} · ${cs.reduce((a,c)=>a+c.n,0)} cartas</p>
       ${b?`<div class="stats-line"><span class="wr"><i>Vitórias nos testes, 2 jogadores:</i> ${b[0]}%</span><span class="wr"><i>3 jogadores:</i> ${b[1]}%</span>${b[2]!=null?`<span class="wr"><i>4 jogadores:</i> ${b[2]}%</span>`:''}</div>`:''}
       <div class="gallery">${cs.map(c=>cardHTML(c,{full:true})).join('')}</div></section>`;}).join('');
}
function renderBalance(){
  const rows=Object.entries(BALANCE.decks).sort((a,b)=>(b[1][0]+b[1][1])-(a[1][0]+a[1][1]));
  return `<section class="deck-sec"><h2 style="color:var(--hi)">Teste de balanceamento</h2>
    <p class="meta">${esc(BALANCE.note)} Como há empates, a média de um baralho equilibrado fica perto de 47% com 2 jogadores, 28% com 3 e 20% com 4.</p>
    <div class="tbl"><table><thead><tr><th>Baralho</th><th>2 jog.</th><th>3 jog.</th><th>4 jog.</th></tr></thead><tbody>
    ${rows.map(([k,[a,b,c]])=>`<tr class="d-${k}"><td><span class="deckname" style="color:var(--dk);display:flex;gap:6px;align-items:center">${icon(k)}${DECKS[k].name}</span></td>
      <td><span class="bar" style="width:${Math.round(a*.6)}px"></span>${a}%</td><td><span class="bar" style="width:${Math.round(b*1.05)}px"></span>${b}%</td><td><span class="bar" style="width:${Math.round((c||0)*1.4)}px"></span>${c}%</td></tr>`).join('')}
    </tbody></table></div></section>`;
}
function renderRules(){
  return `<div class="rules"><button class="btn primary tutfromrules" id="tutstart">Aprender jogando: tutorial jogável</button>
  <h2>Objetivo</h2><p>Capturar todas as peças dos oponentes ou deixá-los sem nenhuma jogada possível. Com 3 jogadores, quem é eliminado sai e vence o último que sobrar.</p>
  <h2>Damas (regra brasileira)</h2><ul>
   <li>Peças só nas casas escuras. A peça comum anda 1 casa na diagonal para frente e captura para frente e para trás.</li>
   <li>A captura é obrigatória. Se depois de capturar a mesma peça puder capturar de novo, ela continua.</li>
   <li>Chegando no lado oposto do tabuleiro, a peça vira dama. A dama anda e captura em qualquer distância na diagonal.</li></ul>
  <h2>Regra em teste: 4 diagonais</h2><p>Na configuração dá para escolher que a peça comum ande 1 casa em qualquer diagonal, não só para frente. A promoção continua sendo no lado oposto.</p>
  <h2>2 jogadores</h2><p>Tabuleiro 8×8, 12 peças para cada lado.</p>
  <h2>4 jogadores</h2><ul>
   <li>Mesmo tabuleiro 11×11, agora com os quatro lados ocupados: Jogador 1 embaixo, 2 à esquerda, 3 em cima e 4 à direita, com 9 peças cada.</li>
   <li>Cada um começa encostado no canto à sua esquerda, então todo mundo começa na mesma situação. Nos testes com bots, os quatro lugares venceram entre 18% e 21% das partidas.</li>
   <li>A ordem é 1 → 2 → 3 → 4. Todos contra todos, e vence quem sobrar por último.</li></ul>
  <h2>3 jogadores</h2><ul>
   <li>Tabuleiro 11×11. O Jogador 1 começa embaixo, o 2 à esquerda e o 3 à direita, cada um com 9 peças. O lado de cima começa vazio.</li>
   <li>Cada um anda em direção ao lado oposto ao seu. Na sua vez, o tabuleiro gira para que o seu lado fique embaixo.</li>
   <li>Todas as peças dos outros dois são inimigas. Cartas que miram “um oponente” pedem para você escolher qual.</li>
   <li>A ordem é 1 → 2 → 3. Quem fica sem peças ou sem jogadas é eliminado e as peças dele saem do tabuleiro.</li></ul>
  <h2>Cartas</h2><ul>
   <li>Antes da partida, cada jogador escolhe um baralho de 12 cartas.</li>
   <li>Você começa com 3 cartas e compra 1 no início de cada turno (só se tiver menos de 5 na mão).</li>
   <li>Depois de mover, a vez passa sozinha para o próximo jogador. Se quiser descartar, faça isso antes de mover. Se tentar mover sem ter usado carta, o jogo pergunta antes.</li>
   <li>Cartas usadas e armadilhas disparadas vão para o descarte. Quando o monte acaba, o descarte é reembaralhado e vira o novo monte.</li>
   <li>Em cada turno você pode usar <b>uma</b> carta, sempre <b>antes</b> de mover. Para usar, <b>arraste a carta da mão para cima</b>. Tocar na carta só mostra o que ela faz.</li>
   <li>Uma vez por turno, você pode <b>descartar</b> uma carta arrastando-a até a lixeira que aparece na tela: ou da mão, ou uma das suas armadilhas armadas (arraste-a até a lixeira). É um descarte por turno no total, então se descartar da mão não dá para desarmar uma armadilha no mesmo turno, e vice-versa.</li>
   <li><b>Ação</b> (carta clara com raio): resolve na hora. <b>Armadilha</b> (carta escura com moldura listrada): fica virada para baixo, no máximo 2 por jogador, e dispara sozinha.</li>
   <li>Quando um oponente usa uma carta ou uma armadilha dispara, ela aparece grande em cima do tabuleiro, junto com o que aconteceu. As suas próprias cartas não interrompem o jogo.</li></ul>
  <h2>Terrenos e marcas</h2><ul>
   <li><b>Muralha</b> (listras marrons): ninguém para nem passa. <b>Gelo</b> (azul claro): quem para escorrega mais uma casa. <b>Portal</b> (roxo): quem para numa ponta sai na outra.</li>
   <li><b>Fosso</b>: só o dono vê. <b>Caveira</b> numa peça: ela foi marcada e some depois do próximo turno dela.</li></ul>
  <h2>Fim por falta de progresso</h2><p>Se passarem ${QUIET[2]} turnos (${QUIET[3]} com 3 jogadores) sem nenhuma captura ou promoção, a partida acaba. Vence quem tiver mais material (peça vale 1, dama vale 2). Se empatar, é empate.</p>
  <h2>Bots e jogo no mesmo celular</h2><p>Na configuração, cada lugar pode ser uma pessoa ou um bot. Com mais de uma pessoa, uma tela cobre tudo entre os turnos para ninguém ver a mão do outro. O bot olha uma jogada à frente e não vê as armadilhas de ninguém.</p>
  <h2>Próximos passos</h2><p>As regras ficam separadas da tela para depois virar online: cada jogada já é uma ação que pode ser enviada a um servidor.</p></div>`;
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  if(!e.target.closest('#temamenu')&&!e.target.closest('#temabtn'))closeTemaMenu();
  if(!e.target.closest('#sommenu')&&!e.target.closest('#sombtn'))closeSomMenu();
  if(drag.justDropped){drag.justDropped=false;return;}
  if((ui.sel||ui.selTrap)&&!e.target.closest('.sheet')&&!e.target.closest('[data-uid]')&&!e.target.closest('[data-trap]')&&!ui.tgt&&!ui.confirm){ui.sel=null;ui.selTrap=null;render();if(!e.target.closest('button'))return;}
  {const b=e.target.closest('button');if(b&&!b.dataset.r&&!b.dataset.uid&&!b.closest('#sommenu'))SND.play('click');}
  if(e.target.id==='tutdeckbg'){ui.tutDeck=null;renderOverlay();return;}
  if(e.target.id==='deckbg'){ui.deckView=null;renderOverlay();return;}
  if(e.target.id==='logbg'){ui.logView=null;renderOverlay();return;}
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='sombtn'){if($('sommenu').hidden)openSomMenu();else closeSomMenu();return;}
  if(t.id==='temabtn'){if($('temamenu').hidden)openTemaMenu();else closeTemaMenu();return;}
  if(t.dataset.tema){setTema(t.dataset.tema);return;}
  if(t.dataset.log!==undefined){ui.logView=+t.dataset.log;renderOverlay();return;}
  if(t.dataset.deckview!==undefined){ui.deckView=+t.dataset.deckview;renderOverlay();return;}
  if(t.id==='closedeck'){ui.deckView=null;renderOverlay();return;}
  if(t.id==='closelog'){ui.logView=null;renderOverlay();return;}
  if(fxBusy&&t.closest('#main')&&S&&ui.tab==='jogar')return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;render();window.scrollTo(0,0);tick();return;}
  if(t.dataset.mode){ui.mode=+t.dataset.mode;render();return;}
  if(t.dataset.pick){const[i,k]=t.dataset.pick.split(':');ui.setup[ui.mode][+i].deck=k;render();return;}
  if(t.dataset.omni!==undefined){ui.omni=t.dataset.omni==='1';render();return;}
  if(t.dataset.tutpick){ui.tutPick=t.dataset.tutpick;ui.tutDeck=t.dataset.tutpick;renderOverlay();return;}
  if(t.dataset.join){netJoin(t.dataset.join);return;}
  if(t.dataset.netnp){ui.netNp=+t.dataset.netnp;render();return;}
  if(t.dataset.lobbynp){netSetNp(+t.dataset.lobbynp);return;}
  if(t.dataset.netomni!==undefined){NET.lobby.omni=t.dataset.netomni==='1';netHostRefresh(false);render();return;}
  if(t.dataset.netseat){const[i,k]=t.dataset.netseat.split(':');const st=NET.lobby.seats[+i];if(st.kind==='open'||st.kind==='bot'){st.kind=k;st.deck=k==='bot'?(st.deck||randDeck()):null;netHostRefresh(false);render();}return;}
  if(t.dataset.netdeck){const[i,k]=t.dataset.netdeck.split(':');const st=NET.lobby.seats[+i];st.deck=k;lsSet('damas-deck',k);
    if(NET.role==='host')netHostRefresh(false);else netSend({t:'deck',deck:k});render();return;}
  if(t.dataset.ctrl){const[i,k]=t.dataset.ctrl.split(':');ui.setup[ui.mode][+i].ctrl=k;render();return;}
  switch(t.id){
    case 'tutstart':tutStart(0);return;
    case 'tutnext':{const i=ui.tut?ui.tut.i+1:0;if(i>=TUT.length)tutFinish();else tutStart(i);return;}
    case 'tutretry':tutStart(ui.tut?ui.tut.i:0);return;
    case 'tutskip':{const i=ui.tut.i+1;if(i>=TUT.length)tutFinish();else tutStart(i);return;}
    case 'tutquit':tutQuit();return;
    case 'tutplay':{ui.tutDeck=null;const D=Object.keys(DECKS).filter(k=>k!==(ui.tutPick||'ataque'));startGame([{deck:ui.tutPick||'ataque',ctrl:'human'},{deck:D[Math.floor(Math.random()*D.length)],ctrl:'bot'}],false);return;}
    case 'tutdeck':ui.tutDeck=t.dataset.deck;renderOverlay();return;
    case 'closetutdeck':ui.tutDeck=null;renderOverlay();return;
    case 'netcreate':netCreate(ui.netNp||2);return;
    case 'joinbycode':netJoin(($('joincode')||{}).value);return;
    case 'netleave':netLeave();window.scrollTo(0,0);return;
    case 'netstart':netBeginGame();return;
    case 'resumehost':netResumeHost();return;
    case 'resumeguest':netResumeGuest();return;
    case 'netcopy':{const l=t.dataset.link;(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Convite copiado. Mande para os amigos!'),()=>toast('Código da sala: '+NET.code));return;}
    case 'netshare':{try{navigator.share({title:'Damas & Truques',text:'Entra na minha sala de Damas & Truques! Código '+NET.code,url:t.dataset.link});}catch(e){}return;}
    case 'start':case 'rematch':{
      if(NET.on){if(NET.role==='host')netBeginGame();return;}
      const seats=t.id==='rematch'&&S?S.players.map(P=>({deck:P.deck,ctrl:P.ctrl})):ui.setup[ui.mode];
      const omni=t.id==='rematch'&&S?!!(S.rules&&S.rules.omni):!!ui.omni;startGame(seats,omni);return;}
    case 'quick':{const D=Object.keys(DECKS),r=()=>D[Math.floor(Math.random()*D.length)];startGame([{deck:r(),ctrl:'human'},{deck:r(),ctrl:'bot'}],false);return;}
    case 'continue':{if(!S){S=loadSaved();}if(S){ui.screen='game';lastOrient=null;ui.pending=[];render();tick();}return;}
    case 'tooffline':ui.screen='offline';render();window.scrollTo(0,0);return;
    case 'toonline':ui.screen='online';netBrowse();render();window.scrollTo(0,0);return;
    case 'tomenu':if(NET.on){netLeave(true);S=null;}if(S&&S.phase==='over')S=null;ui.screen='menu';render();window.scrollTo(0,0);return;
    case 'pausemenu':ui.quit=false;saveGame();ui.screen='menu';render();window.scrollTo(0,0);return;
    case 'goback':ui.tab='jogar';render();window.scrollTo(0,0);tick();return;
    case 'gocards':ui.tab='cartas';render();window.scrollTo(0,0);return;
    case 'gorules':ui.tab='regras';render();window.scrollTo(0,0);return;
    case 'gotema':openTemaMenu();return;
    case 'randdecks':{const D=Object.keys(DECKS);ui.setup[ui.mode].forEach(x=>x.deck=D[Math.floor(Math.random()*D.length)]);render();return;}
    case 'ready':act({type:'ready'});window.scrollTo(0,0);return;
    case 'endturn':act({type:'endTurn'});return;
    case 'skip':act({type:'skip'});return;
    case 'cancel':ui.tgt=null;ui.piece=null;ui.confirm=null;render();return;
    case 'confirmcard':{const k=ui.confirm;if(k)act({type:'play',uid:k.uid,target:k.target,dest:k.dest,opp:k.opp});return;}
    case 'changetgt':ui.confirm=null;ui.piece=null;render();return;
    case 'closecard':ui.sel=null;render();return;
    case 'discardcard':{const u=ui.sel,nm=CARD[S.cards[u]].name;act({type:'discard',uid:u});toast(`${nm} foi para o descarte.`);return;}
    case 'closetrap':ui.selTrap=null;render();return;
    case 'discardtrap':{const u=ui.selTrap,nm=CARD[S.cards[u]].name;act({type:'discard',uid:u});toast(`${nm} foi desarmada e foi para o descarte.`);return;}
    case 'tosetup':if(NET.role==='host'){netBackToLobby();return;}S=null;saveGame();ui.screen='offline';render();return;
    case 'quit':if(ui.tut){tutQuit();return;}ui.quit=true;if(!NET.on)clearTimeout(tickT);render();return;
    case 'quitno':ui.quit=false;render();tick();return;
    case 'quityes':ui.quit=false;S=null;saveGame();ui.screen='menu';render();return;
    case 'usecard':useCard(ui.sel);return;
    case 'askyes':{const m=ui.askMove;ui.askMove=null;if(m)act({type:'move',from:m.from,to:m.to});return;}
    case 'askno':ui.askMove=null;ui.piece=null;render();return;
    case 'asknever':{ui.noAsk=true;const m=ui.askMove;ui.askMove=null;if(m)act({type:'move',from:m.from,to:m.to});return;}
    case 'passnow':clearTimeout(autoT);autoT=null;if(S&&S.phase==='ended')act({type:'endTurn'});return;
  }
  if(t.dataset.opp!==undefined&&ui.tgt){act({type:'play',uid:ui.tgt,opp:+t.dataset.opp});return;}
  if(t.dataset.uid){SND.play('select');ui.sel=ui.sel===t.dataset.uid?null:t.dataset.uid;ui.selTrap=null;ui.piece=null;render();return;}
  if(t.dataset.trap){ui.selTrap=ui.selTrap===t.dataset.trap?null:t.dataset.trap;ui.sel=null;render();return;}
  if(t.dataset.r!==undefined&&S&&myTurn()&&!(ui.tut&&TUT[ui.tut.i].demo)){
    const pos=[+t.dataset.r,+t.dataset.c];
    if(ui.tgt){const raw=CARD[S.cards[ui.tgt]],c=raw.kind==='armadilha'?raw:effCard(S,ui.tgt);
      if(ui.confirm&&!c.dests)ui.confirm=null;
      if(ui.piece&&c.dests){if(c.dests(S,ui.piece).some(d=>eq(d,pos))){ui.confirm={uid:ui.tgt,target:ui.piece,dest:pos};render();}return;}
      if(!c.targets||!c.targets(S).some(d=>eq(d,pos)))return;
      if(c.dests){ui.piece=pos;render();return;}
      ui.confirm={uid:ui.tgt,target:pos};render();return;}
    if(S.phase!=='play'&&S.phase!=='chain')return;
    const moves=legalMoves(S);
    if(ui.piece){if(moves.some(m=>eq(m.from,ui.piece)&&eq(m.to,pos))){
      if(needAskMove()){ui.askMove={from:ui.piece,to:pos};SND.play('select');render();return;}
      act({type:'move',from:ui.piece,to:pos});return;}}
    if(S.phase==='chain')return;
    if(moves.some(m=>eq(m.from,pos))){ui.piece=eq(ui.piece,pos)?null:pos;ui.sel=null;SND.play('select');render();}
    else if(at(S,...pos)&&at(S,...pos).owner===S.current){
      const p=at(S,...pos);toast(frozen(S,p)?'Esta peça está congelada.':moves.some(m=>m.cap)&&!S.mods.noForce?'Captura obrigatória: escolha uma peça que possa capturar.':'Esta peça não tem jogada.');}
  }
});

document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='logdet')ui.logOpen=e.target.open;},true);
/* ---------- arrastar cartas: para cima usa, até a lixeira descarta ---------- */
const TRASH='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
function dragUI(){let d=$('dragui');if(!d){d=document.createElement('div');d.id='dragui';
  d.innerHTML=`<div id="usezone"><span>Solte aqui para usar</span></div><div id="trashbin">${TRASH}<span>Descartar</span></div>`;document.body.appendChild(d);}return d;}
function zoneAt(x,y){
  const tb=$('trashbin');if(drag.canDiscard&&tb){const r=tb.getBoundingClientRect();if(x>=r.left-10&&x<=r.right+10&&y>=r.top-10&&y<=r.bottom+10)return 'trash';}
  if(drag.kind==='hand'&&y<drag.useLine)return 'use';return null;}
document.addEventListener('pointerdown',e=>{
  if(e.button>0||!S||!inGame())return;
  const el=e.target.closest('.hand .card[data-uid], .traprail .card[data-trap]');if(!el)return;
  const hand=el.closest('.hand'),uid=el.dataset.uid||el.dataset.trap;
  drag.start={x:e.clientX,y:e.clientY,el,uid,kind:hand?'hand':'trap',id:e.pointerId};
},true);
document.addEventListener('pointermove',e=>{
  const st=drag.start;if(!st||e.pointerId!==st.id)return;
  const dx=e.clientX-st.x,dy=e.clientY-st.y;
  if(!drag.on){
    if(Math.hypot(dx,dy)<10)return;
    if(st.kind==='hand'&&Math.abs(dx)>Math.abs(dy)*1.2){drag.start=null;return;} // deslize lateral: rola a mão
    beginDrag(e);}
  e.preventDefault();
  drag.x=e.clientX;drag.y=e.clientY;drag.dx=dx;
  if(!drag.raf)drag.raf=requestAnimationFrame(dragFrame);
},{passive:false});
function dragFrame(){
  drag.raf=0;const g=drag.ghost;if(!drag.on||!g)return;
  g.style.transform=`translate3d(${drag.x-drag.ox}px,${drag.y-drag.oy}px,0) rotate(${Math.max(-12,Math.min(12,drag.dx/12))}deg) scale(1.08)`;
  const z=zoneAt(drag.x,drag.y);
  if(z!==drag.zone){drag.zone=z;
    $('usezone').classList.toggle('hot',z==='use');$('trashbin').classList.toggle('hot',z==='trash');
    g.classList.toggle('to-trash',z==='trash');
    if(z)SND.play('select');}
}
// no celular o navegador às vezes não manda o fim do toque como ponteiro: garante o fim pelo toque também
document.addEventListener('touchmove',e=>{if(drag.on)e.preventDefault();},{passive:false});
document.addEventListener('touchend',e=>{if(drag.on){const t=e.changedTouches&&e.changedTouches[0];endDrag(t?{clientX:t.clientX,clientY:t.clientY}:{clientX:drag.x,clientY:drag.y},!t);}},true);
document.addEventListener('touchcancel',()=>{if(drag.on)endDrag({clientX:drag.x,clientY:drag.y},true);},true);
function beginDrag(e){
  const st=drag.start;drag.on=true;drag.uid=st.uid;drag.kind=st.kind;drag.zone=null;
  const r=st.el.getBoundingClientRect();drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;
  const g=st.el.cloneNode(true);g.classList.add('dragghost');g.style.width=r.width+'px';g.style.height=r.height+'px';g.removeAttribute('data-uid');g.removeAttribute('data-trap');
  g.style.transform=`translate3d(${r.left}px,${r.top}px,0)`;drag.x=e.clientX;drag.y=e.clientY;drag.dx=0;
  document.body.appendChild(g);drag.ghost=g;st.el.classList.add('dragging');
  try{st.el.setPointerCapture(st.id);}catch(err){}
  const mine=myTurn();drag.canDiscard=mine&&(S.phase==='play'||S.phase==='ended')&&!S.discarded;
  const handEl=document.querySelector('.handwrap');drag.useLine=(handEl?handEl.getBoundingClientRect().top:innerHeight*.6)-10;
  const d=dragUI();d.className='on'+(st.kind==='hand'?' canuse':'')+(drag.canDiscard?' candiscard':'');
  const uz=$('usezone');uz.style.height=Math.max(80,drag.useLine)+'px';
  const tb=$('trashbin');tb.style.top=Math.max(90,drag.useLine-110)+'px';
  ui.sel=null;ui.selTrap=null;SND.play('select');
  try{navigator.vibrate&&navigator.vibrate(8);}catch(err){}
}
function endDrag(e,cancel){
  const st=drag.start;drag.start=null;if(!drag.on)return;
  drag.on=false;drag.pending=false;if(drag.raf){cancelAnimationFrame(drag.raf);drag.raf=0;}drag.justDropped=true;setTimeout(()=>drag.justDropped=false,350);
  const z=cancel?null:zoneAt(e.clientX,e.clientY),uid=drag.uid,kind=drag.kind;
  try{st&&st.el.releasePointerCapture(st.id);}catch(err){}
  if(drag.ghost)drag.ghost.remove();drag.ghost=null;const d=$('dragui');if(d)d.className='';
  if(st&&st.el)st.el.classList.remove('dragging');
  ui.sel=null;ui.selTrap=null;
  if(z==='trash'){const nm=CARD[S.cards[uid]].name;act({type:'discard',uid});toast(kind==='trap'?`${nm} foi desarmada e foi para o descarte.`:`${nm} foi para o descarte.`);return;}
  if(z==='use'){useCard(uid);return;}
  if(!z&&!myTurn())toast('Espere a sua vez para usar cartas.');
  render();
}
document.addEventListener('pointerup',e=>{if(drag.start&&e.pointerId===drag.start.id){if(drag.on)endDrag(e,false);else drag.start=null;}},true);
document.addEventListener('pointercancel',e=>{if(drag.start&&e.pointerId===drag.start.id){if(drag.on)endDrag(e,true);else drag.start=null;}},true);

document.addEventListener('input',e=>{
  if(e.target.id==='netname'){lsSet('damas-nome',cleanName(e.target.value));}
  if(e.target.id==='joincode'){const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(v!==e.target.value)e.target.value=v;ui.joinCode=v;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='joincode'){e.target.blur();netJoin(e.target.value);}});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(ui.dirty&&!(document.activeElement&&document.activeElement.tagName==='INPUT')){ui.dirty=false;render();}},0);});
function start(data){
  if(data&&data.S&&data.S.v===4){S=data.S;ui.screen=data.screen||'game';ui.tab=data.tab||'jogar';ui.mode=data.mode||2;if(data.setup)ui.setup=data.setup;}
  try{const q=new URLSearchParams(location.search).get('sala');if(q){ui.screen='online';ui.joinCode=q.toUpperCase().slice(0,4);}}catch(e){}
  render();tick();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

</script>
