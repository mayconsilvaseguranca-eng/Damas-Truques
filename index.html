<script>
/*ENGINE-START*/
/* =====================================================================
   NÚCLEO DO JOGO — estado puro e serializável + dispatch(ação).
   Funciona com 2 ou 3 jogadores. Para virar online: o servidor guarda
   `s`, recebe as mesmas ações e envia a cada jogador só o que ele pode
   ver. `s.fx` lista os eventos visuais da última ação.
   ===================================================================== */
const DIAG=[[-1,-1],[-1,1],[1,-1],[1,1]];
const eq=(a,b)=>!!(a&&b&&a[0]===b[0]&&a[1]===b[1]);
const cheb=(a,b)=>Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]));
let NAMES=null;const J=i=>NAMES&&NAMES[i]?NAMES[i]:'Jogador '+(i+1);
const SEATS={
  2:{N:8,parity:1,f:[[-1,0],[1,0]],ranks:3,files:[0,7]},
  3:{N:11,parity:0,f:[[-1,0],[0,1],[0,-1]],ranks:3,files:[0,5],handicap:{2:1}},
  4:{N:11,parity:0,f:[[-1,0],[0,1],[1,0],[0,-1]],ranks:3,files:[0,5],handicap:{}}
};
const inB=(s,r,c)=>r>=0&&r<s.N&&c>=0&&c<s.N;
const isDark=(s,r,c)=>(r+c)%2===s.parity;
const at=(s,r,c)=>s.board[r][c];
const FW=(s,o)=>s.f[o];
const perp=f=>f[0]?[0,1]:[1,0];
/* (vr,vc) na visão do jogador com direção f → casa real */
function viewToBoard(N,f,vr,vc){
  if(f[0]===-1)return[vr,vc];
  if(f[0]===1)return[N-1-vr,N-1-vc];
  if(f[1]===1)return[vc,N-1-vr];
  return[N-1-vc,vr];
}
const ownSq=(s,o,k,j)=>viewToBoard(s.N,FW(s,o),s.N-1-k,j);
function rankOf(s,o,[r,c]){const f=FW(s,o);if(f[0]===-1)return s.N-1-r;if(f[0]===1)return r;if(f[1]===1)return c;return s.N-1-c;}
const sq=(s,[r,c])=>'abcdefghijklmno'[c]+(s.N-r);
const wallAt=(s,r,c)=>s.walls.some(w=>w.r===r&&w.c===c&&s.turn<w.until);
const terrainAt=(s,r,c)=>s.terrain.find(t=>s.turn<t.until&&((t.r===r&&t.c===c)||(t.type==='portal'&&t.r2===r&&t.c2===c)));
/* Guarda Real: enquanto estiver ativa, as damas do dono e qualquer peça dele encostada numa dama ficam protegidas,
   mesmo que a dama se mova depois de a carta ser usada */
function guarded(s,p,pos){const P=s.players[p.owner];if(!P||!(P.guardUntil>s.turn))return false;if(p.king)return true;
  return adj(s,pos).some(([a,b])=>{const q=at(s,a,b);return q&&q.owner===p.owner&&q.king;});}
const shielded=(s,p,pos)=>p.shieldUntil>s.turn||(!!pos&&guarded(s,p,pos));
const frozen=(s,p)=>p.frozenUntil>s.turn;
const kingLike=(s,p)=>p.king||s.mods.crown===p.id;
const alive=s=>s.players.map((P,i)=>i).filter(i=>!s.players[i].out);
const opps=(s,me=s.current)=>alive(s).filter(i=>i!==me);
function forEachPiece(s,fn){for(let r=0;r<s.N;r++)for(let c=0;c<s.N;c++){const p=s.board[r][c];if(p)fn(p,r,c);}}
function piecesWhere(s,pred){const o=[];forEachPiece(s,(p,r,c)=>{if(pred(p,r,c))o.push([r,c]);});return o;}
function findPiece(s,id){let f=null;forEachPiece(s,(p,r,c)=>{if(p.id===id)f=[r,c];});return f;}
function rnd(s){s.seed=(s.seed+0x6D2B79F5)|0;let t=s.seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
const pick=(s,a)=>a[Math.floor(rnd(s)*a.length)];
function shuffle(s,a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd(s)*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function log(s,text,to,card){s.log.push({t:s.turn,p:s.current,text,to,card});}
function fx(s,ev){s.fx.push(ev);}
const freeSq=(s,r,c)=>inB(s,r,c)&&isDark(s,r,c)&&!at(s,r,c)&&!wallAt(s,r,c);
function emptySquares(s,noTerrain){const o=[];for(let r=0;r<s.N;r++)for(let c=0;c<s.N;c++)if(freeSq(s,r,c)&&!(noTerrain&&terrainAt(s,r,c)))o.push([r,c]);return o;}
const adj=(s,[r,c])=>DIAG.map(([a,b])=>[r+a,c+b]).filter(([a,b])=>inB(s,a,b));
const ownAdj=(s,pos,o)=>adj(s,pos).filter(([a,b])=>{const q=at(s,a,b);return q&&q.owner===o;}).length;
/* número do próximo turno do jogador o (contando só quem está vivo) */
function nextTurnOf(s,o){let i=s.current,k=0;for(let g=0;g<s.np*2;g++){i=(i+1)%s.np;if(!s.players[i].out){k++;if(i===o)return s.turn+k;}}return s.turn+s.np;}
const roundLen=s=>alive(s).length;
function homeSquares(s,o){for(let k=0;k<3;k++){const out=[];for(let j=0;j<s.N;j++){const[r,c]=ownSq(s,o,k,j);if(freeSq(s,r,c))out.push([r,c]);}if(out.length)return out;}return[];}
function newPiece(s,o){return{id:s.pid++,owner:o,king:false,shieldUntil:0,frozenUntil:0,doom:0};}

const DECKS={
  ataque:{name:'Ataque',blurb:'Fúria, punição e promoções rápidas. Quer resolver tudo na própria vez.'},
  defesa:{name:'Defesa',blurb:'Escudos, muralhas e segundas chances. Aguenta a pressão e contra-ataca.'},
  distancia:{name:'Distância',blurb:'Passos longos, deslizes laterais e teleportes. Chega antes no fundo.'},
  trapaceiro:{name:'Trapaceiro',blurb:'Congela, rouba, silencia e anula. Vive de blefe e armadilha.'},
  necromante:{name:'Necromante',blurb:'Perder peças não é tão ruim: ele usa as peças capturadas como recurso.'},
  arquiteto:{name:'Arquiteto',blurb:'Muda o próprio tabuleiro com gelo, portais, pontes e fossos escondidos.'},
  realeza:{name:'Realeza',blurb:'Gira em torno das damas. Começa lento e fica muito forte no fim.'},
  enxame:{name:'Enxame',blurb:'Força em grupo: peças juntas se protegem, cercam e emboscam.'},
  apostador:{name:'Apostador',blurb:'Dados, roleta e moedas. Imprevisível, para partidas caóticas.'},
  relojoeiro:{name:'Relojoeiro',blurb:'Controla o tempo: volta jogadas, atrasa cartas e faz o rival perder a vez.'}
};
const DCOLOR={ataque:'#ef5f3c',defesa:'#4f93ea',distancia:'#4fc07c',trapaceiro:'#b178ea',necromante:'#3fd6c6',arquiteto:'#a3acbf',realeza:'#e2568a',enxame:'#f2a93b',apostador:'#e4dd52',relojoeiro:'#c48a5e'};

/* remove peça (captura, carta ou armadilha) e anota o cemitério do dono */
function removePiece(s,[r,c],delay){
  const p=at(s,r,c);if(!p)return null;s.board[r][c]=null;
  const P=s.players[p.owner];P.grave++;P.lost++;if(p.king)P.kingsLost++;
  s.quiet=0;fx(s,{kind:'cap',pos:[r,c],owner:p.owner,delay:!!delay});return p;
}
function promote(s,pos){
  const p=at(s,...pos);if(!p||p.king)return false;
  p.king=true;s.quiet=0;fx(s,{kind:'promo',pos});
  for(const o of opps(s,p.owner)){const O=s.players[o];
    const u=O.traps.find(x=>CARD[s.cards[x]].trigger==='promo');if(!u)continue;
    O.traps=O.traps.filter(x=>x!==u);discard(s,u);p.king=false;
    fx(s,{kind:'trap',id:'decreto',player:o,text:`A peça em ${sq(s,pos)} não pôde virar dama.`,squares:[pos]});
    log(s,`Armadilha de ${J(o)}, Decreto: a promoção em ${sq(s,pos)} foi cancelada.`,undefined,'decreto');return false;}
  return true;
}

const CARD=Object.fromEntries(CARDS.map(c=>[c.id,c]));
function cercoSet(s){const me=s.current;return piecesWhere(s,(p,r,c)=>p.owner!==me&&!shielded(s,p,[r,c])&&piecesWhere(s,(q,a,b)=>q.owner===me&&cheb([a,b],[r,c])<=2).length>=3);}

function newGame(opts){
  const np=opts.decks.length,G=SEATS[np];
  const s={v:4,rules:{omni:!!opts.omni},discarded:false,np,N:G.N,parity:G.parity,f:G.f,seed:opts.seed|0,turn:1,current:0,phase:'pass',players:[],cards:{},owner:{},trapData:{},uid:1,pid:1,board:[],walls:[],terrain:[],

  for(let r=0;r<s.N;r++)s.board.push(Array(s.N).fill(null));
  opts.decks.forEach((d,i)=>{
    /* no jogo de 3, o Jogador 3 começa com 1 peça a menos para compensar a posição (ver testes) */
    let skip=(G.handicap&&G.handicap[i])||0;
    for(let k=0;k<G.ranks;k++)for(let j=G.files[0];j<=G.files[1];j++){const[r,c]=ownSq(s,i,k,j);if(isDark(s,r,c)){if(skip){skip--;continue;}s.board[r][c]=newPiece(s,i);}}
    const pile=[];CARDS.filter(c=>c.deck===d).forEach(c=>{for(let k=0;k<c.n;k++){const u='c'+(s.uid++);s.cards[u]=c.id;s.owner[u]=i;pile.push(u);}});
    shuffle(s,pile);
    s.players.push({deck:d,ctrl:(opts.ctrl&&opts.ctrl[i])||'human',pile,hand:[],traps:[],discard:[],silenced:0,grave:0,lost:0,lostMark:0,lostRecent:0,kingsLost:0,lastCard:null,out:false,skip:false});
    for(let k=0;k<3;k++)draw(s,i);
  });
  draw(s,0);s.fx=[];
  log(s,'A partida começou.');
  return s;
}
function draw(s,i){
  const P=s.players[i];if(P.hand.length>=5)return;
  if(!P.pile.length&&P.discard.length){
    P.pile=shuffle(s,P.discard);P.discard=[];
    fx(s,{kind:'banner',deck:P.deck,html:'Monte <span>reembaralhado</span>',sub:`${P.pile.length} cartas do descarte voltaram para o monte do ${J(i)}.`,dur:1900});
    log(s,`O monte do ${J(i)} acabou e o descarte foi reembaralhado.`);

  if(P.pile.length)P.hand.push(P.pile.pop());
}
/* cartas usadas e armadilhas disparadas vão para o descarte do dono; cópias do Espelho somem */
function discard(s,u){const o=s.owner[u];delete s.trapData[u];if(o!==undefined)s.players[o].discard.push(u);}

function captureSteps(s,r,c){
  const p=at(s,r,c),res=[];
  if(s.mods.noCapture)return res;
  for(const[dr,dc]of DIAG){
    if(kingLike(s,p)){
      let rr=r+dr,cc=c+dc;
      while(inB(s,rr,cc)&&!at(s,rr,cc)&&!wallAt(s,rr,cc)){rr+=dr;cc+=dc;}
      if(!inB(s,rr,cc)||wallAt(s,rr,cc))continue;
      const t=at(s,rr,cc);if(!t||t.owner===p.owner||shielded(s,t,[rr,cc]))continue;
      let lr=rr+dr,lc=cc+dc;
      while(inB(s,lr,lc)&&!at(s,lr,lc)&&!wallAt(s,lr,lc)){res.push({from:[r,c],to:[lr,lc],cap:[rr,cc]});lr+=dr;lc+=dc;}
    }else{
      const rr=r+dr,cc=c+dc,lr=r+2*dr,lc=c+2*dc;
      if(!inB(s,lr,lc))continue;
      const t=at(s,rr,cc);
      if(t&&t.owner!==p.owner&&!shielded(s,t,[rr,cc])&&!at(s,lr,lc)&&!wallAt(s,lr,lc))res.push({from:[r,c],to:[lr,lc],cap:[rr,cc]});
    }
  }
  return res;
}
function simpleSteps(s,r,c){
  const p=at(s,r,c),res=[],f=FW(s,p.owner),pp=perp(f),ok=(a,b)=>freeSq(s,a,b),mv=(a,b)=>res.push({from:[r,c],to:[a,b],cap:null});
  if(kingLike(s,p)){for(const[dr,dc]of DIAG){let a=r+dr,b=c+dc;while(ok(a,b)){mv(a,b);a+=dr;b+=dc;}}return res;}
  for(const sgn of[-1,1]){
    const dr=f[0]+sgn*pp[0],dc=f[1]+sgn*pp[1];
    if(ok(r+dr,c+dc)){mv(r+dr,c+dc);if(s.mods.longStep&&ok(r+2*dr,c+2*dc))mv(r+2*dr,c+2*dc);}
    else if(s.mods.bridge&&inB(s,r+dr,c+dc)){const q=at(s,r+dr,c+dc);if(q&&q.owner===p.owner&&ok(r+2*dr,c+2*dc))mv(r+2*dr,c+2*dc);}
    const br=-f[0]+sgn*pp[0],bc=-f[1]+sgn*pp[1];
    if((s.mods.retreat||(s.rules&&s.rules.omni))&&ok(r+br,c+bc))mv(r+br,c+bc);
    if(s.mods.slide&&ok(r+2*sgn*pp[0],c+2*sgn*pp[1]))mv(r+2*sgn*pp[0],c+2*sgn*pp[1]);
  }
  return res;
}
function legalMoves(s,ignoreFreeze){
  if(s.chain&&s.phase==='chain')return captureSteps(s,...s.chain.at);
  const caps=[],simp=[];
  forEachPiece(s,(p,r,c)=>{if(p.owner!==s.current)return;if(!ignoreFreeze&&frozen(s,p))return;if(s.mods.onlyPid&&p.id!==s.mods.onlyPid)return;caps.push(...captureSteps(s,r,c));simp.push(...simpleSteps(s,r,c));});
  if(caps.length&&!s.mods.noForce)return caps;
  return caps.concat(simp);
}

function effCard(s,uid){const c=CARD[s.cards[uid]];if(c.id!=='eco')return c;const l=s.players[s.current].lastCard;return l?CARD[l]:null;}
function oppChoices(s,c){return opps(s).filter(o=>!c.oppOk||c.oppOk(s,o));}
function cardBlock(s,uid){
  const P=s.players[s.current],c=CARD[s.cards[uid]];
  if(s.phase!=='play')return 'Agora não dá para usar cartas.';
  if(s.moved)return 'Cartas só podem ser usadas antes de mover.';
  if(s.cardPlayed)return 'Você já usou uma carta neste turno.';
  if(P.silenced===s.turn)return 'Você está silenciado neste turno.';
  if(c.kind==='armadilha'){if(P.traps.length>=2)return 'Você já tem 2 armadilhas armadas.';if(c.targets&&!c.targets(s).length)return 'Nenhuma casa vazia disponível.';return null;}
  const e=effCard(s,uid);
  if(!e)return 'Você ainda não usou nenhuma carta de ação para repetir.';
  if(e.can&&!e.can(s))return e.cantMsg||'Não dá para usar esta carta agora.';
  if(e.targets&&!e.targets(s).length)return 'Nenhum alvo válido agora.';
  if(e.pickOpp&&!oppChoices(s,e).length)return e.cantMsg||'Nenhum oponente válido.';
  return null;
}
function validTargets(s,e,target,dest,opp){
  if(e.targets){if(!target||!e.targets(s).some(t=>eq(t,target)))return 'Alvo inválido.';
    if(e.dests&&(!dest||!e.dests(s,target).some(t=>eq(t,dest))))return 'Destino inválido.';}
  if(e.pickOpp&&!oppChoices(s,e).includes(opp))return 'Escolha um oponente válido.';
  return null;

function playCard(s,uid,target,dest,opp){
  const me=s.current,P=s.players[me],c=CARD[s.cards[uid]];
  if(!P.hand.includes(uid))return 'Carta não está na mão.';
  const b=cardBlock(s,uid);if(b)return b;
  if(s.np===2&&opp===undefined)opp=opps(s)[0];
  if(c.kind==='armadilha'){
    if(c.targets){if(!target||!c.targets(s).some(t=>eq(t,target)))return 'Escolha uma casa válida.';s.trapData[uid]={pos:target};}
    P.hand=P.hand.filter(x=>x!==uid);s.cardPlayed=true;P.traps.push(uid);
    log(s,`${J(me)} armou uma armadilha virada para baixo.`);log(s,`Você armou ${c.name}${s.trapData[uid]?` em ${sq(s,s.trapData[uid].pos)}`:''}.`,me,c.id);fx(s,{kind:'arm',player:me,deck:P.deck});return null;
  }
  const e=effCard(s,uid);const bad=validTargets(s,e,target,dest,opp);if(bad)return bad;
  P.hand=P.hand.filter(x=>x!==uid);s.cardPlayed=true;
  const ev={kind:'card',id:c.id,echo:c.id==='eco'?e.id:null,player:me,squares:[target,dest].filter(Boolean),annulled:false,text:''};fx(s,ev);
  const res=resolveCard(s,e,{target,dest,opp},ev);

  log(s,`${J(me)} usou ${c.name}${c.id==='eco'?` (repetindo ${e.name})`:''}: ${res}`,undefined,c.id);
  afterEffects(s);

/* aplica a carta, deixando as armadilhas de carta dos oponentes reagirem */
function resolveCard(s,e,args,ev){
  const me=s.current;let annulled=false,delayed=false;const after=[];
  for(const o of opps(s)){const O=s.players[o];
    for(const u of[...O.traps]){const t=CARD[s.cards[u]];if(t.trigger!=='card')continue;
      const take=()=>{O.traps=O.traps.filter(x=>x!==u);discard(s,u);};
      if(t.id==='anular'&&!annulled&&!delayed){take();annulled=true;after.push({kind:'trap',id:'anular',player:o,text:`${e.name} foi anulada e não teve efeito.`,squares:[]});}
      else if(t.id==='azar'&&!annulled&&!delayed){take();
        if(rnd(s)<.5){annulled=true;after.push({kind:'trap',id:'azar',player:o,text:`Deu cara! ${e.name} foi anulada.`,squares:[]});}
        else{draw(s,o);after.push({kind:'trap',id:'azar',player:o,text:`Deu coroa. ${e.name} funciona, mas o ${J(o)} comprou 1 carta.`,squares:[]});}}
      else if(t.id==='ampulheta'&&!annulled&&!delayed){take();delayed=true;s.delayed.push({player:me,id:e.id,target:args.target,dest:args.dest,opp:args.opp,at:nextTurnOf(s,me)});
        after.push({kind:'trap',id:'ampulheta',player:o,text:`O efeito de ${e.name} foi adiado para o próximo turno do ${J(me)}.`,squares:[]});}
      else if(t.id==='espelho'){take();const nu='c'+(s.uid++);s.cards[nu]=e.id;O.hand.push(nu);after.push({kind:'trap',id:'espelho',player:o,text:`O ${J(o)} ganhou uma cópia de ${e.name}.`,squares:[]});}
      else if(t.id==='desabamento'){take();after.push({kind:'trap',id:'desabamento',player:o,late:true,text:'',squares:[]});}
    }}
  let text;
  if(annulled){ev.annulled=true;text=ev.text='Sem efeito.';}
  else if(delayed){ev.annulled=true;ev.delayed=true;text=ev.text='Efeito adiado.';}
  else{s._created=[];s._squares=null;text=ev.text=e.apply(s,args.target,args.dest,args.opp);if(s._squares)ev.squares=s._squares;if(s._roll)ev.roll=s._roll;s._roll=0;}
  for(const a of after){
    if(a.id==='desabamento'){const o=a.player;draw(s,o);let fell=0;
      if(!annulled&&!delayed){for(const w of s._created){s.walls=s.walls.filter(x=>x!==w);s.terrain=s.terrain.filter(x=>x!==w);fell++;}}
      a.text=fell?`O terreno criado desabou e o ${J(o)} comprou 1 carta.`:`O ${J(o)} comprou 1 carta.`;}
    fx(s,a);log(s,`Armadilha de ${J(a.player)}, ${CARD[a.id].name}: ${a.text}`,undefined,a.id);
  }
  s._created=[];
  return text;
}
function afterEffects(s){
  if(checkWin(s))return;
  if(s.players[s.current].out){s.phase='ended';return;}
}
function doMove(s,from,to){
  if(s.phase!=='play'&&s.phase!=='chain')return 'Agora não dá para mover.';
  const m=legalMoves(s).find(m=>eq(m.from,from)&&eq(m.to,to));if(!m)return 'Movimento inválido.';
  const p=at(s,...from);
  if(!s.chain)s.chain={origin:from,pid:p.id,caps:[],at:to};
  s.board[to[0]][to[1]]=p;s.board[from[0]][from[1]]=null;s.chain.at=to;s.moved=true;
  if(m.cap){const cp=at(s,...m.cap);removePiece(s,m.cap);s.chain.caps.push({pos:m.cap,piece:cp});

}

    if(t.type==='ice'){const prev=ch.prevAt||ch.origin,dr=Math.sign(r-prev[0]),dc=Math.sign(c-prev[1]);const n=[r+dr,c+dc];

    if(Math.abs(dr)===Math.abs(dc)&&dr){const u=[Math.sign(dr),Math.sign(dc)],b=[ch.origin[0]-u[0],ch.origin[1]-u[1]];
      if(inB(s,...b)){const q=at(s,...b);if(q&&q.owner===me&&!frozen(s,q)&&freeSq(s,...ch.origin)){s.board[ch.origin[0]][ch.origin[1]]=q;s.board[b[0]][b[1]]=null;

function count(s,o){let n=0;forEachPiece(s,p=>{if(p.owner===o)n++;});return n;}

    if(!n){s.players[i].out=true;log(s,`${J(i)} foi eliminado.`);if(s.np>2)fx(s,{kind:'banner',html:`${J(i)} <span>eliminado</span>`,dur:1600});}}

function dispatch(s,a){

/* =====================================================================
   BOT — olha 1 jogada à frente: testa cada carta possível e cada
   sequência de movimentos, e avalia material, avanço e ameaças.

function clone(s){
  return{...s,board:s.board.map(row=>row.map(p=>p&&{...p})),walls:s.walls.slice(),terrain:s.terrain.slice(),
    players:s.players.map(P=>({...P,pile:P.pile.slice(),hand:P.hand.slice(),traps:P.traps.slice(),discard:P.discard.slice()})),

function threatOn(s,me){

  const al=alive(s);if(al.length<2)return 0;
  let n=me;do{n=(n+1)%s.np;}while(s.players[n].out);
  const t=clone(s);t.current=n;t.turn=s.turn+1;t.mods={};t.chain=null;t.phase='play';
  const caps=legalMoves(t).filter(m=>m.cap);if(!caps.length)return 0;

  const dfs=(st,val,depth)=>{const ms=st.phase==='chain'?captureSteps(st,...st.chain.at):legalMoves(st).filter(m=>m.cap);
    if(!ms.length||depth>6){best=Math.max(best,val);return;}
    for(const m of ms.slice(0,8)){const c=clone(st),cp=at(c,...m.cap);const v=cp.owner===me?(cp.king?2.4:1):0;
      c.board[m.to[0]][m.to[1]]=at(c,...m.from);c.board[m.from[0]][m.from[1]]=null;c.board[m.cap[0]][m.cap[1]]=null;
      c.chain={at:m.to,caps:[]};c.phase='chain';dfs(c,val+v,depth+1);}};
  dfs(t,0,0);return best;

function evaluate(s,me){

  if(others.length){const ov=others.map(o=>val[o]+0.12*s.players[o].hand.length+0.15*s.players[o].traps.length+(s.players[o].skip?-1:0));

  for(const m of ms){const c=clone(s);doMove(c,m.from,m.to);
    let v;

function sample(a,n){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}

/* =====================================================================
   ONLINE — salas pela internet usando um servidor público de mensagens
   (MQTT por WebSocket). Quem cria a sala é o "anfitrião": roda as regras
   no próprio aparelho e manda para cada amigo só o que ele pode ver.
   ===================================================================== */
const MQ=(()=>{
  const te=new TextEncoder(),td=new TextDecoder();
  const cat=parts=>{let n=0;parts.forEach(p=>n+=p.length);const o=new Uint8Array(n);let k=0;parts.forEach(p=>{o.set(p,k);k+=p.length;});return o;};
  const u16=n=>new Uint8Array([n>>8&255,n&255]);
  const str=s=>{const b=te.encode(s);return cat([u16(b.length),b]);};
  const rem=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return new Uint8Array(o);};
  const pkt=(h,body)=>cat([new Uint8Array([h]),rem(body.length),body]);
  function Client(urls,opts){
    const me={connected:false,subs:new Set(),onmessage:null,onstatus:null,ended:false,url:null};
    let ws=null,buf=new Uint8Array(0),pingT=null,retryT=null,tries=0,pid=1,urlIdx=0,everOk=false;
    const status=s=>{me.status=s;me.onstatus&&me.onstatus(s);};
    function send(b){if(ws&&ws.readyState===1)try{ws.send(b);}catch(e){}}
    function open(){
      if(me.ended)return;const url=urls[urlIdx%urls.length];me.url=url;status('conectando');
      try{ws=new WebSocket(url,'mqtt');}catch(e){return fail();}
      ws.binaryType='arraybuffer';let okT=setTimeout(()=>{if(!me.connected)try{ws.close();}catch(e){}},7000);
      ws.onopen=()=>{
        const w=opts.will,flags=0x02|(w?0x04|(w.retain?0x20:0):0);
        const vh=cat([str('MQTT'),new Uint8Array([4,flags]),u16(opts.keepalive||30)]);
        const pl=[str(opts.clientId+'-'+Math.random().toString(36).slice(2,7))];
        if(w)pl.push(str(w.topic),str(w.payload||''));
        send(pkt(0x10,cat([vh,...pl])));};
      ws.onmessage=e=>{buf=cat([buf,new Uint8Array(e.data)]);
        for(;;){if(buf.length<2)return;let m=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*m;m*=128;}while(b&128);
          if(buf.length<i+len)return;const h=buf[0],body=buf.slice(i,i+len);buf=buf.slice(i+len);
          const type=h>>4;
          if(type===2){clearTimeout(okT);if(body[1]!==0){try{ws.close();}catch(e){}return;}
            me.connected=true;everOk=true;tries=0;status('ok');
            me.subs.forEach(t=>subPkt(t));
            clearInterval(pingT);pingT=setInterval(()=>send(new Uint8Array([0xc0,0])),(opts.keepalive||30)*600);
            me.onconnect&&me.onconnect();}
          else if(type===3){const n=(body[0]<<8)|body[1];const topic=td.decode(body.slice(2,2+n));let p=2+n;if((h>>1)&3)p+=2;
            let txt=td.decode(body.slice(p));try{me.onmessage&&me.onmessage(topic,txt,!!(h&1));}catch(err){console.error(err);}}
        }};
      ws.onclose=()=>{clearTimeout(okT);clearInterval(pingT);const was=me.connected;me.connected=false;buf=new Uint8Array(0);if(!was&&!everOk)urlIdx++;fail();};
      ws.onerror=()=>{};
    }
    function fail(){if(me.ended)return;status(tries>2?'erro':'conectando');clearTimeout(retryT);retryT=setTimeout(open,Math.min(8000,800*2**tries++));}
    function subPkt(t){send(pkt(0x82,cat([u16(pid++&0xffff||1),str(t),new Uint8Array([0])])));}
    me.sub=t=>{me.subs.add(t);if(me.connected)subPkt(t);};
    me.unsub=t=>{me.subs.delete(t);if(me.connected)send(pkt(0xa2,cat([u16(pid++&0xffff||1),str(t)])));};
    me.pub=(t,payload,retain)=>{if(!me.connected)return false;send(pkt(0x30|(retain?1:0),cat([str(t),te.encode(payload)])));return true;};
    me.end=()=>{me.ended=true;clearTimeout(retryT);clearInterval(pingT);if(ws){send(new Uint8Array([0xe0,0]));setTimeout(()=>{try{ws.close();}catch(e){}},60);}me.connected=false;};
    me.kick=()=>{if(me.ended)return;tries=0;clearTimeout(retryT);if(!me.connected&&(!ws||ws.readyState>1))open();};
    open();return me;
  }
  return{Client};
})();

const NET={on:false,role:null,code:null,seat:null,id:null,lobby:null,rooms:{},cli:null,status:'off',hostSeen:0,hostLost:false,guests:{},timers:[]};
const NETP='damastruques/v1/';
const BROKERS=(()=>{let o=null;try{o=new URLSearchParams(location.search).get('broker')||localStorage.getItem('damas-broker');}catch(e){}
  return o?[o]:['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];})();
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}};
const lsSet=(k,v)=>{try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}};
function netId(){let id=lsGet('damas-id',null);if(!id){id=Math.random().toString(36).slice(2,10);lsSet('damas-id',id);}return id;}
function netName(){return lsGet('damas-nome','');}
const cleanName=n=>String(n||'').replace(/[<>]/g,'').trim().slice(0,16);

function netClient(will){
  if(NET.cli)NET.cli.end();
  const c=MQ.Client(BROKERS,{clientId:'dt-'+netId(),keepalive:20,will});
  c.onstatus=s=>{NET.status=s;if(ui.screen==='online'||ui.screen==='lobby')render();};
  c.onmessage=netOnMessage;
  c.onconnect=()=>{if(NET.role==='host')netHostRefresh(true);else if(NET.role==='guest')netSend({t:'hello',name:netName()});};
  NET.cli=c;return c;
}
function netBrowse(){
  if(!NET.cli)netClient(null);
  NET.cli.sub(NETP+'rooms/+');
}
function netStopTimers(){NET.timers.forEach(clearInterval);NET.timers=[];}
function netLeave(silent){
  netStopTimers();
  if(NET.cli){
    if(NET.role==='host'){NET.cli.pub(NETP+'rooms/'+NET.code,'',true);NET.cli.pub(NETP+'r/'+NET.code+'/all',JSON.stringify({t:'closed'}));lsSet('damas-online-host',null);}
    else if(NET.role==='guest'){netSend({t:'bye'});lsSet('damas-online-guest',null);}
  }
  const c=NET.cli;NET.cli=null;if(c)setTimeout(()=>c.end(),150);
  Object.assign(NET,{on:false,role:null,code:null,seat:null,lobby:null,guests:{},hostLost:false});
  NAMES=null;
  if(!silent){S=null;ui.screen='online';ui.quit=false;netBrowse();render();}
}
const code4=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s;};
const randDeck=()=>{const D=Object.keys(DECKS);return D[Math.floor(Math.random()*D.length)];};

/* ---------- anfitrião ---------- */
function netCreate(np){
  const name=cleanName(netName());if(!name){toast('Digite o seu nome primeiro.');return;}
  const code=code4(),id=netId();
  Object.assign(NET,{on:true,role:'host',code,seat:0,id,guests:{}});
  NET.lobby={code,np,omni:false,status:'lobby',seats:[{kind:'host',id,name,deck:lsGet('damas-deck',randDeck())}]};
  for(let i=1;i<np;i++)NET.lobby.seats.push({kind:'open'});
  netHostStart();
}
function netHostStart(){
  const c=netClient({topic:NETP+'rooms/'+NET.code,payload:'',retain:true});
  c.sub(NETP+'rooms/+');c.sub(NETP+'r/'+NET.code+'/h');
  netStopTimers();
  NET.timers.push(setInterval(netHostBeat,4000));
  ui.screen=S&&NET.lobby.status==='jogando'?'game':'lobby';ui.tab='jogar';render();
}
function netHostSave(){lsSet('damas-online-host',JSON.stringify({code:NET.code,lobby:NET.lobby,S:S&&S.phase!=='over'?{...S,log:S.log.slice(-60),fx:[]}:null,t:Date.now()}));}
function netResumeHost(){
  let d=null;try{d=JSON.parse(lsGet('damas-online-host','null'));}catch(e){}
  if(!d){toast('Não há sala para retomar.');return;}
  Object.assign(NET,{on:true,role:'host',code:d.code,seat:0,id:netId(),guests:{},lobby:d.lobby});
  S=d.S;if(!S&&NET.lobby.status==='jogando')NET.lobby.status='lobby';
  if(S){NAMES=S.names||null;lastOrient=null;ui.pending=[];}
  netHostStart();if(S)tick();
}
function netRoomInfo(){const L=NET.lobby;return{code:NET.code,name:L.seats[0].name,np:L.np,taken:L.seats.filter(x=>x.kind==='host'||x.kind==='guest').length,
  open:L.seats.filter(x=>x.kind==='open').length,status:L.status,ts:Date.now()};}
function netHostRefresh(all){
  if(!NET.cli)return;
  NET.cli.pub(NETP+'rooms/'+NET.code,JSON.stringify(netRoomInfo()),true);
  NET.cli.pub(NETP+'r/'+NET.code+'/all',JSON.stringify({t:'lobby',lobby:NET.lobby}));
  if(all&&S&&NET.lobby.status==='jogando')netSync([],null,null);
}
let netRoomBeat=0;
function netHostBeat(){
  if(NET.role!=='host'||!NET.cli)return;
  NET.cli.pub(NETP+'r/'+NET.code+'/all',JSON.stringify({t:'hb'}));
  if(++netRoomBeat%6===0)NET.cli.pub(NETP+'rooms/'+NET.code,JSON.stringify(netRoomInfo()),true);
  const now=Date.now();let changed=false;
  NET.lobby.seats.forEach((st,i)=>{if(st.kind!=='guest')return;const g=NET.guests[st.id];const last=g?g.last:0;
    const off=now-last>16000;if(off!==!!st.off){st.off=off;changed=true;
      if(S&&NET.lobby.status==='jogando'&&S.players[i]){
        if(off&&S.players[i].ctrl==='remote'){S.players[i].ctrl='bot';log(S,`${J(i)} perdeu a conexão. Um bot joga no lugar até ele voltar.`);netSync([],null,null);tick();}
      }else if(off&&NET.lobby.status==='lobby'){Object.assign(st,{kind:'open',id:null,name:null,off:false});}}});
  if(changed){netHostRefresh(false);render();}
}
function netGuestSeat(id){return NET.lobby?NET.lobby.seats.findIndex(x=>x.kind==='guest'&&x.id===id):-1;}
function netTo(id,msg){NET.cli&&NET.cli.pub(NETP+'r/'+NET.code+'/g/'+id,JSON.stringify(msg));}
function netHostMsg(m){
  const L=NET.lobby,id=m.id;if(!id)return;
  if(m.t==='bye'&&m.soft){NET.guests[id]=Object.assign(NET.guests[id]||{},{last:0});netHostBeat();return;}
  NET.guests[id]=Object.assign(NET.guests[id]||{},{last:Date.now()});
  if(m.t==='hello'){
    let i=netGuestSeat(id);const name=cleanName(m.name)||'Convidado';
    if(i<0){if(L.status!=='lobby'){netTo(id,{t:'nope',why:'A partida desta sala já começou.'});return;}
      i=L.seats.findIndex(x=>x.kind==='open');if(i<0){netTo(id,{t:'nope',why:'A sala está cheia.'});return;}
      L.seats[i]={kind:'guest',id,name,deck:m.deck&&DECKS[m.deck]?m.deck:randDeck()};
      toast(`${name} entrou na sala.`);SND.play('select');}
    else{L.seats[i].name=name;L.seats[i].off=false;L.seats[i].left=false;
      if(S&&S.players[i]&&S.players[i].ctrl==='bot'&&!S.players[i].out){S.players[i].ctrl='remote';S.players[i].left=false;log(S,`${J(i)} voltou para a partida.`);}}
    netTo(id,{t:'joined',seat:i,lobby:L});netHostRefresh(false);
    if(S&&L.status==='jogando')netSync([],null,null);
    render();return;}
  const i=netGuestSeat(id);if(i<0)return;
  if(m.t==='deck'&&L.status==='lobby'&&DECKS[m.deck]){L.seats[i].deck=m.deck;netHostRefresh(false);render();}
  else if(m.t==='act'&&S&&L.status==='jogando'){if(S.current!==i||S.players[i].ctrl!=='remote'){netTo(id,{t:'err',msg:'Não é a sua vez.'});netSync([],null,null);return;}act(m.a,i);}
  else if(m.t==='bye'){
    if(L.status==='lobby'){toast(`${L.seats[i].name} saiu da sala.`);L.seats[i]={kind:'open'};}
    else if(S&&S.players[i]){L.seats[i].off=true;L.seats[i].left=true;if(S.players[i].ctrl!=='bot'){S.players[i].ctrl='bot';S.players[i].left=true;log(S,`${J(i)} saiu da sala. Um bot assume o lugar dele.`);netSync([],null,null);tick();}}
    netHostRefresh(false);render();}
}
function netSetNp(np){
  const L=NET.lobby;if(L.status!=='lobby'||np===L.np)return;
  const guests=L.seats.filter(x=>x.kind==='guest');
  if(1+guests.length>np){toast('Tem gente demais na sala para esse número de jogadores.');return;}
  const keep=[L.seats[0],...guests];while(keep.length<np)keep.push({kind:'open'});
  L.np=np;L.seats=keep;netHostRefresh(false);render();
}
function netBeginGame(){
  const L=NET.lobby;
  L.seats.forEach(st=>{if(st.kind==='open')Object.assign(st,{kind:'bot',deck:st.deck||randDeck()});});
  const names=L.seats.map((st,i)=>st.kind==='bot'?'Bot '+(i+1):st.name);
  S=newGame({decks:L.seats.map(x=>x.deck||randDeck()),ctrl:L.seats.map(x=>x.kind==='host'?'human':x.kind==='guest'?'remote':'bot'),seed:Date.now()&0x7fffffff,omni:L.omni});
  S.names=names;NAMES=names;
  L.status='jogando';ui.screen='game';lastOrient=null;ui.pending=[];ui.orient=0;
  lsSet('damas-deck',L.seats[0].deck);
  netHostRefresh(false);netSync([],null,null);render();tick();window.scrollTo(0,0);
}
function netBackToLobby(){
  const L=NET.lobby;L.status='lobby';S=null;
  L.seats.forEach(st=>{if(st.kind==='bot')st.kind='open';if(st.kind==='guest'&&st.left)Object.assign(st,{kind:'open',id:null,name:null,left:false,off:false});});
  NET.cli&&NET.cli.pub(NETP+'r/'+NET.code+'/all',JSON.stringify({t:'tolobby'}));
  ui.screen='lobby';netHostRefresh(false);render();
}
/* o que cada jogador pode ver: sem a mão e as armadilhas dos outros, sem a ordem dos montes */
function viewFor(s,seat){
  const v=JSON.parse(JSON.stringify({...s,fx:[],_created:[],log:[]}));
  v.log=s.log.filter(l=>l.to===undefined||l.to===seat).slice(-50);v.seed=0;
  s.players.forEach((P,j)=>{
    P.pile.forEach(u=>{delete v.cards[u];delete v.owner[u];});v.players[j].pile=P.pile.map((_,k)=>'?'+j+'_'+k);
    if(j!==seat){P.hand.forEach(u=>delete v.cards[u]);P.traps.forEach(u=>{delete v.cards[u];delete v.trapData[u];});}
    v.players[j].ctrl=j===seat?'human':P.ctrl==='bot'?'bot':'remote';});
  return v;
}
function netSync(evs,a,by){
  if(NET.role!=='host'||!S||!NET.cli)return;
  NET.lobby.seats.forEach((st,i)=>{if(st.kind!=='guest'||st.left)return;
    netTo(st.id,{t:'state',S:viewFor(S,i),evs:evs||[],a:a&&a.type,by});});
  netHostSave();
}

/* ---------- convidado ---------- */
function netJoin(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  const name=cleanName(netName());if(!name){toast('Digite o seu nome primeiro.');return;}
  if(code.length!==4){toast('O código da sala tem 4 letras ou números.');return;}
  Object.assign(NET,{on:true,role:'guest',code,seat:null,id:netId(),lobby:null,hostLost:false,joining:Date.now()});
  const c=netClient({topic:NETP+'r/'+code+'/h',payload:JSON.stringify({t:'bye',id:netId(),soft:true}),retain:false});
  c.sub(NETP+'r/'+code+'/g/'+NET.id);c.sub(NETP+'r/'+code+'/all');
  NET.hostSeen=Date.now();
  netStopTimers();
  NET.timers.push(setInterval(()=>{
    if(NET.role!=='guest')return;netSend({t:'ping'});
    if(NET.seat===null&&Date.now()-NET.joining>10000&&NET.cli&&NET.cli.connected){netLeave(true);ui.screen='online';netBrowse();toast('A sala não respondeu. Ela pode ter sido fechada.');render();return;}
    const lost=Date.now()-NET.hostSeen>15000;if(lost!==NET.hostLost){NET.hostLost=lost;render();}
  },4000));
  lsSet('damas-online-guest',JSON.stringify({code,t:Date.now()}));
  ui.screen='lobby';render();
}
function netSend(m){if(NET.cli&&NET.code)NET.cli.pub(NETP+'r/'+NET.code+'/h',JSON.stringify({...m,id:NET.id}));}
function netGuestMsg(m){
  NET.hostSeen=Date.now();if(NET.hostLost){NET.hostLost=false;render();}
  if(m.t==='hb')return;
  if(m.t==='nope'){netLeave(true);ui.screen='online';netBrowse();toast(m.why);render();return;}
  if(m.t==='closed'){netLeave(true);S=null;ui.screen='online';netBrowse();toast('O anfitrião fechou a sala.');render();return;}
  if(m.t==='joined'){NET.seat=m.seat;NET.lobby=m.lobby;if(!S)ui.screen='lobby';render();return;}
  if(m.t==='lobby'){NET.lobby=m.lobby;const i=NET.lobby.seats.findIndex(x=>x.id===NET.id);if(i>=0)NET.seat=i;if(ui.screen==='lobby')render();return;}
  if(m.t==='tolobby'){S=null;ui.screen='lobby';render();return;}
  if(m.t==='err'){toast(m.msg);SND.play('error');return;}
  if(m.t==='state'){
    const fresh=!S||ui.screen!=='game';
    S=m.S;NAMES=S.names||null;
    if(NET.seat===null){const i=S.players.findIndex(P=>P.ctrl==='human');if(i>=0)NET.seat=i;}
    if(fresh){ui.screen='game';ui.tab='jogar';lastOrient=null;ui.pending=[];ui.orient=NET.seat||0;}
    const P=S.players[NET.seat];
    if(m.by===NET.seat||!P||(ui.sel&&!P.hand.includes(ui.sel))||(ui.tgt&&!P.hand.includes(ui.tgt))||S.current!==NET.seat){ui.sel=null;ui.selTrap=null;ui.tgt=null;ui.confirm=null;ui.askMove=null;}
    ui.piece=(S.phase==='chain'&&S.chain&&myTurn())?S.chain.at:null;ui.waitNet=false;
    if(m.a==='move')SND.play('move');else if(m.a==='discard')SND.play('discard');
    render();
    if(S.phase==='over'&&m.a){setTimeout(()=>FX.confetti(),300);SND.play(S.winner===NET.seat?'win':'lose');}
    const evs=m.evs||[];
    if(evs.length)requestAnimationFrame(()=>setTimeout(()=>enqueueFx(evs),m.a==='move'?220:0));else tick();
  }
}
function netResumeGuest(){let d=null;try{d=JSON.parse(lsGet('damas-online-guest','null'));}catch(e){}if(d)netJoin(d.code);}

function netOnMessage(topic,txt){
  if(topic.startsWith(NETP+'rooms/')){const code=topic.slice((NETP+'rooms/').length);
    if(!txt){delete NET.rooms[code];}else{try{NET.rooms[code]=JSON.parse(txt);}catch(e){}}
    if(ui.screen==='online')render();return;}
  let m;try{m=JSON.parse(txt);}catch(e){return;}
  if(NET.role==='host'&&topic===NETP+'r/'+NET.code+'/h')netHostMsg(m);
  else if(NET.role==='guest')netGuestMsg(m);
}

function tutState(L){
  const s=newGame({decks:['ataque','defesa'],ctrl:['human','remote'],seed:11});
  for(let r=0;r<s.N;r++)for(let c=0;c<s.N;c++)s.board[r][c]=null;
  (L.mine||[]).forEach(([r,c,k])=>{const p=newPiece(s,0);p.king=!!k;s.board[r][c]=p;});
  (L.foe||[]).forEach(([r,c,k])=>{const p=newPiece(s,1);p.king=!!k;s.board[r][c]=p;});
  s.players.forEach(P=>{P.hand=[];P.pile=[];P.discard=[];P.traps=[];});
  (L.hand||[]).forEach((id,k)=>{const u='t'+k;s.cards[u]=id;s.owner[u]=0;s.players[0].hand.push(u);});
  s.phase='play';s.current=0;s.turn=1;s.log=[];s.fx=[];s.names=['Você','Treinador'];
  return s;
}
function tutStart(i){
  i=Math.max(0,Math.min(TUT.length-1,i|0));
  clearTimeout(tickT);clearTimeout(autoT);autoT=null;autoKey=null;
  S=tutState(TUT[i]);NAMES=S.names;
  ui.tut={i,moves:0,foe0:count(S,1),done:false,res:null,armed:false,oppDone:false};
  ui.screen='game';ui.tab='jogar';ui.orient=0;lastOrient=null;ui.pending=[];
  ui.sel=ui.selTrap=ui.tgt=ui.confirm=ui.askMove=ui.piece=null;ui.noAsk=false;
  if(TUT[i].demo){ui.tut.done=true;ui.tut.scene=0;tutScene(ui.tut);}
  render();window.scrollTo(0,0);
}
/* demonstração automática das regras de damas, numa velocidade tranquila */
function tutScene(T){
  const L=TUT[T.i],sc=L.scenes[T.scene];if(!sc)return;
  const wait=(ms,f)=>setTimeout(()=>{if(ui.tut===T)f();},reduce?Math.min(ms,150):ms);
  S=tutState(sc);NAMES=S.names;T.cap=sc.cap;ui.piece=null;lastOrient=null;render();
  let k=0;
  const step=()=>{const mv=sc.moves[k];if(!mv){wait(1700,()=>{T.scene++;if(T.scene<L.scenes.length)tutScene(T);else tutAdvance(T);});return;}
    ui.piece=mv[0];render();SND.play('select');
    wait(1000,()=>{ui.piece=null;const e=dispatch(S,{type:'move',from:mv[0],to:mv[1]});SND.play(e?'error':'move');const evs=S.fx.slice();render();if(evs.length)enqueueFx(evs);k++;wait(k<sc.moves.length?900:600,step);});};
  wait(900,step);
}
/* lição concluída: segue direto para a próxima */
function tutAdvance(T){if(ui.tut!==T)return;const n=T.i+1;toast(n>=TUT.length?'Tutorial concluído!':'Muito bem!');if(n>=TUT.length)tutFinish();else tutStart(n);}
function tutAfter(a,e,by){
  const T=ui.tut;if(!T||T.done||e)return;const L=TUT[T.i];
  if(a.type==='move'&&by===0)T.moves++;
  if(a.type==='play'&&by===0&&CARD[S.cards[a.uid]]&&CARD[S.cards[a.uid]].kind==='armadilha')T.armed=true;
  if(L.opp&&a.type==='ready'&&S.current===1){tutOppMove(T,L);return;}
  const r=L.check(S,T);
  if(r){T.done=true;T.res=r;clearTimeout(tickT);clearTimeout(autoT);autoT=null;
    if(r==='ok')try{SND.play('win');}catch(err){}
    const show=()=>{if(ui.tut!==T)return;if(fxBusy||fxQ.length){setTimeout(show,250);return;}
      if(r==='ok'){if(L.slow){T.okShown=true;render();setTimeout(()=>tutAdvance(T),4200);}else tutAdvance(T);return;}T.show=true;renderOverlay();};
    setTimeout(show,r==='ok'?1100:450);}
}
/* jogada do treinador na lição de armadilha: devagar, para dar tempo de entender */
function tutOppMove(T,L){
  const go=()=>{if(ui.tut!==T||S.current!==1||S.phase!=='play')return;if(fxBusy||fxQ.length){setTimeout(go,250);return;}
    const a=L.opp(S);T.cap='Vez do Treinador. Veja o que ele faz com a sua peça…';render();
    setTimeout(()=>{if(ui.tut!==T)return;
      if(a.from){const el=sqEl(a.from);if(el)el.classList.add('tut-foe');}
      setTimeout(()=>{if(ui.tut!==T)return;
        const mover=a.from?at(S,...a.from):null,keep=mover&&{...mover};
        const e=dispatch(S,a);SND.play(e?'error':'move');const evs=S.fx.slice();
        const now=evs.filter(x=>x.kind!=='trap'),later=evs.filter(x=>x.kind==='trap');
        // mostra primeiro a captura com a peça dele ainda no tabuleiro; a armadilha vem depois
        const ghost=keep&&later.length&&!at(S,...a.to);if(ghost)S.board[a.to[0]][a.to[1]]=keep;
        render();if(now.length)enqueueFx(now);
        setTimeout(()=>{if(ui.tut!==T)return;
          if(later.length){enqueueFx(later);setTimeout(()=>{if(ghost&&ui.tut===T){S.board[a.to[0]][a.to[1]]=null;render();}},700);}
          T.oppDone=true;tutAfter({type:'check'},null,1);},1700);
      },1300);
    },900);};
  setTimeout(go,600);
}
function tutQuit(){ui.tut=null;S=null;NAMES=null;ui.screen='menu';render();window.scrollTo(0,0);}
function tutFinish(){ui.tut=null;S=null;NAMES=null;lsSet('damas-tutorial','1');ui.screen='tutclasses';render();window.scrollTo(0,0);}

/* =====================================================================
   SOM: tudo sintetizado na hora com Web Audio (sem arquivos).
   Música de fundo gerada por tema + efeitos com o "timbre" do tema.
   ===================================================================== */
const SND=(()=>{
  let ctx=null,musicG=null,sfxG=null,verb=null,timer=null,started=false,step=0,nextT=0;
  const st={music:true,sfx:true,mv:0.55,sv:0.8};
  try{Object.assign(st,JSON.parse(localStorage.getItem('damas-som')||'{}'));}catch(e){}
  const save=()=>{try{localStorage.setItem('damas-som',JSON.stringify(st));}catch(e){}};
  const th=()=>(typeof tema==='string'?tema:'original');
  const hz=m=>440*Math.pow(2,(m-69)/12);

  function init(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{ctx=new AC();}catch(e){return false;}
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ctx.destination);
    musicG=ctx.createGain();sfxG=ctx.createGain();musicG.connect(comp);sfxG.connect(comp);
    // eco suave só para a música
    verb=ctx.createDelay(1);verb.delayTime.value=.27;const fb=ctx.createGain();fb.gain.value=.28;const wet=ctx.createGain();wet.gain.value=.22;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
    verb.connect(lp);lp.connect(fb);fb.connect(verb);lp.connect(wet);wet.connect(musicG);
    apply();
    document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume();});
    return true;
  }
  function apply(){if(!ctx)return;const t=ctx.currentTime;
    musicG.gain.setTargetAtTime(st.music?st.mv*.5:0,t,.15);sfxG.gain.setTargetAtTime(st.sfx?st.sv*.75:0,t,.05);}
  function unlock(){if(!init())return;if(ctx.state==='suspended')ctx.resume();if(!started)startMusic();}

  /* ---------- peças básicas ---------- */
  function tone(o){
    const t=o.t??ctx.currentTime,dur=o.d??.2,peak=o.g??.3,a=o.a??.004;
    const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.f,t);if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide||dur));
    if(o.det)osc.detune.value=o.det;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);
    if(o.hold)g.gain.setValueAtTime(peak,t+a+o.hold);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let n=osc;if(o.filt){const f=ctx.createBiquadFilter();f.type=o.filt;f.frequency.setValueAtTime(o.ff||1500,t);if(o.ff2)f.frequency.exponentialRampToValueAtTime(o.ff2,t+dur);f.Q.value=o.q||.8;osc.connect(f);n=f;}
    n.connect(g);g.connect(o.dest||sfxG);if(o.send)g.connect(verb);osc.start(t);osc.stop(t+dur+.05);
  }
  let nb=null;
  function noise(o){
    if(!nb){nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    const t=o.t??ctx.currentTime,dur=o.d??.1,src=ctx.createBufferSource();src.buffer=nb;
    const f=ctx.createBiquadFilter();f.type=o.filt||'bandpass';f.frequency.setValueAtTime(o.ff||1200,t);if(o.ff2)f.frequency.exponentialRampToValueAtTime(o.ff2,t+dur);f.Q.value=o.q||1;
    const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.g??.3,t+(o.a||.003));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(f);f.connect(g);g.connect(o.dest||sfxG);src.start(t,Math.random()*.5);src.stop(t+dur+.05);
  }
  const arp=(notes,gap,fn)=>{const t0=ctx.currentTime;notes.forEach((m,i)=>fn(m,t0+i*gap));};

  /* ---------- efeitos ---------- */
  const FX={
    move(){const x=th();
      if(x==='neon'){tone({f:660,f2:990,d:.09,type:'square',g:.12,filt:'lowpass',ff:3000});return;}
      if(x==='brinquedo'){tone({f:260,f2:560,d:.16,type:'sine',g:.3,glide:.08});tone({f:520,d:.08,type:'triangle',g:.08,t:ctx.currentTime+.06});return;}
      noise({ff:x==='taverna'?1300:1800,q:3,d:.06,g:.35});tone({f:x==='taverna'?150:190,f2:90,d:.12,g:.32});},
    select(){const x=th();if(x==='neon')tone({f:1320,d:.05,type:'square',g:.06});else if(x==='brinquedo')tone({f:880,f2:1100,d:.07,g:.15});else noise({ff:3200,q:5,d:.03,g:.15});},
    click(){if(th()==='neon')tone({f:990,d:.03,type:'square',g:.04});else noise({ff:2600,q:4,d:.025,g:.08});},
    capture(){const x=th();
      if(x==='neon'){tone({f:880,f2:110,d:.28,type:'sawtooth',g:.16,filt:'lowpass',ff:2400,ff2:300});noise({filt:'highpass',ff:3000,d:.12,g:.12});return;}
      if(x==='brinquedo'){tone({f:700,f2:180,d:.25,type:'triangle',g:.3});noise({ff:900,q:2,d:.08,g:.15});return;}
      noise({ff:900,q:1.5,d:.14,g:.45});tone({f:120,f2:55,d:.25,g:.4});noise({filt:'highpass',ff:3500,d:.08,g:.12,t:ctx.currentTime+.02});},
    promote(){const x=th(),base=x==='taverna'?62:x==='neon'?72:67,type=x==='neon'?'square':x==='brinquedo'?'sine':'triangle';
      arp([0,4,7,12,16].map(s=>base+s),.07,(m,t)=>tone({f:hz(m),d:.35,type,g:x==='neon'?.08:.16,t}));},
    card(){const x=th();
      noise({filt:'bandpass',ff:500,ff2:4500,q:.8,d:.32,g:.22,a:.08});
      const t0=ctx.currentTime+.18,type=x==='neon'?'square':x==='brinquedo'?'sine':'triangle',root=x==='taverna'?74:x==='neon'?79:76;
      [0,7,12].forEach((s,i)=>tone({f:hz(root+s),d:.4,type,g:x==='neon'?.06:.12,t:t0+i*.05,send:true}));},
    annul(){tone({f:440,f2:110,d:.45,type:'sawtooth',g:.14,filt:'lowpass',ff:1600,ff2:200});noise({ff:300,q:1,d:.2,g:.2});},
    arm(){const x=th();tone({f:hz(x==='neon'?45:43),d:.7,type:'sine',g:.3,a:.03});tone({f:hz(58),d:.6,type:'triangle',g:.08,a:.05,det:15});noise({ff:600,q:4,d:.12,g:.1,t:ctx.currentTime+.05});},
    trap(){const x=th(),type=x==='neon'?'square':'sawtooth';
      [0,1,6].forEach(s=>tone({f:hz(57+s),d:.55,type,g:.07,filt:'lowpass',ff:2200,a:.01}));
      tone({f:110,f2:45,d:.5,g:.35});noise({ff:1800,q:.7,d:.25,g:.2});},
    turn(){const x=th(),r=x==='taverna'?62:x==='neon'?67:x==='brinquedo'?72:64,t0=ctx.currentTime;
      // dois toques suaves e graves, ataque lento, sem harmônicos agudos
      tone({f:hz(r),d:1.1,type:'sine',g:.07,a:.04,t:t0,send:true});
      tone({f:hz(r+7),d:1.2,type:'sine',g:.05,a:.05,t:t0+.16,send:true});},
    discard(){noise({ff:2200,ff2:600,q:1,d:.18,g:.18,a:.02});},
    shuffle(){for(let i=0;i<9;i++)noise({ff:2500+Math.random()*1500,q:2,d:.04,g:.12,t:ctx.currentTime+i*.035});},
    extra(){arp([72,76,79],.06,(m,t)=>tone({f:hz(m),d:.2,type:th()==='neon'?'square':'triangle',g:.1,t}));},
    eliminate(){arp([64,60,55,48],.12,(m,t)=>tone({f:hz(m),d:.4,type:'triangle',g:.14,t}));},
    error(){tone({f:150,d:.16,type:'square',g:.07,filt:'lowpass',ff:900});},
    win(){const type=th()==='neon'?'square':'triangle';arp([60,64,67,72],.12,(m,t)=>tone({f:hz(m),d:.3,type,g:.15,t}));
      [60,64,67,72].forEach(m=>tone({f:hz(m),d:1.6,type,g:.08,t:ctx.currentTime+.5,send:true}));},
    lose(){arp([67,63,60,55],.18,(m,t)=>tone({f:hz(m),d:.5,type:'triangle',g:.13,t}));}
  };
  function play(name){if(!st.sfx||!ctx||ctx.state!=='running')return;try{FX[name]&&FX[name]();}catch(e){}}

  /* ---------- música ---------- */
  const SONGS={
    original:{bpm:78,prog:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],lead:'triangle',arpEvery:2,arpG:.05,pad:'sine',padG:.03,bassG:.09,bass:'sine',hat:0},
    taverna:{bpm:96,prog:[[50,53,57],[48,52,55],[50,53,57],[45,49,52]],lead:'pluck',arpEvery:2,arpG:.07,pad:'drone',padG:.035,bassG:.07,bass:'triangle',hat:0},
    neon:{bpm:116,prog:[[48,51,55],[44,48,51],[51,55,58],[46,50,53]],lead:'square',arpEvery:1,arpG:.025,pad:'sawtooth',padG:.012,bassG:.06,bass:'square',hat:.05},
    brinquedo:{bpm:106,prog:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],lead:'marimba',arpEvery:2,arpG:.09,pad:null,padG:0,bassG:.09,bass:'triangle',hat:.02}
  };
  const PAT=[0,1,2,1,0,2,1,2];
  function voice(kind,m,t,d,g){
    if(kind==='pluck'){tone({f:hz(m),d:Math.min(d,.45),type:'sawtooth',g,filt:'lowpass',ff:2600,ff2:500,dest:musicG,send:true});return;}
    if(kind==='marimba'){tone({f:hz(m),d:.35,type:'sine',g,dest:musicG,send:true});tone({f:hz(m)*4,d:.06,type:'sine',g:g*.25,dest:musicG});return;}
    tone({f:hz(m),d,type:kind,g,dest:musicG,send:true,filt:kind==='square'?'lowpass':null,ff:2400});
  }
  function schedule(s,t){
    const S=SONGS[th()]||SONGS.original,sd=60/S.bpm/4,bar=Math.floor(s/16)%S.prog.length,ch=S.prog[bar],i=s%16;
    if(i===0){
      if(S.pad==='drone')tone({f:hz(ch[0]-12),d:sd*16,type:'triangle',g:S.padG,a:.4,hold:sd*12,dest:musicG});
      else if(S.pad)ch.forEach((m,k)=>tone({f:hz(m),d:sd*16,type:S.pad,g:S.padG,a:.5,hold:sd*11,dest:musicG,det:k*4,filt:'lowpass',ff:1400}));
    }
    if(i===0||i===8||(S.hat&&i===14))tone({f:hz(ch[0]-24+(i===14?7:0)),d:sd*(i===14?2:6),type:S.bass,g:S.bassG,a:.01,dest:musicG,filt:'lowpass',ff:700});
    if(i%S.arpEvery===0){const k=(i/S.arpEvery)%PAT.length,oct=(Math.floor(s/32)%2&&i>=8)?12:0;
      if(!(S.lead==='marimba'&&Math.random()<.2))voice(S.lead,ch[PAT[k]]+12+oct,t,sd*S.arpEvery*1.8,S.arpG);}
    if(S.hat&&i%2===1)noise({filt:'highpass',ff:7000,d:.04,g:S.hat,t,dest:musicG});
    // de vez em quando, uma notinha de melodia
    if(i===6&&Math.random()<.35)voice(S.lead,ch[2]+24,t,sd*3,S.arpG*.8);
  }
  function tickMusic(){if(!ctx)return;const S=SONGS[th()]||SONGS.original,sd=60/S.bpm/4;
    while(nextT<ctx.currentTime+.15){if(st.music)schedule(step,nextT);nextT+=sd;step++;}}
  function startMusic(){if(started||!ctx)return;started=true;nextT=ctx.currentTime+.1;step=0;timer=setInterval(tickMusic,40);}
  function restart(){if(!ctx)return;step=0;nextT=ctx.currentTime+.08;}

  return{unlock,play,state:st,set(k,v){st[k]=v;save();apply();},restart,_fx:FX,_ctx:()=>ctx};
})();

/* =====================================================================
   EFEITOS: partículas em canvas + palco de cartas sobre o tabuleiro
   ===================================================================== */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const drag={on:false,justDropped:false,pending:false,raf:0};
const FX=(()=>{
  const cv=document.getElementById('fx'),ctx=cv.getContext('2d');let parts=[],running=false,dpr=1;
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;}
  size();addEventListener('resize',size);
  function loop(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life>0);
    for(const p of parts){p.life-=1;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.97;p.vy*=.97;p.rot+=p.vr;
      const a=Math.max(0.001,Math.min(1,p.life/p.max*1.6));ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      if(p.shape==='ring'){ctx.strokeStyle=p.color;ctx.lineWidth=3*a;ctx.beginPath();ctx.arc(0,0,p.r*(1.2-a),0,7);ctx.stroke();}
      else if(p.shape==='rect')ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
      else{ctx.beginPath();ctx.arc(0,0,p.r*a,0,7);ctx.fill();}
      ctx.restore();}
    ctx.globalAlpha=1;
    if(parts.length)requestAnimationFrame(loop);else{running=false;ctx.clearRect(0,0,innerWidth,innerHeight);}}
  function add(p){parts.push(p);if(!running){running=true;requestAnimationFrame(loop);}}
  return{
    burst(x,y,colors,n=24,{speed=4,g=.12,shape='dot',size=4,life=50}={}){if(reduce)return;
      for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=speed*(.4+Math.random());
        add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(g?1.5:0),g,r:size*(.6+Math.random()*.8),life:life*(.7+Math.random()*.5),max:life,color:colors[i%colors.length],shape,rot:Math.random()*6,vr:(Math.random()-.5)*.3});}},
    ring(x,y,color,r=40){if(reduce)return;add({x,y,vx:0,vy:0,g:0,r,life:28,max:28,color,shape:'ring',rot:0,vr:0});},
    confetti(){if(reduce)return;const cols=Object.values(DCOLOR).concat(['#f6c453','#fff']);
      for(let i=0;i<140;i++)add({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.04,r:5,life:220,max:220,color:cols[i%cols.length],shape:'rect',rot:Math.random()*6,vr:(Math.random()-.5)*.25});}
  };
})();
/* cada jogador usa a cor do seu baralho; se dois escolherem o mesmo baralho, o segundo usa uma cor reserva */
const SPARE=['#f4ede0','#ff8fb1','#7fe0ff','#b9f26b'];
function playerColors(decks){const used=new Set();return decks.map((d,i)=>{let c=DCOLOR[d]||SPARE[i];if(used.has(c))c=SPARE.find(x=>!used.has(x))||c;used.add(c);return c;});}
let PCOL=['#f4ede0','#c9433a','#3d6fd6','#4cc995'];
function applyColors(){const decks=S?S.players.map(P=>P.deck):ui.setup[ui.mode].map(x=>x.deck);PCOL=playerColors(decks);
  let el=document.getElementById('pcolors');if(!el){el=document.createElement('style');el.id='pcolors';document.head.appendChild(el);}
  el.textContent=PCOL.map((c,i)=>`.pc.o${i},.token.p${i}{--pc:${c}}`).join('\n');}
const tint=c=>[c,'#ffffff',c];
function sqEl(pos){return document.querySelector(`.sq[data-r="${pos[0]}"][data-c="${pos[1]}"]`);}
function sqCenter(pos){const el=sqEl(pos);if(!el)return null;const b=el.getBoundingClientRect();return{x:b.left+b.width/2,y:b.top+b.height/2,w:b.width};}
function flashSquares(squares,color){
  squares.forEach(pos=>{const el=sqEl(pos);if(!el)return;
    el.style.setProperty('--fc',color);el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
    const c=sqCenter(pos);if(c){FX.burst(c.x,c.y,[color,'#fff'],16,{speed:2.6,g:0,size:3,life:36});FX.ring(c.x,c.y,color,c.w*.6);}});
}
function pieceFx(ev){
  const c=sqCenter(ev.pos);if(!c)return;
  if(ev.kind==='cap'){FX.burst(c.x,c.y,tint(PCOL[ev.owner]).concat(['#f6c453']),30,{speed:4.5,g:.15,size:4,life:46});FX.ring(c.x,c.y,'#f6c453',c.w*.7);}
  if(ev.kind==='promo'){FX.burst(c.x,c.y,['#f6c453','#fff3cf','#ffd877'],36,{speed:3.5,g:-.02,shape:'rect',size:3,life:60});FX.ring(c.x,c.y,'#f6c453',c.w);}
}

const stage=document.getElementById('stage');
let fxQ=[],fxBusy=false,fxSkip=null;
function enqueueFx(list){list.forEach(e=>fxQ.push(e));runFx();}
function runFx(){
  if(fxBusy)return;
  if(!fxQ.length){tick();return;}
  const ev=fxQ.shift();
  try{const k=ev.kind;
    if(k==='cap')SND.play('capture');else if(k==='promo')SND.play('promote');
    else if(k==='card')SND.play(ev.annulled&&!ev.late?'annul':'card');else if(k==='trap')SND.play('trap');else if(k==='arm')SND.play('arm');
    else if(k==='banner'){const h=ev.html||'';SND.play(/reembaralhado/.test(h)?'shuffle':/eliminado/.test(h)?'eliminate':/Fúria|Pressa/.test(h)?'extra':/Vez d[eo] /.test(h)?(S&&!isBot(S.current)&&(!NET.on||S.current===NET.seat)?'turn':''):'click');}
  }catch(e){}
  if(ev.kind==='cap'||ev.kind==='promo'){if(ev.delay)setTimeout(()=>pieceFx(ev),60);else pieceFx(ev);runFx();return;}
  if(ev.kind==='flash'){flashSquares(ev.squares,ev.color);runFx();return;}
  // carta que você mesmo acabou de usar/armar: sem tela grande, só o brilho no tabuleiro
  if(S&&(ev.kind==='card'||ev.kind==='arm')&&ev.player!=null&&!isBot(ev.player)&&!ev.late&&!ev.roll&&!(ev.annulled&&!ev.delayed)){

function autoTurn(){
  if(ui.tut&&ui.tut.done)return;
  if(!inGame()||S.phase==='over'||ui.quit||isBot(S.current)||!myTurn())return;
  const P=S.players[S.current];
  if(S.phase==='play'&&!S.moved&&!legalMoves(S).length&&!P.hand.some(u=>!cardBlock(S,u))&&!S.cardPlayed){
    toast('Nenhuma peça sua pode se mover. Turno encerrado.');setTimeout(()=>{if(S&&S.phase==='play'&&!legalMoves(S).length)act({type:'skip'});},700);return;}
  if(S.phase!=='ended')return;
  const key=S.turn;if(autoKey===key&&autoT)return;
  clearTimeout(autoT);autoKey=key;
  autoT=setTimeout(()=>{autoT=null;if(S&&S.phase==='ended'&&myTurn()&&!fxBusy&&!fxQ.length)act({type:'endTurn'});else if(S&&S.phase==='ended'){autoKey=null;tick();}},250);
}
function tick(){
  clearTimeout(tickT);if(ui.tut&&ui.tut.done)return;autoTurn();
  if(NET.role==='guest')return;
  if(!inGame()||S.phase==='over'||(ui.quit&&!NET.on))return;
  if(!isBot(S.current)){if(S.phase==='pass'&&humans().length===1)tickT=setTimeout(()=>{if(S&&S.phase==='pass'&&!isBot(S.current))act({type:'ready'});},150);return;}

  if(NET.role==='guest')return;

/* ---------- prévia das cartas ----------
   Simula a carta numa cópia do jogo (sem as armadilhas dos oponentes, que são segredo)
   e compara o tabuleiro antes e depois. Cartas com sorteio só mostram as possibilidades. */
function previewFor(s,uid,target,dest,opp){
  const raw=CARD[s.cards[uid]];if(!raw)return null;
  if(raw.kind==='armadilha')return target?{items:[{k:'pit',pos:target}],text:`O fosso fica escondido em ${sq(s,target)}. Só você vê essa marca.`}:null;
  const e=effCard(s,uid);if(!e)return null;
  if(e.id==='roleta'){if(!target)return null;const en=piecesWhere(s,p=>p.owner!==s.current);
    return{items:[{k:'swap',pos:target},...en.map(pos=>({k:'maybe',pos}))],text:`A peça em ${sq(s,target)} vai trocar de lugar com uma das ${en.length} peças inimigas marcadas com “?”, sorteada.`};}
  if(e.id==='dado')return{items:[],text:'O resultado é sorteado na hora: 1 nada · 2–3 peças andam até 2 casas · 4–5 uma peça vira dama neste turno · 6 uma peça vira dama.'};
  if(e.targets&&!target)return null;if(e.dests&&!dest)return null;
  const t=clone(s);for(const o of opps(t))t.players[o].traps=[];
  if(s.np===2&&opp===undefined)opp=opps(s)[0];
  if(playCard(t,uid,target,dest,opp))return null;
  const items=[],n={moved:0,removed:0,added:0,crowned:0,shield:0,froze:0,walls:0};
  const before=new Map(),after=new Map();
  forEachPiece(s,(p,r,c)=>before.set(p.id,{p,pos:[r,c]}));forEachPiece(t,(p,r,c)=>after.set(p.id,{p,pos:[r,c]}));
  for(const[id,b]of before){const a=after.get(id);
    if(!a){items.push({k:'remove',pos:b.pos});n.removed++;continue;}
    if(!eq(a.pos,b.pos)){items.push({k:'arrow',from:b.pos,to:a.pos},{k:'ghost',pos:a.pos,owner:a.p.owner,king:a.p.king});n.moved++;}
    if(a.p.king&&!b.p.king){items.push({k:'crown',pos:a.pos});n.crowned++;}
    if(a.p.owner===s.current&&((a.p.shieldUntil>b.p.shieldUntil&&a.p.shieldUntil>s.turn+1)||(shielded(t,a.p,a.pos)&&!shielded(s,b.p,b.pos)))){items.push({k:'shield',pos:a.pos});n.shield++;}
    if(a.p.frozenUntil>b.p.frozenUntil){items.push({k:'freeze',pos:a.pos});n.froze++;}}
  for(const[id,a]of after)if(!before.has(id)){items.push({k:'ghost',pos:a.pos,owner:a.p.owner,king:a.p.king,add:true});n.added++;}
  t.walls.filter(w=>!s.walls.includes(w)).forEach(w=>{items.push({k:'wall',pos:[w.r,w.c]});n.walls++;});
  t.terrain.filter(x=>!s.terrain.includes(x)).forEach(x=>items.push(x.type==='portal'?{k:'portal',a:[x.r,x.c],b:[x.r2,x.c2]}:{k:'ice',pos:[x.r,x.c]}));
  let newMoves=0,follows=0;
  const modsChanged=Object.keys(t.mods).some(k=>t.mods[k]!==s.mods[k]);
  if(modsChanged&&!n.moved&&!n.removed&&!n.added){
    if(t.mods.crown&&t.mods.crown!==s.mods.crown){const a=after.get(t.mods.crown);if(a)items.push({k:'crown',pos:a.pos,temp:true});}
    const key=m=>m.from+'>'+m.to,old=new Set(legalMoves(s).map(key));
    legalMoves(t).filter(m=>!old.has(key(m))).forEach(m=>{items.push({k:'newmove',from:m.from,to:m.to});newMoves++;});
    if(t.mods.follow&&!s.mods.follow){const me=s.current,seen=new Set();
      legalMoves(t).forEach(m=>{if(m.cap)return;const dr=m.to[0]-m.from[0],dc=m.to[1]-m.from[1];if(!dr||Math.abs(dr)!==Math.abs(dc))return;
        const b=[m.from[0]-Math.sign(dr),m.from[1]-Math.sign(dc)];if(!inB(t,...b))return;const q=at(t,...b);
        if(q&&q.owner===me&&!frozen(t,q)&&!seen.has(b+'')){seen.add(b+'');items.push({k:'follow',from:b,to:m.from});follows++;}});}
  }
  const parts=[];
  const pc=(k,one,many)=>`${k} ${k===1?one:many}`;
  if(n.moved)parts.push(pc(n.moved,'peça muda','peças mudam')+' de lugar (seta cheia)');
  if(n.removed)parts.push(pc(n.removed,'peça sai','peças saem')+' do tabuleiro (X vermelho)');
  if(n.added)parts.push(pc(n.added,'peça nova aparece','peças novas aparecem'));
  if(n.crowned)parts.push(pc(n.crowned,'peça vira','peças viram')+' dama');
  if(n.shield)parts.push(pc(n.shield,'peça fica protegida','peças ficam protegidas')+' (anel azul)');
  if(n.froze)parts.push(pc(n.froze,'peça fica congelada','peças ficam congeladas'));
  if(n.walls)parts.push('a casa vira muralha');
  if(items.some(i=>i.k==='ice'))parts.push('a casa vira gelo');
  if(items.some(i=>i.k==='portal'))parts.push('as duas casas ficam ligadas');
  if(newMoves)parts.push(pc(newMoves,'jogada nova fica possível','jogadas novas ficam possíveis')+' (setas tracejadas)');
  if(follows)parts.push(pc(follows,'peça pode','peças podem')+' acompanhar o avanço (setas finas)');
  if(items.some(i=>i.k==='crown'&&i.temp))parts.push('a peça marcada age como dama neste turno');
  return{items,text:parts.length?'Prévia: '+parts.join(', ')+'.':'Esta carta não muda nada no tabuleiro agora.'};
}
function previewSVG(pv,N,toView,color){
  if(!pv||!pv.items.length)return'';
  const C=pos=>{const[vr,vc]=toView[pos[0]][pos[1]];return[vc+.5,vr+.5];};
  const line=(a,b,shrink)=>{const[x1,y1]=C(a),[x2,y2]=C(b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;return[x1+dx/L*.22,y1+dy/L*.22,x2-dx/L*shrink,y2-dy/L*shrink];};
  const PC=PCOL;let g='';
  for(const it of pv.items){
    if(it.k==='arrow'){const[a,b,c,d]=line(it.from,it.to,.3);g+=`<line class="pv-arrow" x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width=".1" marker-end="url(#pvh)"/>`;}
    else if(it.k==='newmove'){const[a,b,c,d]=line(it.from,it.to,.18);const[x,y]=C(it.to);g+=`<line class="pv-arrow" x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#f6c453" stroke-width=".06" stroke-dasharray=".14 .1"/><circle cx="${x}" cy="${y}" r=".13" fill="#f6c453"/>`;}
    else if(it.k==='follow'){const[a,b,c,d]=line(it.from,it.to,.25);g+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width=".05" stroke-dasharray=".08 .08" marker-end="url(#pvf)" opacity=".9"/>`;}
    else if(it.k==='ghost'){const[x,y]=C(it.pos);g+=`<circle cx="${x}" cy="${y}" r=".34" fill="${PC[it.owner]}" fill-opacity=".55" stroke="${it.add?'#4fc07c':'#fff'}" stroke-width=".05" stroke-dasharray=".1 .07"/>${it.king?`<text x="${x}" y="${y+.12}" text-anchor="middle" font-size=".36" fill="#b07d12">♛</text>`:''}`;}
    else if(it.k==='remove'){const[x,y]=C(it.pos);g+=`<circle cx="${x}" cy="${y}" r=".42" fill="none" stroke="#ff6b5c" stroke-width=".07"/><path d="M${x-.22} ${y-.22}L${x+.22} ${y+.22}M${x+.22} ${y-.22}L${x-.22} ${y+.22}" stroke="#ff6b5c" stroke-width=".11" stroke-linecap="round"/>`;}
    else if(it.k==='crown'){const[x,y]=C(it.pos);g+=`<g transform="translate(${x+.12} ${y-.46}) scale(.017)"><path d="M3 18 5 8l4.5 4L12 5l2.5 7L19 8l2 10z" fill="${it.temp?'none':'#f6c453'}" stroke="#f6c453" stroke-width="2.4" ${it.temp?'stroke-dasharray="3 2"':''}/></g>`;}
    else if(it.k==='shield'){const[x,y]=C(it.pos);g+=`<circle cx="${x}" cy="${y}" r=".45" fill="none" stroke="#4f93ea" stroke-width=".07"/>`;}
    else if(it.k==='freeze'){const[x,y]=C(it.pos);g+=`<circle cx="${x}" cy="${y}" r=".45" fill="rgba(200,236,255,.25)" stroke="#c8ecff" stroke-width=".06" stroke-dasharray=".1 .07"/>`;}
    else if(it.k==='wall'){const[x,y]=C(it.pos);g+=`<rect x="${x-.42}" y="${y-.42}" width=".84" height=".84" rx=".08" fill="url(#pvw)" stroke="#e8d2a2" stroke-width=".05"/>`;}
    else if(it.k==='ice'){const[x,y]=C(it.pos);g+=`<rect x="${x-.45}" y="${y-.45}" width=".9" height=".9" fill="rgba(200,236,255,.55)" stroke="#fff" stroke-width=".04"/>`;}
    else if(it.k==='portal'){const[a,b]=C(it.a),[c,d]=C(it.b);g+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#9d86ff" stroke-width=".05" stroke-dasharray=".12 .1"/><circle cx="${a}" cy="${b}" r=".32" fill="rgba(127,106,216,.5)" stroke="#9d86ff" stroke-width=".06"/><circle cx="${c}" cy="${d}" r=".32" fill="rgba(127,106,216,.5)" stroke="#9d86ff" stroke-width=".06"/>`;}
    else if(it.k==='pit'){const[x,y]=C(it.pos);g+=`<circle cx="${x}" cy="${y}" r=".34" fill="rgba(0,0,0,.55)" stroke="#e8d2a2" stroke-width=".05" stroke-dasharray=".1 .07"/>`;}
    else if(it.k==='swap'){const[x,y]=C(it.pos);g+=`<circle cx="${x}" cy="${y}" r=".46" fill="none" stroke="#e4dd52" stroke-width=".08"/>`;}
    else if(it.k==='maybe'){const[x,y]=C(it.pos);g+=`<circle cx="${x+.27}" cy="${y-.27}" r=".17" fill="#e4dd52"/><text x="${x+.27}" y="${y-.2}" text-anchor="middle" font-size=".22" font-weight="700" fill="#1a120a">?</text>`;}
  }
  return `<svg class="pvsvg" viewBox="0 0 ${N} ${N}" aria-hidden="true"><defs>
    <marker id="pvh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="${color}"/></marker>
    <marker id="pvf" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="${color}"/></marker>
    <pattern id="pvw" width=".2" height=".2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width=".1" height=".2" fill="#7a6449"/><rect x=".1" width=".1" height=".2" fill="#4c3d2b"/></pattern></defs>${g}</svg>`;
}

function render(){
  if(drag.on){drag.pending=true;return;} // não refaz a tela no meio do arraste (no celular isso perdia o toque)
  if(S&&S.names)NAMES=S.names;else if(!S)NAMES=null;
  if(document.activeElement&&document.activeElement.tagName==='INPUT'&&(ui.screen==='online'||ui.screen==='lobby')&&!ui.forceRender){ui.dirty=true;return;}
  applyColors();
  document.body.classList.toggle('ingame',inGame());
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===ui.tab));
  const m=$('main');
  const prev={};let prevCount=0;
  document.querySelectorAll('.pc[data-id]').forEach(el=>{prev[el.dataset.id]=el.getBoundingClientRect();prevCount++;});
  if(S){const v=viewer();if(v!==null)ui.orient=v;}
  const back=`<div class="sub-h"><button class="btn ghost back" id="goback">← ${S&&ui.screen==='game'&&S.phase!=='over'?'Voltar à partida':'Menu'}</button><h2>${ui.tab==='cartas'?'Cartas':'Regras'}</h2></div>`;
  if(ui.tab==='cartas')m.innerHTML=back+renderCards();
  else if(ui.tab==='regras')m.innerHTML=back+renderRules();
  else m.innerHTML=inGame()?renderGame():ui.screen==='offline'?renderSetup():ui.screen==='online'?renderOnline():ui.screen==='lobby'?renderLobby():ui.screen==='tutclasses'?renderTutClasses():renderMenu();
  if(inGame()&&prevCount&&ui.orient===lastOrient&&!reduce){
    document.querySelectorAll('.pc[data-id]').forEach(el=>{const p=prev[el.dataset.id],n=el.getBoundingClientRect();
      if(p){const dx=p.left-n.left,dy=p.top-n.top;if(Math.abs(dx)+Math.abs(dy)>1)el.animate([{transform:`translate(${dx}px,${dy}px) scale(1.12)`,zIndex:5},{transform:'none'}],{duration:280,easing:'cubic-bezier(.3,.8,.3,1)'});}
      else el.animate([{transform:'scale(0) rotate(-90deg)',opacity:0},{transform:'scale(1.2)',opacity:1,offset:.7},{transform:'none'}],{duration:520,easing:'ease-out'});});
  }
  lastOrient=S?ui.orient:null;
  if(drag.on){const el=document.querySelector(`[data-uid="${drag.uid}"],[data-trap="${drag.uid}"]`);if(el)el.classList.add('dragging');}
  if(ui.tut)tutMark();
  const bar=document.querySelector('.sheet[data-pv]');
  const key=bar?JSON.stringify(ui.confirm||ui.sel):null;
  ui.pvKey=key;
  renderOverlay();
  try{window.claude?.hot?.snapshot?.(()=>({S,tab:ui.tab,mode:ui.mode,setup:ui.setup,screen:ui.screen}));}catch(e){}
}

  const P=S.players[S.current];if(P.silenced===S.turn)return false;

}
function useCard(uid){
  if(!uid||!S)return;const c=CARD[S.cards[uid]],e=c.kind==='armadilha'?c:effCard(S,uid);
  const why=myTurn()?cardBlock(S,uid):'Espere a sua vez para usar cartas.';
  if(why){toast(why);SND.play('error');ui.sel=null;render();return;}
  if(c.kind==='armadilha'&&!c.targets){act({type:'play',uid});return;}
  if(!e.targets&&!(e.pickOpp&&S.np>2)){act({type:'play',uid});return;}
  ui.tgt=uid;ui.sel=null;ui.piece=null;render();
}

/* ---------- jogo ---------- */
function plateHTML(i,mine){
  const s=S,P=s.players[i],cnt=count(s,i),tags=[];
  if(isBot(i))tags.push('<span class="tag bot">bot</span>');
  if(P.out)tags.push('<span class="tag warn">eliminado</span>');
  if(P.skip)tags.push('<span class="tag warn">perde a vez</span>');
  if(P.silenced>=s.turn&&!P.out)tags.push('<span class="tag warn">silenciado</span>');
  if(P.guardUntil>s.turn&&!P.out)tags.push('<span class="tag" style="color:var(--dk)">guarda real</span>');
  const turn=s.current===i&&s.phase!=='over';
  return `<div class="plate d-${P.deck}${turn?' turn':''}${P.out?' out':''}"><span class="pchar">${charSVG(P.deck)}<span class="token p${i}"></span></span>
    <div class="who"><b>${J(i)}${mine?' · você':''}</b><button class="deckname" data-deckview="${i}" aria-label="Ver o baralho ${DECKS[P.deck].name}">${icon(P.deck)}${DECKS[P.deck].name}<span class="dvhint" aria-hidden="true">›</span></button></div>${tags.join('')}<span class="grow"></span>
    <div class="stats"><span><b>${cnt}</b> peças</span><span><b>${P.hand.length}</b> ${mine?'cartas':'na mão'}</span>${mine?`<span><b>${P.pile.length}</b> monte</span><span><b>${P.discard.length}</b> descarte</span>`:''}${P.grave&&mine?`<span><b>${P.grave}</b> capturadas</span>`:''}</div>
    ${mine?'':`<span class="backs${P.traps.length?' armed':''}" title="Armadilhas armadas: ${P.traps.length} de 2" aria-label="${P.traps.length?P.traps.length+' armadilha'+(P.traps.length>1?'s':'')+' armada'+(P.traps.length>1?'s':''):'Nenhuma armadilha armada'}">${[0,1].map(k=>`<span class="cback${P.traps[k]?'':' empty'}"></span>`).join('')}<span class="bl">${P.traps.length?P.traps.length+(P.traps.length>1?' armadilhas':' armadilha'):'nenhuma'}</span></span>`}</div>`;
}
/* coluna à esquerda do tabuleiro com as informações de quem está jogando neste celular */
const MODNAMES={fury:'Fúria',retreat:'Recuar',noForce:'Sem pressa',longStep:'Passo largo',slide:'Deslize',crown:'Coroa',bridge:'Ponte',follow:'Em bloco',pressa:'Pressa'};
function irMods(s){const m=Object.keys(s.mods).filter(k=>MODNAMES[k]&&s.mods[k]).map(k=>`<span class="ir-mod">${MODNAMES[k]}</span>`);
  if(s.rules&&s.rules.omni)m.push('<span class="ir-mod">4 diag.</span>');
  if(s.phase==='play'&&!s.mods.noForce&&legalMoves(s).some(x=>x.cap))m.unshift('<span class="ir-mod warn">Captura obrigatória</span>');
  if(s.extra)m.unshift('<span class="ir-mod">Jogada extra</span>');return m.join('');}
function inforail(i){
  const s=S,P=s.players[i],turn=s.current===i&&s.phase!=='over',tags=[];
  if(P.guardUntil>s.turn)tags.push('guarda real');
  if(P.silenced>=s.turn)tags.push('silenciado');
  if(P.skip)tags.push('perde a vez');
  const st=(n,l)=>`<div class="ir-st"><b>${n}</b><span>${l}</span></div>`;
  return `<div class="inforail d-${P.deck}${turn?' turn':''}" aria-label="Suas informações">
    <span class="pchar big">${charSVG(P.deck)}<span class="token p${i}"></span></span><span class="ir-name">${isBot(i)?'Bot':'Você'}</span>
    <button class="ir-deck" data-deckview="${i}" aria-label="Ver o baralho ${DECKS[P.deck].name}">${icon(P.deck)}<span>${DECKS[P.deck].name}</span></button>
    ${st(count(s,i),'peças')}${st(P.hand.length,'cartas')}${st(P.pile.length,'monte')}${st(P.discard.length,'descarte')}${P.grave?st(P.grave,'perdidas'):''}
    ${tags.map(t=>`<span class="ir-tag">${t}</span>`).join('')}${s.current===i?irMods(s):''}</div>`;
}
function renderGame(){
  const s=S,v=viewer(),me=s.current,P=s.players[me],N=s.N,f=s.f[ui.orient];
  const mine=myTurn();
  const moves=mine&&(s.phase==='play'||s.phase==='chain')?legalMoves(s):[];
  let targets=[],dests=[],tgtColor='',tgtCard=null;
  if(ui.tgt&&mine){const raw=CARD[s.cards[ui.tgt]];tgtCard=raw.kind==='armadilha'?raw:effCard(s,ui.tgt);tgtColor=DCOLOR[raw.deck];
    if(tgtCard.targets&&!ui.confirm){if(ui.piece&&tgtCard.dests)dests=tgtCard.dests(s,ui.piece);else targets=tgtCard.targets(s);}}
  let pv=null,pvColor='#f6c453';
  if(mine&&ui.confirm){pv=previewFor(s,ui.confirm.uid,ui.confirm.target,ui.confirm.dest,ui.confirm.opp);pvColor=DCOLOR[CARD[s.cards[ui.confirm.uid]].deck];}
  else if(mine&&ui.sel&&!ui.tgt&&!cardBlock(s,ui.sel)){const c0=CARD[s.cards[ui.sel]],e0=c0.kind==='armadilha'?c0:effCard(s,ui.sel);if(c0.kind==='acao'&&e0&&!e0.targets&&!e0.pickOpp){pv=previewFor(s,ui.sel);pvColor=DCOLOR[c0.deck];}}
  const toView=[...Array(N)].map(()=>Array(N));
  const movable=new Set(ui.tgt?[]:moves.map(m=>m.from.join()));
  const selMoves=ui.piece&&!ui.tgt?moves.filter(m=>eq(m.from,ui.piece)):[];
  const pits=v===null?[]:s.players[v].traps.map(u=>s.trapData[u]).filter(Boolean).map(d=>d.pos);
  const a0=viewToBoard(N,f,0,0),a1=viewToBoard(N,f,1,0),b0=viewToBoard(N,f,N-1,0),b1=viewToBoard(N,f,N-1,1);
  const leftByRow=a0[0]!==a1[0],botByCol=b0[1]!==b1[1];
  const L='abcdefghijklmno';
  let cells='';
  for(let vr=0;vr<N;vr++)for(let vc=0;vc<N;vc++){
    const[r,c]=viewToBoard(N,f,vr,vc);toView[r][c]=[vr,vc];const dark=isDark(s,r,c),p=at(s,r,c),wall=wallAt(s,r,c),ter=terrainAt(s,r,c);
    const cls=['sq'];if(dark)cls.push('dark');if(wall)cls.push('wall');
    if(s.last&&(eq(s.last.from,[r,c])||eq(s.last.to,[r,c])))cls.push('last');
    if(eq(ui.piece,[r,c]))cls.push('sel');
    if(movable.has(r+','+c))cls.push('movable');
    if(targets.some(t=>eq(t,[r,c]))||dests.some(t=>eq(t,[r,c])))cls.push('target');
    const mv=selMoves.find(m=>eq(m.to,[r,c]));
    let inner='';
    if(vc===0)inner+=`<span class="lbl rk">${leftByRow?N-r:L[c]}</span>`;
    if(vr===N-1)inner+=`<span class="lbl fl">${botByCol?L[c]:N-r}</span>`;
    if(ter)inner+=`<span class="terr ${ter.type}"></span>`;
    if(pits.some(q=>eq(q,[r,c])))inner+='<span class="terr pit"></span>';
    if(p)inner+=`<span class="pc o${p.owner}${shielded(s,p,[r,c])?' shield':''}${frozen(s,p)?' frozen':''}" data-id="${p.id}"><i class="pcs" aria-hidden="true"></i>${kingLike(s,p)?CROWN:''}${p.doom?SKULL:''}</span>`;
    if(mv)inner+=`<span class="dot${mv.cap?' cap':''}"></span>`;
    const lab=sq(s,[r,c])+(p?` peça do ${J(p.owner)}${p.king?' (dama)':''}`:'')+(ter?(ter.type==='ice'?' gelo':' portal'):'')+(wall?' muralha':'');
    cells+=`<button class="${cls.join(' ')}" data-r="${r}" data-c="${c}" aria-label="${lab}" ${dark?'':'tabindex="-1"'} ${tgtColor?`style="--tg:${tgtColor}"`:''}>${inner}</button>`;
  }
  // status
  let msg='',btns='';
  if(!mine){
    msg=s.phase==='over'?'Fim de jogo.':`Vez do <em>${label(me)}</em>…`;
  }else if(ui.confirm){
    const raw=CARD[s.cards[ui.confirm.uid]];
    msg=`Confira o que <em>${esc(raw.name)}</em> vai fazer no tabuleiro.`;
    btns='';
  }else if(ui.tgt){
    const raw=CARD[s.cards[ui.tgt]];
    if(tgtCard.pickOpp&&!tgtCard.targets){msg=`Escolha o oponente para <em>${raw.name}</em>.`;
      btns=`<div class="oppbtns">${oppChoices(s,tgtCard).map(o=>`<button class="btn" data-opp="${o}"><span class="token p${o}"></span>${J(o)}</button>`).join('')}<button class="btn ghost" id="cancel">Cancelar</button></div>`;}
    else{msg=ui.piece?`Escolha o destino de <em>${raw.name}</em>.`:raw.kind==='armadilha'?`Escolha a casa secreta de <em>${raw.name}</em>.`:`Toque no alvo de <em>${raw.name}</em>.`;btns=`<button class="btn ghost" id="cancel">Cancelar</button>`;}
  }
  else if(s.phase==='chain')msg='Continue capturando com a <em>mesma peça</em>.';
  else if(s.phase==='ended'){msg='';btns='';}
  else if(s.phase==='play'){
    const capForced=moves.some(m=>m.cap)&&!s.mods.noForce;
    if(!moves.length){msg='Nenhuma peça sua pode se mover. Use uma carta que ajude ou encerre o turno.';btns=`<button class="btn primary" id="skip">Encerrar turno</button>`;}
    else if(s.extra)msg='<em>Jogada extra!</em> Mova de novo.';
    else if(capForced)msg='<em>Captura obrigatória.</em> '+(s.moved||s.cardPlayed?'':'Você ainda pode usar uma carta antes.');
    else msg=(s.moved||s.cardPlayed||P.silenced===s.turn)?'Mova uma peça.':'Use uma carta (opcional) e mova uma peça.';
    if(P.silenced===s.turn&&!s.moved)msg+=' <em>Silenciado:</em> sem cartas neste turno.';
  }
  if(s.rules&&s.rules.omni&&mine&&s.phase==='play'&&!ui.tgt&&!ui.confirm)msg+=' <span class="modchip">4 diagonais</span>';
  const modNames={fury:'Fúria',retreat:'Recuar',noForce:'Sem Pressa',longStep:'Passo Largo',slide:'Deslize',crown:'Coroa',bridge:'Ponte',follow:'Em bloco',pressa:'Pressa'};
  const mods=mine?Object.keys(s.mods).filter(k=>modNames[k]).map(k=>`<span class="modchip">${modNames[k]}</span>`).join(''):'';
  // folha inferior: carta selecionada, armadilha armada ou confirmação com prévia
  const canDiscard=mine&&(s.phase==='play'||s.phase==='ended')&&!s.discarded;
  const V=v===null?null:s.players[v];
  let sheet='';
  // posição do aviso sobre o tabuleiro: no meio, ou na metade oposta ao alvo para não esconder a prévia
  let side=pv?'bottom':'mid';
  if(mine&&ui.confirm&&ui.confirm.target){const t=toView[ui.confirm.target[0]]&&toView[ui.confirm.target[0]][ui.confirm.target[1]];if(t)side=t[0]>=N/2?'top':'bottom';}
  const sheetWrap=(c,tag,body,buttons)=>`<div class="sheet pop d-${c.deck}" data-side="${side}" ${pv?'data-pv="1"':''}><div class="sheet-in">
      <h4>${typeIcon(c.kind)}${esc(c.name)} <span class="trapchip">${tag}</span></h4>${body}
      ${pv?`<p class="pvtext">${esc(pv.text)}</p>`:''}<div class="row">${buttons}</div></div></div>`;
  const plainSheet=(body,buttons,dk,hint)=>`<div class="sheet pop${hint?' hint':''}" data-side="${hint?'edge':'mid'}" ${dk?`style="--dk:${dk}"`:''}><div class="sheet-in"><p>${body}</p><div class="row">${buttons}</div></div></div>`;
  const askPop=mine&&ui.askMove?`<div class="askpop" role="alertdialog" aria-labelledby="askt"><b id="askt">Mover sem usar carta?</b>
      <span>Você ainda não usou nenhuma carta neste turno. Depois de mover, não dá mais para usar.</span>
      <div class="askbtns"><button class="btn primary" id="askyes">Mover</button><button class="btn ghost" id="askno">Voltar</button></div>
      ${ui.tut?'':'<button class="asknever" id="asknever">Não perguntar mais nesta partida</button>'}</div>`:'';
  if(mine&&ui.tgt&&!ui.confirm){sheet=plainSheet(msg,btns,DCOLOR[CARD[s.cards[ui.tgt]].deck],!(tgtCard.pickOpp&&!tgtCard.targets));}
  else if(mine&&s.phase==='play'&&!moves.length&&!ui.sel&&!ui.selTrap){sheet=plainSheet(msg,btns);}
  else if(mine&&ui.confirm){const c=CARD[s.cards[ui.confirm.uid]];
    sheet=sheetWrap(c,'Confirmar jogada',pv?'':'<p class="zhint">Confira o alvo marcado no tabuleiro.</p>',
      `<button class="btn primary" id="confirmcard">${c.kind==='acao'?'Confirmar':'Armar aqui'}</button><button class="btn ghost" id="changetgt">Mudar alvo</button><button class="btn ghost" id="cancel">Cancelar</button>`);}
  else if(V&&ui.selTrap&&V.traps.includes(ui.selTrap)){const c=CARD[s.cards[ui.selTrap]],d=s.trapData[ui.selTrap];
    sheet=sheetWrap(c,'Armadilha armada',`<p>${esc(c.text)}</p>${d?`<p class="zhint">Casa escolhida: ${sq(s,d.pos)} (marcada no tabuleiro só para você).</p>`:''}
      <p class="zhint">${canDiscard?'Desarmar libera o espaço, mas usa o seu descarte do turno.':mine&&s.discarded?'Você já descartou uma carta neste turno.':'Os oponentes só sabem que existe uma armadilha, não qual é.'}</p>`,
      `<span class="draghint">${canDiscard?'Arraste a armadilha até a lixeira para desarmar.':'Toque fora para fechar.'}</span>`);}
  else if(V&&ui.sel&&!ui.tgt&&V.hand.includes(ui.sel)&&!drag.on){const c=CARD[s.cards[ui.sel]],afterMove=mine&&s.phase==='ended',why=afterMove?null:mine?cardBlock(s,ui.sel):'Espere a sua vez para usar cartas.';
    const echo=c.id==='eco'&&V.lastCard?CARD[V.lastCard]:null;
    sheet=sheetWrap(c,c.kind==='acao'?'Ação':'Armadilha',`<p>${esc(c.text)}</p>${c.id==='eco'?(echo?`<div class="echo-row">${cardHTML(echo,{mini:true,micro:true})}<p>Vai copiar <b>${esc(echo.name)}</b>: <span class="zhint">${esc(echo.text)}</span></p></div>`:'<p class="zhint">Você ainda não usou nenhuma carta de ação, então não há nada para copiar.</p>'):''}${why?`<p class="why">${esc(why)}</p>`:''}`,
      `<span class="draghint">${!mine?'Espere a sua vez para usar cartas.':afterMove?(canDiscard?'Arraste até a lixeira para descartar.':''):why?(canDiscard?'Arraste até a lixeira para descartar.':''):'Arraste para cima para '+(c.kind==='acao'?'usar':'armar')+(canDiscard?', ou até a lixeira para descartar.':'.')}</span>`);}
  // trilho de armadilhas ao lado do tabuleiro + mão
  let rail='',handArea='';
  if(V){const mid=(V.hand.length-1)/2;
    rail=`<div class="traprail d-${V.deck}" aria-label="Suas armadilhas armadas"><span class="raillabel">${typeIcon('armadilha')}<span>Armadilhas</span></span>
      ${[0,1].map(k=>V.traps[k]?cardHTML(CARD[s.cards[V.traps[k]]],{button:true,mini:true,micro:true,attr:'trap',uid:V.traps[k],sel:ui.selTrap===V.traps[k]}):'<div class="slot micro">livre</div>').join('')}
      <span class="railnote">só você vê</span></div>`;
    const hand=V.hand.map((u,i)=>cardHTML(CARD[s.cards[u]],{button:true,uid:u,i:(i-mid).toFixed(2),sel:ui.sel===u,dim:!mine||!!cardBlock(s,u),copy:s.cards[u]==='eco'?(V.lastCard?CARD[V.lastCard].name:''):undefined})).join('');
