<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#11131c">
  <title>Noite Sem Fim — Sobrevivência Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="cv"></canvas>
  <button id="btnSound" aria-label="Som"></button>

  <!-- Menu inicial -->
  <section id="menu" class="screen">
    <div class="panel">
      <h1>NOITE<br>SEM FIM</h1>
      <p class="sub">Sobreviva às hordas com seus amigos</p>
      <label>Seu nome
        <input id="name" maxlength="12" placeholder="Jogador" autocomplete="off">
      </label>
      <button id="btnHost" class="primary">Criar sala</button>
      <div class="row">
        <input id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off">
        <button id="btnJoin">Entrar</button>
      </div>
      <button id="btnSolo" class="ghost">Jogar sozinho</button>
      <p id="menuMsg" class="msg"></p>
      <p class="help">PC: WASD ou setas · Celular: arraste o dedo na tela<br>Ataques são automáticos. Fique perto de um amigo caído para revivê-lo.</p>
    </div>
  </section>

  <!-- Sala de espera -->
  <section id="lobby" class="screen hidden">
    <div class="panel">
      <p class="sub">Código da sala</p>
      <div id="roomCode" class="code">----</div>
      <button id="btnCopy" class="ghost">Copiar link de convite</button>
      <ul id="roster"></ul>
      <button id="btnStart" class="primary">Começar</button>
      <p id="lobbyMsg" class="msg"></p>
      <button id="btnLeave" class="ghost">Sair</button>
    </div>
  </section>

  <!-- Escolha de melhoria -->
  <section id="choices" class="hidden">
    <h2>Subiu de nível!</h2>
    <div id="cards"></div>
  </section>

  <!-- Fim de jogo -->
  <section id="over" class="screen hidden">
    <div class="panel">
      <h1 id="overTitle">FIM</h1>
      <div id="overStats"></div>
      <button id="btnAgain" class="primary">Jogar de novo</button>
      <p id="overMsg" class="msg"></p>
      <button id="btnMenu" class="ghost">Menu</button>
    </div>
  </section>

  <div id="toast" class="hidden"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="sim.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
