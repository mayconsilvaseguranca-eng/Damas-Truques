<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14101f">
<meta name="description" content="Damas com cartas de ação e armadilhas. 10 baralhos, de 2 a 4 jogadores.">
<title>Damas &amp; Truques</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Cinzel:wght@600;800&family=Crimson+Pro:wght@400;600;700&family=Press+Start+2P&family=VT323&family=Fredoka:wght@500;600;700&display=swap">
<style>

/* Mesa de cartas à noite: fundo com névoa colorida dos baralhos, tabuleiro de madeira no centro,
   cartas com moldura e sigilo do baralho. Visual escuro único, por escolha. */
:root{
  --bg:#110e18; --surface:#1c1826; --surface2:#262135; --line:#3a3450;
  --fg:#f1eadc; --muted:#a8a0ba; --hi:#f6c453; --danger:#ff6b5c;
  --sq-light:#e2d0a6; --sq-dark:#2f5249;
  --wood1:#6b4628; --wood2:#3e2815;
  --p0:#f4ede0; --p0-rim:#8f8268; --p1:#c9433a; --p1-rim:#6d1a15;
  --atk:#ef6a42; --def:#57a0ec; --dst:#4fc07c; --trk:#b178ea;
  --card-hi:#2d2740; --card-lo:#1a1625;
  --f-display:'Bungee','Arial Black',Impact,sans-serif;
  --f-body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.d-ataque{--dk:#ef5f3c} .d-defesa{--dk:#4f93ea} .d-distancia{--dk:#4fc07c} .d-trapaceiro{--dk:#b178ea} .d-necromante{--dk:#3fd6c6}
.d-arquiteto{--dk:#a3acbf} .d-realeza{--dk:#e2568a} .d-enxame{--dk:#f2a93b} .d-apostador{--dk:#e4dd52} .d-relojoeiro{--dk:#c48a5e}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* névoa de fundo */
.bg{position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:radial-gradient(30% 28% at 22% 30%,rgba(177,120,234,.20),transparent 70%),
             radial-gradient(28% 26% at 78% 68%,rgba(239,106,66,.15),transparent 70%),
             radial-gradient(24% 24% at 62% 22%,rgba(87,160,236,.13),transparent 70%),
             radial-gradient(26% 24% at 30% 80%,rgba(79,192,124,.10),transparent 70%);
  animation:drift 46s ease-in-out infinite alternate}
@keyframes drift{from{transform:rotate(0) scale(1)}to{transform:rotate(28deg) scale(1.12)}}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* cabeçalho */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0;line-height:1;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff3cf,var(--hi) 60%,#c98a1d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #5a3a08)}
.brand .suits{display:flex;gap:3px}
.brand .suits i{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--dk)}
.brand small{margin-left:auto;color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;background:none;border:0;padding:8px 6px;border-radius:8px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:.82rem}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#3a3350,var(--surface2));color:var(--fg);box-shadow:inset 0 1px 0 #ffffff14}

/* botões */
.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:700;letter-spacing:.04em;background:var(--surface2);text-transform:uppercase;font-size:.88rem}
.btn.primary{background:linear-gradient(180deg,#ffd877,var(--hi) 55%,#d99a22);color:#2a1a02;box-shadow:0 4px 0 #8a5c0d,0 8px 16px #0006;transition:transform .1s,box-shadow .1s}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5c0d,0 4px 8px #0006}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.lead{color:var(--muted);margin:0;max-width:62ch}

/* setup */
.setupwrap{display:flex;flex-direction:column;gap:14px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;align-self:flex-start;max-width:100%}
.seg button{border:0;background:none;padding:9px 14px;border-radius:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:.82rem}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#3a3350,var(--surface2));color:var(--fg);box-shadow:inset 0 1px 0 #ffffff14}
.seg.small button{padding:6px 10px;font-size:.74rem}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.seat{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.seat-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seat-h h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1rem;line-height:1.1}
.seat-h small{display:block;color:var(--muted);font-family:var(--f-body);font-size:.78rem;letter-spacing:.04em}
.seat-h .seg{margin-left:auto}
.deckgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.deckgrid button{background:var(--card-lo);border:2px solid var(--line);border-radius:10px;padding:7px 8px;display:flex;align-items:center;gap:6px;color:var(--dk);font-weight:700;font-size:.9rem;min-width:0;text-align:left;transition:border-color .15s,background .15s}
.deckgrid button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deckgrid button[aria-pressed="true"]{border-color:var(--dk);background:color-mix(in srgb,var(--dk) 18%,var(--card-lo));box-shadow:0 0 14px color-mix(in srgb,var(--dk) 30%,transparent)}
.deckblurb{margin:0;font-size:.86rem;color:var(--muted);min-height:2.5em}
.deckblurb b{color:var(--dk)}
.setup-actions{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:.86rem;color:var(--muted);margin:0;max-width:62ch}

/* peças (token) */
.token{width:22px;height:22px;border-radius:50%;flex:none;display:inline-block}

/* placas dos jogadores */
.plate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:8px 12px;position:relative}
.plate.turn{border-color:color-mix(in srgb,var(--dk) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--dk) 40%,transparent),0 0 22px color-mix(in srgb,var(--dk) 25%,transparent)}
.plate .who{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.plate .who b{font-size:1rem}
.plate .deckname{color:var(--dk);display:flex;align-items:center;gap:4px;font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
.plate .deckname .ico{width:14px;height:14px}
.plate .grow{flex:1}
.plate .stats{display:flex;gap:10px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.88rem}
.plate .stats b{color:var(--fg);font-size:1rem}
.backs{display:flex;align-items:center}
.cback{width:18px;height:26px;border-radius:4px;border:1px solid #0006;margin-left:-6px;box-shadow:0 2px 4px #0008;
  background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--dk) 30%,#fff) 0 18%,transparent 20%),repeating-linear-gradient(45deg,var(--dk) 0 3px,color-mix(in srgb,var(--dk) 45%,#120e1a) 3px 6px)}
.backs .cback:first-child{margin-left:0}
.trapline{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.trapchip{font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px dashed var(--dk);color:var(--dk);font-weight:600}
.modchip{font-size:.76rem;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--hi) 18%,transparent);color:var(--hi);font-weight:700;text-transform:uppercase;letter-spacing:.05em}

/* tabuleiro */
.boardwrap{position:relative;width:min(100%,var(--bw,460px));margin:6px auto;padding:10px;border-radius:14px;
  background:linear-gradient(135deg,#8a5d36,var(--wood1) 30%,var(--wood2) 70%,#5b3b20);
  box-shadow:inset 0 0 0 2px #00000040,inset 0 2px 0 #ffffff26,0 0 0 1px #000,0 18px 40px #000c}
.boardwrap::before{content:"";position:absolute;inset:5px;border-radius:10px;border:1px solid #d9b26a66;pointer-events:none}
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));grid-template-rows:repeat(var(--n,8),minmax(0,1fr));border-radius:4px;overflow:hidden;box-shadow:0 0 0 2px #1e1309,inset 0 0 18px #0008;touch-action:manipulation}
.sq{position:relative;min-width:0;min-height:0;overflow:visible;display:flex;align-items:center;justify-content:center;border:0;padding:0;cursor:default;
  background:linear-gradient(135deg,#ecdcb6,var(--sq-light))}
.sq.dark{background:linear-gradient(135deg,#365d52,var(--sq-dark));box-shadow:inset 0 0 8px #0005;cursor:pointer}
.sq.last{background:linear-gradient(135deg,#5d6a46,#4b5a3c)}
.sq .lbl{position:absolute;font-size:9px;font-weight:700;color:rgba(255,255,255,.4);pointer-events:none}
.sq .lbl.rk{top:2px;left:3px} .sq .lbl.fl{bottom:1px;right:3px}
.sq:not(.dark) .lbl{color:rgba(60,40,10,.5)}
.sq.wall{background:repeating-linear-gradient(135deg,#7a6449 0 5px,#4c3d2b 5px 10px)}
.sq.wall::after{content:"";position:absolute;inset:16%;border:2px solid #e8d2a2;border-radius:3px;background:#0002;box-shadow:0 0 8px #e8d2a280}
.pc{width:74%;height:auto;aspect-ratio:1;flex:none;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .15s}
.pc .crown{width:54%;height:54%;flex:none;filter:drop-shadow(0 1px 0 #0006)}
.pc.shield::before{content:"";position:absolute;inset:-9%;border-radius:50%;border:3px solid var(--def);box-shadow:0 0 12px var(--def),inset 0 0 8px var(--def);animation:glow 1.6s ease-in-out infinite alternate}
.pc.frozen{filter:saturate(.25) brightness(1.1) hue-rotate(160deg)}
.pc.frozen::after{content:"";position:absolute;inset:-8%;border-radius:50%;border:3px dashed #c8ecff;box-shadow:0 0 10px #9fdcff}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.sq.sel .pc{transform:translateY(-4px) scale(1.08);animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-2px) scale(1.06)}to{transform:translateY(-6px) scale(1.08)}}
.sq.sel .pc::before{content:"";position:absolute;inset:-12%;border-radius:50%;border:3px solid var(--hi);box-shadow:0 0 14px var(--hi)}
.sq.movable .pc{box-shadow:0 3px 0 var(--rim,#0006),0 0 0 2px var(--hi),0 0 12px color-mix(in srgb,var(--hi) 60%,transparent)}
.dot{position:absolute;width:28%;height:28%;border-radius:50%;background:var(--hi);box-shadow:0 0 10px var(--hi);pointer-events:none;animation:glow .8s ease-in-out infinite alternate}
.dot.cap{background:var(--danger);box-shadow:0 0 12px var(--danger);width:34%;height:34%}
.sq.target::before{content:"";position:absolute;inset:6%;border-radius:8px;border:3px solid var(--tg,var(--hi));box-shadow:0 0 14px var(--tg,var(--hi));animation:glow .8s ease-in-out infinite alternate;pointer-events:none;z-index:3}
.sq.flash::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--fc) 70%,transparent),transparent 70%);animation:flash 1.1s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}

/* status */
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;min-height:52px}
.status p{margin:0;flex:1;min-width:0;font-weight:600}
.status p em{font-style:normal;color:var(--hi)}

/* carta: AÇÃO = face clara de pergaminho; ARMADILHA = face escura com moldura listrada de perigo */
.card{--w:116px;flex:none;width:var(--w);min-height:174px;border-radius:12px;padding:3px;position:relative;text-align:center;display:flex;border:0;color:inherit;
  box-shadow:0 8px 16px #0009;transition:transform .18s,box-shadow .18s}
.card .face{flex:1;min-width:0;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 7px 9px;overflow:hidden;position:relative}
.card .band{align-self:stretch;margin:0 -7px 2px;display:flex;align-items:center;gap:4px;padding:5px 7px;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.card .band .ico{width:13px;height:13px;stroke-width:2.4}
.card .band .dkico{margin-left:auto;display:flex}
.card .sig{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
.card .sig .ico{width:20px;height:20px;stroke-width:2.4}
.card .nm{font-family:var(--f-display);font-weight:400;font-size:.8rem;line-height:1.1;text-wrap:balance;margin-top:2px}
.card .tx{font-size:.74rem;line-height:1.22}
.card .qty{position:absolute;right:8px;bottom:6px;font-family:var(--f-display);font-size:.78rem}
.card .alvo{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;margin-top:auto;padding-right:24px}

.card.acao{background:var(--dk)}
.card.acao .face{background:radial-gradient(120% 60% at 50% 0%,#fffaf0,transparent 70%),linear-gradient(170deg,#f8eed8,#e4d2a9);color:#2a1f14}
.card.acao .band{background:var(--dk);color:#1a120a}
.card.acao .sig{border-radius:50%;color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--dk) 55%,#fff),var(--dk) 60%,color-mix(in srgb,var(--dk) 65%,#000));box-shadow:0 2px 0 #0003,inset 0 -2px 3px #0004}
.card.acao .tx,.card.acao .alvo{color:#55462f}
.card.acao .qty{color:color-mix(in srgb,var(--dk) 70%,#000)}

.card.trap{background:repeating-linear-gradient(45deg,var(--dk) 0 7px,#0b0810 7px 14px)}
.card.trap .face{background:radial-gradient(110% 60% at 50% 30%,color-mix(in srgb,var(--dk) 26%,transparent),transparent 70%),#131019;color:var(--fg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dk) 55%,transparent)}
.card.trap .band{background:#0b0810;color:var(--dk);border-bottom:1px dashed color-mix(in srgb,var(--dk) 70%,transparent)}
.card.trap .sig{width:34px;height:34px;margin:6px 0 4px;transform:rotate(45deg);border-radius:6px;color:var(--dk);background:#0b0810;border:2px solid var(--dk);box-shadow:0 0 14px color-mix(in srgb,var(--dk) 55%,transparent)}
.card.trap .sig .ico{transform:rotate(-45deg)}
.card.trap .tx,.card.trap .alvo{color:var(--muted)}
.card.trap .qty{color:var(--dk)}
.card.trap .face::after{content:"";position:absolute;inset:auto 0 0;height:5px;background:repeating-linear-gradient(45deg,var(--dk) 0 4px,transparent 4px 8px);opacity:.6}

.card.dim{opacity:.5;filter:saturate(.5)}
.card.mini{--w:88px;min-height:0}
.card.mini .face{padding-bottom:8px}
.card.mini .nm{font-size:.68rem}
.card.mini .sig{width:28px;height:28px;margin:4px 0 2px}
.card.mini .sig .ico{width:15px;height:15px}

/* mão */
.handwrap{display:flex;flex-direction:column;gap:6px}
.handlabel{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.hand{display:flex;gap:0;overflow-x:auto;padding:16px 10px 14px;scroll-snap-type:x proximity}
.hand .card{margin-left:-14px;transform:rotate(calc(var(--i) * 3deg)) translateY(calc(var(--i) * var(--i) * 3px));scroll-snap-align:center}
.hand .card:first-child{margin-left:0}
.hand .card:hover{transform:translateY(-8px) rotate(0);z-index:2}
.hand .card[aria-pressed="true"],.slots .card[aria-pressed="true"]{transform:translateY(-14px) rotate(0) scale(1.04);z-index:3;box-shadow:0 0 0 2px var(--hi),0 0 26px color-mix(in srgb,var(--hi) 55%,transparent)}
.slots .card[aria-pressed="true"]{transform:translateY(-4px)}
/* zona de armadilhas */
.zone{display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#0f0c15,var(--surface));border:1px dashed color-mix(in srgb,var(--dk) 55%,var(--line));border-radius:14px;padding:10px 12px}
.zhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.zhead .handlabel{color:var(--dk)}
.zhint{font-size:.75rem;color:var(--muted)}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:88px;min-height:108px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px;color:var(--muted);font-size:.72rem;line-height:1.2;text-align:center}
.cback.empty{background:none;border:1px dashed var(--line);box-shadow:none}
.backs{gap:4px}.backs .cback{margin-left:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.legend{grid-template-columns:1fr}}
.legend > div{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.legend p{margin:0;font-size:.88rem}
.legend b{display:block;font-family:var(--f-display);font-weight:400;font-size:.95rem;margin-bottom:2px}
.empty-hand{color:var(--muted);padding:10px 0}

.detail{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--dk);animation:rise .25s ease-out}
.detail h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--dk)}
.detail p{margin:0}
.detail .why{color:var(--danger);font-size:.88rem;font-weight:600}
.detail .row{display:flex;gap:8px;flex-wrap:wrap}

/* aba de cartas */
.deck-sec{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.deck-sec h2{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:400;font-size:1.2rem;color:var(--dk)}
.deck-sec h2 .ico{width:22px;height:22px}
.deck-sec .meta{color:var(--muted);margin:0;font-size:.92rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gallery .card{width:auto;min-height:232px}
.gallery .card .tx{font-size:.84rem}

/* regras */
.rules{display:flex;flex-direction:column;gap:12px;max-width:65ch}
.rules h2{font-family:var(--f-display);font-weight:400;font-size:1.05rem;margin:10px 0 0;color:var(--hi)}
.rules p,.rules li{margin:0}
.rules ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* telas cheias */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:radial-gradient(80% 60% at 50% 40%,#2a2140,var(--bg) 70%);
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-in{max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;animation:rise .35s ease-out}
.ov-in .eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-size:.8rem;margin:0}
.ov-in h2{font-family:var(--f-display);font-weight:400;font-size:2.1rem;line-height:1.05;margin:0;text-wrap:balance}
.ov-in .hint{color:var(--muted);margin:0}
.ov-in .bigtoken{width:84px;height:84px;animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%,100%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(180deg) translateY(-8px)}}
.ov-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* palco de efeitos sobre o tabuleiro */
#stage{position:fixed;inset:0;z-index:45;display:none;cursor:pointer;background:radial-gradient(circle at var(--cx,50%) var(--cy,50%),rgba(12,9,20,.55),rgba(12,9,20,.88) 70%);animation:fadein .2s ease-out}
#stage.on{display:block}
#stage.out{animation:fadeout .25s ease-in forwards}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
.stage-in{position:absolute;left:var(--cx,50%);top:var(--cy,50%);transform:translate(-50%,-50%);width:min(88vw,380px);display:flex;flex-direction:column;align-items:center;gap:12px}
.who-line{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;animation:rise .3s ease-out}
.who-line b{color:var(--dk)}
.card.big{--w:min(52vw,200px);min-height:calc(var(--w) * 1.42);padding:4px;animation:cardin .55s cubic-bezier(.2,1.35,.4,1) both;
  box-shadow:0 0 40px color-mix(in srgb,var(--dk) 55%,transparent),0 20px 40px #000c}
.card.big .face{gap:8px;padding:0 12px 14px}
.card.big .band{margin:0 -12px 4px;padding:7px 12px;font-size:.74rem}
.card.big .sig{width:64px;height:64px}
.card.big.trap .sig{width:52px;height:52px;margin:12px 0 8px}
.card.big .sig .ico{width:30px;height:30px}
.card.big .nm{font-size:1.15rem}
.card.big .tx{font-size:.88rem}
.card.big::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);background-size:250% 100%;animation:shine 1.4s .35s ease-out both}
@keyframes cardin{0%{opacity:0;transform:translateY(60px) rotateY(100deg) scale(.5)}60%{opacity:1}100%{transform:none}}
@keyframes shine{from{background-position:120% 0}to{background-position:-60% 0}}
.cardbackbig{width:min(40vw,150px);aspect-ratio:5/7;border-radius:12px;border:1px solid #000;animation:arm .9s cubic-bezier(.3,1.2,.4,1) both;
  background:radial-gradient(circle,color-mix(in srgb,var(--dk) 25%,#fff) 0 14%,transparent 15%),repeating-linear-gradient(45deg,var(--dk) 0 6px,color-mix(in srgb,var(--dk) 40%,#120e1a) 6px 12px);
  box-shadow:inset 0 0 0 5px #120e1a,inset 0 0 0 6px var(--dk),0 0 30px color-mix(in srgb,var(--dk) 45%,transparent),0 16px 30px #000c}
@keyframes arm{0%{opacity:0;transform:translateY(-50px) rotate(-20deg) scale(1.3)}70%{transform:translateY(4px) rotate(2deg) scale(.96)}100%{opacity:1;transform:none}}
.caption{background:var(--surface);border:1px solid color-mix(in srgb,var(--dk,var(--hi)) 60%,var(--line));padding:10px 14px;border-radius:12px;text-align:center;font-weight:600;font-size:1rem;max-width:100%;animation:rise .35s .3s ease-out both;box-shadow:0 10px 24px #000a}
.caption small{display:block;color:var(--muted);font-weight:500;font-size:.78rem;margin-top:4px}
.ribbon{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-4deg);z-index:2;background:var(--dk);color:#140d08;font-family:var(--f-display);font-size:.85rem;padding:4px 12px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 0 #0007;animation:pop .45s .25s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:translateX(-50%) rotate(-4deg) scale(0)}to{transform:translateX(-50%) rotate(-4deg) scale(1)}}
.cardholder{position:relative}
.stamp{position:absolute;left:50%;top:48%;z-index:3;transform:translate(-50%,-50%) rotate(-16deg);font-family:var(--f-display);font-size:1.5rem;color:var(--danger);border:4px solid var(--danger);border-radius:8px;padding:2px 10px;background:#1a0d0dcc;animation:stamp .4s .6s cubic-bezier(.2,1.5,.4,1) both;white-space:nowrap}
@keyframes stamp{from{opacity:0;transform:translate(-50%,-50%) rotate(-16deg) scale(2.4)}to{opacity:1;transform:translate(-50%,-50%) rotate(-16deg) scale(1)}}
.banner{font-family:var(--f-display);font-size:clamp(1.6rem,8vw,2.4rem);line-height:1;text-align:center;color:var(--fg);text-shadow:0 3px 0 #000,0 0 24px var(--dk,var(--hi));animation:slam .5s cubic-bezier(.2,1.5,.4,1) both;text-wrap:balance}
.banner span{color:var(--dk,var(--hi))}
@keyframes slam{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
.skiphint{font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;animation:fadein .3s 1s both}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:48}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;max-width:calc(100% - 32px);font-weight:600;box-shadow:0 10px 24px #000a;animation:rise .2s ease-out}
.loglist{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:2px}
details summary{cursor:pointer;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.bg{animation:none}}

/* 3 jogadores, terreno, marcas */
.board.big .sq .lbl{font-size:7px}
.terr{position:absolute;inset:8%;border-radius:6px;pointer-events:none;z-index:1}
.terr.ice{inset:0;border-radius:0;background:linear-gradient(135deg,rgba(220,245,255,.75),rgba(140,200,230,.55));box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.terr.ice::after{content:"";position:absolute;inset:22%;background:linear-gradient(45deg,transparent 46%,#fff 47% 53%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 47% 53%,transparent 54%);opacity:.7}
.terr.portal{inset:10%;border-radius:50%;background:radial-gradient(circle,#160f22 30%,#7f6ad8 55%,transparent 72%);box-shadow:0 0 12px #9d86ff;animation:glow 1.2s ease-in-out infinite alternate}
.terr.pit{inset:14%;border-radius:50%;border:2px dashed #e8d2a2;background:radial-gradient(circle,#000c,#0004 70%)}
.terr.pit::after{content:"seu fosso";position:absolute;inset:auto -30% -14px;text-align:center;font-size:7px;font-weight:700;color:#f6e7c4;letter-spacing:.04em;text-transform:uppercase}
.pc .skull{position:absolute;right:-6%;top:-6%;width:42%;height:42%;border-radius:50%;background:#0f2a27;border:1.5px solid #3fd6c6;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px #3fd6c6}
.pc .skull svg{width:72%;height:72%;fill:none;stroke:#3fd6c6;stroke-width:2.4}
.plates{display:flex;gap:10px;flex-wrap:wrap}
.plates .plate{flex:1 1 260px;min-width:0}
.plate.out{opacity:.45;filter:grayscale(.7)}
.tag{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.warn{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--danger)}
.tag.bot{background:color-mix(in srgb,var(--hi) 16%,transparent);color:var(--hi)}
.oppbtns{display:flex;gap:8px;flex-wrap:wrap}
.oppbtns button{display:flex;align-items:center;gap:8px}
.die{width:52px;height:52px;border-radius:12px;background:#fff8e8;color:#1a120a;font-family:var(--f-display);font-size:1.6rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #b9a77e,0 10px 20px #000a;animation:roll .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes roll{from{transform:rotate(-540deg) scale(.3)}to{transform:none}}
.deck-sec .stats-line{display:flex;gap:8px;flex-wrap:wrap}
.wr{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--fg);font-variant-numeric:tabular-nums}
.wr i{font-style:normal;color:var(--muted);font-weight:600}
.watch{color:var(--muted);padding:6px 0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;width:100%}
.tbl th,.tbl td{padding:6px 6px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--dk);vertical-align:middle;margin-right:6px}

@media (max-width:520px){.brand .suits{display:none}.brand h1{font-size:1.3rem}}

/* prévia das cartas */
.boardin{position:relative}
.pvsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}
.pv-arrow{animation:pvpulse 1s ease-in-out infinite alternate}
@keyframes pvpulse{from{opacity:.55}to{opacity:1}}
.pvnote{margin:0;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid color-mix(in srgb,var(--dk) 60%,var(--line));border-left:4px solid var(--dk);font-size:.9rem;font-weight:600}
.card .copy{font-size:.62rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1.15;padding:3px 7px;border-radius:8px;background:color-mix(in srgb,var(--dk) 30%,transparent);color:inherit;max-width:100%;text-wrap:balance}

.echo-row .card{flex:none}

.pvbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;gap:8px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:2px solid var(--dk);box-shadow:0 -10px 30px #000a;animation:rise .2s ease-out}

.pvbar .btn{padding:10px 12px;font-size:.8rem}
.pvbar .row{flex-wrap:nowrap}
.pvbar .row .btn{flex:1 1 auto;min-width:0}


.plates.compact{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}

/* peças e fichas na cor do baralho do dono (--pc vem do jogo) */

  radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--pc) 40%,#fff),var(--pc) 45%,color-mix(in srgb,var(--pc) 62%,#000) 100%);
  box-shadow:0 3px 0 color-mix(in srgb,var(--pc) 40%,#000),0 5px 8px #000a}

.temamenu .tm-title{margin:2px 6px 4px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.temamenu button,.temagrid button{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;color:var(--fg);border-radius:10px;padding:8px;text-align:left;font-weight:700}
.temamenu button[aria-pressed="true"],.temagrid button[aria-pressed="true"]{border-color:var(--hi);background:var(--surface2)}
.tswatch{display:flex;flex:none;border-radius:6px;overflow:hidden;border:1px solid #0005}
.tswatch i{width:12px;height:22px;display:block}
.temagrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.temagrid button{border-color:var(--line);background:var(--card-lo)}
.temamenu[hidden],[hidden]{display:none!important}
.temagrid button span:last-child{min-width:0;overflow-wrap:anywhere;line-height:1.15}

/* miniaturas dos temas */
.tprev{flex:none;position:relative;width:92px;height:62px;border-radius:9px;overflow:hidden;display:block;box-shadow:inset 0 0 0 1px #0004}
.tp-board{position:absolute;left:7px;top:7px;width:48px;height:48px;box-sizing:border-box;padding:2px;display:block}
.tp-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);width:100%;height:100%}
.tp-grid i{display:flex;align-items:center;justify-content:center}
.tp-grid b{display:block;width:78%;height:78%;border-radius:50%}
.tp-card{position:absolute;right:7px;top:9px;width:24px;height:34px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:3px;box-sizing:border-box;transform:rotate(6deg)}
.tp-card i{display:block;width:100%;height:6px;flex:none}
.tp-card b{display:block;width:9px;height:9px;flex:none}
.tp-card u{display:block;width:60%;height:2px;opacity:.55;flex:none}
.tp-name{position:absolute;right:8px;bottom:4px;font-size:11px;line-height:1}
.tm-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tm-txt b{font-size:.92rem}
.tm-txt small{font-size:.72rem;color:var(--muted);font-weight:500;line-height:1.2}
.temamenu{width:min(320px,calc(100vw - 32px))}
.temagrid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

/* ---- menu principal ---- */
.menu{display:flex;flex-direction:column;gap:16px;max-width:520px;margin:0 auto;width:100%;padding-block:6px 24px}
.menu-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 0 6px}
.menu-pieces{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.menu-pieces .token{width:22px;height:22px;animation:hop 2.4s ease-in-out infinite}
.menu-pieces .token:nth-child(2n){animation-delay:.3s}.menu-pieces .token:nth-child(3n){animation-delay:.6s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.menu-title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,10vw,3rem);line-height:1;color:var(--hi);text-wrap:balance}
.menu-title span{color:var(--fg)}
.menu-sub{margin:0;color:var(--muted);max-width:34ch}
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-item{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface2),var(--surface));color:var(--fg);position:relative;transition:transform .12s,border-color .12s}
.menu-item:hover{transform:translateY(-2px);border-color:var(--hi)}
.menu-item span{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.menu-item b{font-family:var(--f-display);font-weight:400;font-size:1.05rem;letter-spacing:.01em}
.menu-item small{color:var(--muted);font-size:.86rem;line-height:1.25}
.menu-item.primary{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi),0 8px 24px #0006}
.menu-item.primary .mi-ico{background:var(--hi);color:var(--bg)}
.mi-ico{width:44px;height:44px;flex:none;padding:11px;box-sizing:border-box;border-radius:12px;background:var(--surface2);border:1px solid var(--line);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--hi)}
.soon{font-style:normal;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--hi) 18%,transparent);color:var(--hi);flex:none}
.menu-row{display:flex;gap:8px}
.menu-row .btn{flex:1}
.menu-foot{margin:0;text-align:center;font-size:.78rem;color:var(--muted)}
.sub-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.3rem;color:var(--hi)}
.btn.back{padding:8px 12px}
.online-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.online .seat{gap:12px}
.roomcode{display:flex;gap:6px}
.roomcode span{width:44px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px dashed var(--line);font-family:var(--f-display);font-size:1.4rem;color:var(--muted);background:var(--card-lo)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.field input{font:inherit;font-size:1.2rem;letter-spacing:.3em;text-transform:uppercase;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card-lo);color:var(--fg)}
.soonlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.btn:disabled{cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.menu-pieces .token{animation:none}}
.ir-deck span{font-size:.44rem;letter-spacing:0;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}

.pcs{display:none}

/* menu de som */
.sommenu{width:min(280px,calc(100vw - 32px))}
.sndrow{display:flex;align-items:center;gap:10px;padding:6px}
.sndrow .sw{display:flex;align-items:center;gap:8px;font-weight:700;min-width:96px;cursor:pointer}
.sndrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--hi)}
.sndrow input[type=range]{flex:1;min-width:0;accent-color:var(--hi)}
.tm-hint{margin:2px 6px 4px;font-size:.75rem;color:var(--muted)}
.temabtn.muted svg path:last-child{opacity:.2}
body.ingame #sombtn span{display:none}
body.ingame #sombtn{padding:6px}

/* ---- arrastar cartas ---- */
.hand .card,.traprail .card{touch-action:pan-x;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card.dragging{opacity:.25}
.dragghost{position:fixed!important;left:0;top:0;z-index:80;pointer-events:none;margin:0!important;transition:filter .12s;box-shadow:0 18px 40px #000b!important;will-change:transform}
.dragghost.to-trash{filter:grayscale(.6) brightness(.8)}
#dragui{display:none}
#dragui.on{display:block}
#usezone{display:none;position:fixed;left:8px;right:8px;top:8px;z-index:75;border:3px dashed color-mix(in srgb,var(--hi) 60%,transparent);border-radius:16px;
  background:color-mix(in srgb,var(--hi) 6%,transparent);pointer-events:none;align-items:flex-end;justify-content:center;padding-bottom:12px;box-sizing:border-box;transition:background .15s,border-color .15s}
#dragui.on.canuse #usezone{display:flex}
#usezone span{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;padding:6px 12px;border-radius:99px;background:var(--surface);color:var(--hi);border:1px solid var(--line)}
#usezone.hot{background:color-mix(in srgb,var(--hi) 16%,transparent);border-color:var(--hi)}
#trashbin{display:none;position:fixed;right:max(14px,env(safe-area-inset-right,0px));z-index:78;width:86px;height:86px;border-radius:50%;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--surface);border:2px dashed var(--danger);color:var(--danger);font-size:.68rem;font-weight:800;text-transform:uppercase;box-shadow:0 10px 26px #000a;pointer-events:none;transition:transform .15s,background .15s}
#dragui.on.candiscard #trashbin{display:flex}
#trashbin svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#trashbin.hot{transform:scale(1.15);background:color-mix(in srgb,var(--danger) 22%,var(--surface));border-style:solid}
.draghint{font-size:.85rem;font-weight:700;color:var(--hi)}
.sheet .row:empty{display:none}

/* ---- avisos sem a barra de status ---- */
.ir-mod{font-size:.48rem;font-weight:800;text-transform:uppercase;line-height:1.1;color:var(--hi);background:color-mix(in srgb,var(--hi) 14%,transparent);border-radius:5px;padding:2px 3px}
.ir-mod.warn{color:var(--danger);background:color-mix(in srgb,var(--danger) 16%,transparent)}
.passpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:32;width:min(360px,calc(100vw - 32px));
  display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 14px 12px;border-radius:14px;border:1px solid var(--hi);
  background:var(--surface);color:var(--fg);box-shadow:0 10px 26px #000a;overflow:hidden;animation:rise .2s ease-out}
.passpill span{font-weight:800}
.passpill small{color:var(--muted);font-size:.78rem;line-height:1.25}
.passpill i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--hi);transform-origin:left;animation:passbar 3.5s linear forwards}
@keyframes passbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* aviso no meio do tabuleiro */
.boardrow{position:relative}
.askpop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;width:min(320px,calc(100vw - 40px));box-sizing:border-box;
  display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:16px;background:var(--surface);color:var(--fg);border:2px solid var(--hi);
  box-shadow:0 0 0 100vmax rgba(0,0,0,.35),0 18px 40px #000c;text-align:center;animation:askin .22s cubic-bezier(.2,1.3,.4,1)}
@keyframes askin{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.askpop b{font-family:var(--f-display);font-weight:400;font-size:1.1rem;color:var(--hi)}
.askpop span{font-size:.9rem;color:var(--muted);line-height:1.3}
.askbtns{display:flex;gap:8px}
.askbtns .btn{flex:1;padding:11px 8px}
.asknever{border:0;background:none;color:var(--muted);font-size:.78rem;text-decoration:underline;padding:4px}

/* avisos de carta flutuando sobre o tabuleiro (sem empurrar a tela) */
body:has(.sheet) main{padding-bottom:0}
.boardwrap .sheet.pop{position:absolute;left:50%;right:auto;bottom:auto;top:50%;z-index:14;
  width:min(330px,calc(100% - 16px));box-sizing:border-box;max-height:min(72%,420px);overflow-y:auto;
  padding:12px 14px;border:2px solid var(--dk);border-radius:16px;background:color-mix(in srgb,var(--surface) 96%,transparent);
  box-shadow:0 18px 40px #000c;transform:translate(-50%,-50%);animation:popin .2s cubic-bezier(.2,1.3,.4,1)}
.boardwrap .sheet.pop[data-side="top"]{top:10px;transform:translate(-50%,0);animation-name:popin0}
.boardwrap .sheet.pop[data-side="bottom"]{top:auto;bottom:10px;transform:translate(-50%,0);animation-name:popin0}
.boardwrap .sheet.pop.hint{top:0;transform:translate(-50%,-55%);width:auto;max-width:calc(100% - 8px);padding:6px 8px 6px 14px;border-radius:999px;animation-name:popinh}
.sheet.pop.hint .sheet-in{flex-direction:row;align-items:center;gap:10px}
.sheet.pop.hint p{font-size:.82rem;line-height:1.2}
.sheet.pop.hint .row .btn{padding:6px 10px;font-size:.74rem;flex:0 0 auto}
.sheet.pop .row{flex-wrap:wrap}
.sheet.pop .row .btn{padding:9px 8px}
@keyframes popin{from{opacity:0;transform:translate(-50%,-50%) scale(.88)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes popin0{from{opacity:0;transform:translate(-50%,0) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes popinh{from{opacity:0;transform:translate(-50%,-55%) scale(.9)}to{opacity:1;transform:translate(-50%,-55%) scale(1)}}
.boardwrap .sheet.pop{width:min(360px,calc(100vw - 24px));max-height:none;overflow:visible;padding:10px 12px}
.sheet.pop .sheet-in{gap:5px}
.sheet.pop h4{font-size:.85rem}
.sheet.pop p{font-size:.8rem;line-height:1.3}
.sheet.pop .pvtext{font-size:.76rem;padding:4px 8px}
.sheet.pop .zhint,.sheet.pop .why,.sheet.pop .draghint{font-size:.72rem}
.sheet.pop .trapchip{font-size:.62rem}
.sheet.pop .row .btn{padding:8px 6px;font-size:.72rem}
.boardwrap .sheet.pop.hint{width:max-content;max-width:calc(100vw - 24px)}
.sheet.pop.hint p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* baralho tocável + coluna de informações maior */
button.deckname,button.ir-deck{font:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.plate button.deckname{color:var(--dk);font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:4px;
  padding:2px 7px 2px 5px;margin-left:-5px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--dk) 55%,transparent);max-width:100%}
.plate button.deckname:active{background:color-mix(in srgb,var(--dk) 18%,transparent)}
.dvhint{font-size:.58rem;letter-spacing:.04em;opacity:.75;margin-left:2px;text-transform:lowercase}
.plates.compact.trio .dvhint{display:none}
.inforail{width:66px;gap:7px;padding:10px 3px}
.inforail .token{width:26px;height:26px}
.ir-name{font-size:.8rem}
button.ir-deck{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dk);font-size:.58rem;font-weight:800;text-transform:uppercase;line-height:1.05;
  padding:4px 3px;border-radius:8px;border:1px dashed color-mix(in srgb,var(--dk) 55%,transparent);max-width:100%;overflow-wrap:anywhere}
.ir-deck .ico{width:19px;height:19px}
.ir-st b{font-size:1.15rem}
.ir-st span{font-size:.6rem}
.ir-tag{font-size:.56rem}
@media (max-width:380px){.inforail{width:60px}.ir-st b{font-size:1.05rem}}
.deckmodal .ov-in{max-width:min(620px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);overflow-y:auto;box-sizing:border-box}
.dv-title{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dk);margin:2px 0}
.dv-title .ico{width:26px;height:26px}
.dv-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:.8rem;color:var(--muted);margin:6px 0 10px}
.dv-stats b{color:var(--fg);font-size:1rem}
.dv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px;justify-items:center}
.deckmodal .card{--w:100%;width:100%;max-width:180px;min-height:0}
.deckmodal .card .tx{font-size:.72rem}
.deckmodal .card .nm{font-size:.8rem}
.dv-grid{width:100%;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.deckmodal .card .sig{width:34px;height:34px}
.deckmodal #closedeck{position:sticky;bottom:0;box-shadow:0 -8px 20px rgba(12,9,20,.9)}
.dragghost{transition:none;box-shadow:0 10px 22px #000a!important;contain:layout paint}
.hand .card,.traprail .card{-webkit-user-drag:none}
.backs{flex-direction:column;gap:2px}
.backs>.cback{display:inline-block}
.backs{display:grid;grid-template-columns:auto auto;justify-items:center;column-gap:4px;row-gap:2px}
.backs .bl{grid-column:1/-1;font-size:.55rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.backs.armed .bl{color:var(--danger)}
.backs.armed .cback:not(.empty){box-shadow:0 0 8px color-mix(in srgb,var(--danger) 70%,transparent)}
.plates.compact.trio .backs{display:flex;flex-direction:row;align-items:center;gap:4px}
.plates.compact.trio .backs .bl{margin-left:2px}
.backs .bl{text-transform:none;font-size:.62rem;letter-spacing:0}
.plates:not(.trio) .plate button.deckname{width:max-content;max-width:none;white-space:nowrap}
.plates:not(.trio) .plate button.deckname{letter-spacing:.03em;font-size:.76rem}
.dvhint{font-size:.9rem;line-height:1;letter-spacing:0;margin-left:1px}

/* ---- online ---- */
.online .sub-h{flex-wrap:wrap}
.netstat{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted)}
.netdot{width:9px;height:9px;border-radius:50%;background:#e0a33a;box-shadow:0 0 0 3px color-mix(in srgb,#e0a33a 25%,transparent);animation:netpulse 1.2s ease-in-out infinite}
.netdot.ok{background:#3ccf7e;box-shadow:0 0 0 3px color-mix(in srgb,#3ccf7e 25%,transparent);animation:none}
.netdot.bad{background:var(--danger)}
@keyframes netpulse{50%{opacity:.4}}
.namefield input{letter-spacing:.02em;text-transform:none;font-size:1.05rem}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2>.btn{flex:1 1 auto}
.row2.center{justify-content:center}.row2.center>.btn{flex:0 1 auto}
.codeline{margin-top:10px}
.codeline input{flex:1 1 140px;min-width:0;font:inherit;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card-lo);color:var(--fg)}
.codeline input::placeholder{letter-spacing:0;text-transform:none;color:var(--muted)}
.roomlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.roomrow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:12px;background:var(--card-lo);border:1px solid var(--line)}
.rr-code{font-family:var(--f-display);font-size:.95rem;letter-spacing:.08em;color:var(--hi);min-width:3.2em}
.rr-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.rr-txt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-txt small{color:var(--muted);font-size:.75rem}
.roomrow .btn{flex:none;padding:9px 14px}
.emptyrooms{margin:4px 0;color:var(--muted);font-size:.9rem}
.roomcode.big{justify-content:center}
.roomcode.big span{color:var(--hi);border-style:solid;border-color:color-mix(in srgb,var(--hi) 50%,var(--line));font-size:1.7rem;width:50px;height:60px}
.lseats{display:flex;flex-direction:column;gap:10px}
.lseat{padding:10px 12px;border-radius:14px;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lseat.me{border-color:var(--dk,var(--hi));box-shadow:0 0 14px color-mix(in srgb,var(--dk,var(--hi)) 25%,transparent)}
.lseat.open{opacity:.75;border-style:dashed}
.lseat .seat-h{display:flex;align-items:center;gap:10px}
.lseat .seat-h h3{flex:1;margin:0;font-size:1rem;display:flex;flex-direction:column}
.lseat .seat-h small{font-size:.74rem;color:var(--muted);font-weight:400}
.deckgrid.mini{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.deckgrid.mini button{font-size:.78rem;padding:6px 7px}
.deckgrid.mini .ico{width:15px;height:15px;flex:none}
.note.center{text-align:center}
.waitnote{animation:netpulse 2s ease-in-out infinite}
.netspin{width:38px;height:38px;margin:4px auto 8px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--hi);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lobby .seg button{white-space:nowrap;padding-inline:8px}
@media (max-width:440px){.brand small{display:none}.lobby .seg button{font-size:.68rem;letter-spacing:.02em}}

/* personagens dos baralhos */
svg.char{display:block;flex:none;overflow:visible}
.menu-pieces{gap:2px!important;flex-wrap:wrap;justify-content:center}
svg.mchar{width:38px;height:44px}
svg.schar{width:44px;height:51px}
.pchar{position:relative;display:inline-block;flex:none;width:38px;height:44px}
.pchar svg.char{width:100%;height:100%}
.pchar .token{position:absolute;right:-3px;bottom:2px;width:13px!important;height:13px!important;box-shadow:0 0 0 2px var(--surface)}
.pchar.big{width:54px;height:62px}
.pchar.big .token{width:15px!important;height:15px!important}
.plates.compact .pchar{width:32px;height:37px}
.bigchar{display:block;margin:0 auto 4px;width:110px;height:128px}
.bigchar svg.char{width:100%;height:100%;filter:drop-shadow(0 8px 18px #0008)}
.dv-char{margin:0;font-style:italic;color:var(--dk);font-weight:600}
.ds-head{display:flex;align-items:center;gap:12px}
.ds-head h2{margin:0}
svg.dschar{width:64px;height:74px}
svg.bchar{width:78px;height:90px;margin:0 auto 6px}
.banner svg.bchar{display:block}
@media (max-width:440px){svg.mchar{width:30px;height:35px}}
.dv-char .ico{width:1em;height:1em;vertical-align:-2px;margin-right:4px}
.setup .seat-h{flex-wrap:nowrap}
.setup .seat-h h3{flex:1 1 auto;min-width:0}
.setup .seat-h small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setup .seat-h .seg{flex:none}

/* ---- tutorial jogável ---- */
.coach{border:2px solid var(--hi);border-radius:16px;background:linear-gradient(180deg,var(--surface2),var(--surface));padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 18px color-mix(in srgb,var(--hi) 22%,transparent)}
.coach-top{display:flex;align-items:center;gap:8px}
.coach-step{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--hi);white-space:nowrap}
.coach-dots{display:flex;gap:4px;flex:1;min-width:0}
.coach-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.coach-dots i.done{background:color-mix(in srgb,var(--hi) 55%,transparent)}
.coach-dots i.now{background:var(--hi);box-shadow:0 0 0 3px color-mix(in srgb,var(--hi) 30%,transparent)}
.btn.small{padding:6px 10px;font-size:.7rem;flex:none}
.coach-body{display:flex;gap:10px;align-items:flex-start}
svg.coachchar{width:48px;height:56px}
.coach-body h3{margin:0 0 2px;font-family:var(--f-display);font-weight:400;font-size:1.05rem;color:var(--hi)}
.coach-body p{margin:0;font-size:.9rem;line-height:1.35}
.coach-body b{color:var(--hi)}
.tutpop .bigchar{width:90px;height:105px}
.tutfromrules{width:100%;margin-bottom:12px}
.classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.classcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:10px 8px 12px;border-radius:16px;background:var(--card-lo);border:2px solid var(--line);color:var(--fg);font:inherit;cursor:pointer}
.classcard[aria-pressed="true"]{border-color:var(--dk);background:color-mix(in srgb,var(--dk) 16%,var(--card-lo));box-shadow:0 0 16px color-mix(in srgb,var(--dk) 30%,transparent)}
svg.cc-char{width:72px;height:84px}
.classcard b{font-size:1rem}
.classcard small{color:var(--dk);font-weight:700;font-size:.72rem}
.cc-blurb{font-size:.74rem;color:var(--muted);line-height:1.25}
@media (max-width:440px){.classgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cc-blurb{display:none}}
.tutdeckbtns{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(transparent,rgba(12,9,20,.95) 30%)}
.coach-sub{font-family:var(--f-body);font-size:.7rem;color:var(--muted);letter-spacing:.04em}
.coach-sub{display:block;margin-top:2px}
.sq.tut-foe .pc{animation:tutfoe .5s ease-in-out infinite alternate}@keyframes tutfoe{to{transform:scale(1.15);filter:drop-shadow(0 0 8px #ff5a5a)}}
/* tutorial: carta que deve ser usada */
.hand .card.tut-want{z-index:3;overflow:visible;transform:translateY(-10px) rotate(0)!important;outline:3px solid var(--hi);outline-offset:3px;animation:tutwant 1.1s ease-in-out infinite}
@keyframes tutwant{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hi) 70%,transparent),0 10px 24px #000a}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--hi) 0%,transparent),0 0 26px color-mix(in srgb,var(--hi) 80%,transparent)}}
.hand .card.tut-want::before{content:attr(data-hint);position:absolute;left:50%;top:-34px;transform:translateX(-50%);white-space:nowrap;padding:5px 10px;border-radius:99px;background:var(--hi);color:#1b1408;font:800 .7rem/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 12px #0008;animation:tutbob .9s ease-in-out infinite alternate;pointer-events:none}
@keyframes tutbob{to{transform:translate(-50%,-6px)}}
.tut-handwant .hand{padding-top:44px;overflow:visible}
.tut-handwant .hand .card:not(.tut-want){filter:saturate(.5) brightness(.75)}
@media (prefers-reduced-motion:reduce){.hand .card.tut-want,.hand .card.tut-want::before{animation:none}}
.hand .card.tut-want::before{left:-4px;transform:none;animation-name:tutbob2}
@keyframes tutbob2{to{transform:translateY(-6px)}}
.tut-handwant .hand .card:not(.tut-want){filter:saturate(.5) brightness(.7)!important}

/* tema: brinquedo.css */
/* ===== Tema Brinquedo: amarelo, contornos grossos, cantos redondos ===== */
html[data-tema="brinquedo"]{
  --bg:#ffcf3d; --surface:#ffffff; --surface2:#fff4dc; --line:#1d1340;
  --fg:#1d1340; --muted:#5b4f80; --hi:#6d28d9; --danger:#d61f3c;
  --f-display:'Fredoka','Trebuchet MS',sans-serif; --f-body:'Fredoka','Trebuchet MS',sans-serif;
  --card-hi:#ffffff; --card-lo:#fff4dc; --sq-light:#fff4dc; --sq-dark:#ff8a65;
  --wood1:#8b5cf6; --wood2:#6d28d9;
  --ink:#1d1340; --mint:#22d3a6;
  color-scheme:light;
}
html[data-tema="brinquedo"] body{background:#ffcf3d;color:#1d1340;font-weight:500}
html[data-tema="brinquedo"] body::before{background:#ffcf3d}
html[data-tema="brinquedo"] .bg{display:none}

/* cores de baralho mais escuras para ler no claro */
html[data-tema="brinquedo"] .d-ataque{--dk:#d63a17}
html[data-tema="brinquedo"] .d-defesa{--dk:#1f63c4}
html[data-tema="brinquedo"] .d-distancia{--dk:#178a4c}
html[data-tema="brinquedo"] .d-trapaceiro{--dk:#7a3cc4}
html[data-tema="brinquedo"] .d-necromante{--dk:#0f8f83}
html[data-tema="brinquedo"] .d-arquiteto{--dk:#4f5a70}
html[data-tema="brinquedo"] .d-realeza{--dk:#c2185b}
html[data-tema="brinquedo"] .d-enxame{--dk:#b86a00}
html[data-tema="brinquedo"] .d-apostador{--dk:#8a7a00}
html[data-tema="brinquedo"] .d-relojoeiro{--dk:#8a5530}

/* cabeçalho */
html[data-tema="brinquedo"] header{background:#ffcf3d;backdrop-filter:none;-webkit-backdrop-filter:none}
html[data-tema="brinquedo"] .brand h1{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#ffffff;-webkit-text-stroke:1.5px #1d1340;text-shadow:0 3px 0 #1d1340;filter:none;font-family:'Fredoka',sans-serif;font-weight:700}
html[data-tema="brinquedo"] .brand small{color:#1d1340}
html[data-tema="brinquedo"] .brand .suits i{outline:1.5px solid #1d1340}
html[data-tema="brinquedo"] .tabs,html[data-tema="brinquedo"] .seg{background:#ffffff;border:3px solid #1d1340;border-radius:14px;box-shadow:0 3px 0 #1d1340}
html[data-tema="brinquedo"] .tabs button,html[data-tema="brinquedo"] .seg button{color:#1d1340;border-radius:10px;font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.02em}
html[data-tema="brinquedo"] .tabs button[aria-selected="true"],html[data-tema="brinquedo"] .seg button[aria-pressed="true"]{background:#6d28d9;color:#ffffff;box-shadow:none}

/* botões */
html[data-tema="brinquedo"] .btn{font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:.02em;text-transform:none;border:3px solid #1d1340;border-radius:14px;background:#ffffff;color:#1d1340;box-shadow:0 4px 0 #1d1340}
html[data-tema="brinquedo"] .btn.primary{background:#22d3a6;color:#1d1340;box-shadow:0 4px 0 #1d1340}
html[data-tema="brinquedo"] .btn.primary:active,html[data-tema="brinquedo"] .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d1340}
html[data-tema="brinquedo"] .btn.ghost{background:#fff4dc;color:#1d1340;border:3px solid #1d1340}
html[data-tema="brinquedo"] #discardcard,html[data-tema="brinquedo"] #discardtrap{background:#ffcf3d}
html[data-tema="brinquedo"] .btn:disabled{opacity:.5}

/* textos de apoio */
html[data-tema="brinquedo"] .lead,html[data-tema="brinquedo"] .note,html[data-tema="brinquedo"] .deckblurb,html[data-tema="brinquedo"] .zhint,
html[data-tema="brinquedo"] .handlabel,html[data-tema="brinquedo"] .watch,html[data-tema="brinquedo"] details summary,html[data-tema="brinquedo"] .meta{color:#3d3266}
html[data-tema="brinquedo"] .why{color:#d61f3c}
html[data-tema="brinquedo"] .modchip{background:#6d28d9;color:#ffffff}
html[data-tema="brinquedo"] .trapchip{background:#ffffff}

/* configuração */
html[data-tema="brinquedo"] .seat{background:#ffffff;border:3px solid #1d1340;border-radius:20px;box-shadow:0 5px 0 #1d1340}
html[data-tema="brinquedo"] .seat-h h3{font-family:'Fredoka',sans-serif;font-weight:700}
html[data-tema="brinquedo"] .seat-h small{color:#3d3266}
html[data-tema="brinquedo"] .deckgrid button{background:#fff4dc;border:2.5px solid #1d1340;border-radius:12px}
html[data-tema="brinquedo"] .deckgrid button[aria-pressed="true"]{background:color-mix(in srgb,var(--dk) 22%,#ffffff);border-color:#1d1340;box-shadow:0 3px 0 #1d1340,inset 0 0 0 2px var(--dk)}

/* placas, colunas, status */
html[data-tema="brinquedo"] .plate,html[data-tema="brinquedo"] .inforail,html[data-tema="brinquedo"] .status{background:#ffffff;border:3px solid #1d1340;border-radius:16px;box-shadow:0 4px 0 #1d1340;color:#1d1340}
html[data-tema="brinquedo"] .plate.turn,html[data-tema="brinquedo"] .inforail.turn{border-color:#1d1340;box-shadow:0 4px 0 #1d1340,0 0 0 3px var(--dk)}
html[data-tema="brinquedo"] .plate .stats{color:#3d3266}
html[data-tema="brinquedo"] .plate .stats b,html[data-tema="brinquedo"] .ir-st b{color:#1d1340}
html[data-tema="brinquedo"] .ir-st span{color:#3d3266}
html[data-tema="brinquedo"] .tag{background:#fff4dc;color:#1d1340;border:1.5px solid #1d1340}
html[data-tema="brinquedo"] .tag.bot{background:#ffcf3d;color:#1d1340}
html[data-tema="brinquedo"] .tag.warn{background:#ffe0e5;color:#b0102a}
html[data-tema="brinquedo"] .ir-tag{color:#b0102a}
html[data-tema="brinquedo"] .cback{border:2px solid #1d1340;border-radius:4px;background:repeating-linear-gradient(-45deg,#ffcf3d 0 3px,#1d1340 3px 6px)}
html[data-tema="brinquedo"] .cback.empty{background:none;border:2px dashed #1d1340;opacity:.35}
html[data-tema="brinquedo"] .status p{font-weight:600}
html[data-tema="brinquedo"] .status p em{color:#d61f3c}
html[data-tema="brinquedo"] .traprail{background:#fff4dc;border:3px dashed #1d1340;border-radius:16px}
html[data-tema="brinquedo"] .raillabel{color:#6d28d9}
html[data-tema="brinquedo"] .railnote{color:#3d3266}
html[data-tema="brinquedo"] .slot{border:2.5px dashed #1d1340;color:#3d3266;border-radius:12px;opacity:.6}

/* tabuleiro */
html[data-tema="brinquedo"] .boardwrap{background:#8b5cf6;border:3px solid #1d1340;border-radius:20px;box-shadow:0 5px 0 #1d1340}
html[data-tema="brinquedo"] .boardwrap::before{display:none}
html[data-tema="brinquedo"] .board{border-radius:12px;border:2.5px solid #1d1340;box-shadow:none}
html[data-tema="brinquedo"] .sq{background:#fff4dc}
html[data-tema="brinquedo"] .sq.dark{background:#ff8a65;box-shadow:none}
html[data-tema="brinquedo"] .sq.last{background:#ffb347}
html[data-tema="brinquedo"] .sq .lbl{color:rgba(29,19,64,.55)}
html[data-tema="brinquedo"] .sq.wall{background:repeating-linear-gradient(-45deg,#ffcf3d 0 5px,#1d1340 5px 10px)}
html[data-tema="brinquedo"] .dot{background:#ffffff;border:3px solid #1d1340;box-shadow:none;box-sizing:border-box}
html[data-tema="brinquedo"] .dot.cap{background:#d61f3c}

/* peças como balas: cor do jogador, contorno de tinta e brilho branco */
html[data-tema="brinquedo"] .token,html[data-tema="brinquedo"] .pc{
  background:radial-gradient(circle at 33% 28%,#ffffff 0 14%,transparent 17%),var(--pc);
  border:2.5px solid #1d1340;box-sizing:border-box;box-shadow:0 3px 0 #1d1340}
html[data-tema="brinquedo"] .pc .crown{fill:#ffcf3d;stroke:#1d1340;stroke-width:2.6;stroke-linejoin:round}
html[data-tema="brinquedo"] .sq.movable .pc{box-shadow:0 3px 0 #1d1340,0 0 0 3px #ffffff}
html[data-tema="brinquedo"] .sq.sel .pc::before{border:3px solid #ffffff;box-shadow:0 0 0 2px #1d1340}
html[data-tema="brinquedo"] .pc.shield::before{border-color:#1f63c4;box-shadow:none}

/* cartas: ação = branca com faixa menta; armadilha = roxa com faixa listrada */
html[data-tema="brinquedo"] .card{border-radius:16px;box-shadow:0 4px 0 #1d1340;padding:0;border:3px solid #1d1340}
html[data-tema="brinquedo"] .card .face{border-radius:12px}
html[data-tema="brinquedo"] .card.acao{background:#ffffff}
html[data-tema="brinquedo"] .card.acao .face{background:#ffffff;color:#1d1340}
html[data-tema="brinquedo"] .card.acao .band{background:#22d3a6;color:#1d1340;border-bottom:3px solid #1d1340}
html[data-tema="brinquedo"] .card.acao .sig{background:var(--dk);color:#ffffff;border:2.5px solid #1d1340;box-shadow:none}
html[data-tema="brinquedo"] .card.acao .tx,html[data-tema="brinquedo"] .card.acao .alvo{color:#3d3266}
html[data-tema="brinquedo"] .card.acao .qty{color:#1d1340}
html[data-tema="brinquedo"] .card.trap{background:#6d28d9}
html[data-tema="brinquedo"] .card.trap .face{background:#6d28d9;color:#ffffff;box-shadow:none}
html[data-tema="brinquedo"] .card.trap .band{background:repeating-linear-gradient(-45deg,#ffcf3d 0 6px,#1d1340 6px 12px);color:#1d1340;border-bottom:3px solid #1d1340}
html[data-tema="brinquedo"] .card.trap .band span{background:#ffcf3d;border-radius:4px;padding:0 3px}
html[data-tema="brinquedo"] .card.trap .band .ico{background:#ffcf3d;border-radius:3px}
html[data-tema="brinquedo"] .card.trap .sig{background:#ffcf3d;color:#1d1340;border:2.5px solid #1d1340;box-shadow:none}
html[data-tema="brinquedo"] .card.trap .tx,html[data-tema="brinquedo"] .card.trap .alvo{color:#ede4ff}
html[data-tema="brinquedo"] .card.trap .qty{color:#ffcf3d}
html[data-tema="brinquedo"] .card.trap .face::after{display:none}
html[data-tema="brinquedo"] .card .nm{font-family:'Fredoka',sans-serif;font-weight:700;font-size:.9rem}
html[data-tema="brinquedo"] .card .copy{background:#ffcf3d;color:#1d1340;border:1.5px solid #1d1340}
html[data-tema="brinquedo"] .card.micro{border-width:2.5px;border-radius:12px;box-shadow:0 3px 0 #1d1340}
html[data-tema="brinquedo"] .card.micro .nm{font-size:.6rem}
html[data-tema="brinquedo"] .hand .card[aria-pressed="true"],html[data-tema="brinquedo"] .traprail .card[aria-pressed="true"]{box-shadow:0 4px 0 #1d1340,0 0 0 4px #ffffff}
html[data-tema="brinquedo"] .card.dim{opacity:.55;filter:saturate(.6)}

/* folha inferior e prévia */
html[data-tema="brinquedo"] .sheet,html[data-tema="brinquedo"] .pvbar{background:#ffffff;border-top:3px solid #1d1340;border-radius:22px 22px 0 0;box-shadow:0 -4px 0 #1d1340;backdrop-filter:none;-webkit-backdrop-filter:none;color:#1d1340}
html[data-tema="brinquedo"] .sheet h4{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.1rem}
html[data-tema="brinquedo"] .sheet .pvtext,html[data-tema="brinquedo"] .pvnote{background:#fff4dc;border:2px solid #1d1340;border-left:6px solid var(--dk);color:#1d1340}

/* telas cheias, palco e avisos */
html[data-tema="brinquedo"] .overlay{background:#ffcf3d}
html[data-tema="brinquedo"] .overlay.logmodal{background:rgba(255,207,61,.94)}
html[data-tema="brinquedo"] .ov-in h2{font-family:'Fredoka',sans-serif;font-weight:700;color:#ffffff;-webkit-text-stroke:2px #1d1340;text-shadow:0 4px 0 #1d1340}
html[data-tema="brinquedo"] .ov-in .eyebrow,html[data-tema="brinquedo"] .ov-in .hint{color:#1d1340}
html[data-tema="brinquedo"] #stage{background:rgba(29,19,64,.55)}
html[data-tema="brinquedo"] .who-line{color:#ffffff;text-shadow:0 2px 0 #1d1340}
html[data-tema="brinquedo"] .who-line b{color:#ffcf3d}
html[data-tema="brinquedo"] .caption{background:#ffffff;color:#1d1340;border:3px solid #1d1340;border-radius:16px;box-shadow:0 4px 0 #1d1340}
html[data-tema="brinquedo"] .caption small{color:#3d3266}
html[data-tema="brinquedo"] .ribbon{background:#ffcf3d;color:#1d1340;border:3px solid #1d1340;border-radius:12px;font-family:'Fredoka',sans-serif;font-weight:700;box-shadow:0 3px 0 #1d1340}
html[data-tema="brinquedo"] .stamp{background:#ffffff;color:#d61f3c;border-color:#d61f3c;font-family:'Fredoka',sans-serif;font-weight:700;border-radius:14px}
html[data-tema="brinquedo"] .banner{font-family:'Fredoka',sans-serif;font-weight:700;color:#ffffff;-webkit-text-stroke:2px #1d1340;text-shadow:0 5px 0 #1d1340}
html[data-tema="brinquedo"] .banner span{color:#ffcf3d}
html[data-tema="brinquedo"] .skiphint{color:#ffffff}
html[data-tema="brinquedo"] .card.big{box-shadow:0 6px 0 #1d1340,0 0 0 4px #ffffff}
html[data-tema="brinquedo"] .card.big::after{display:none}
html[data-tema="brinquedo"] .cardbackbig{border:3px solid #1d1340;border-radius:18px;background:repeating-linear-gradient(-45deg,#ffcf3d 0 8px,#6d28d9 8px 16px);box-shadow:0 6px 0 #1d1340}
html[data-tema="brinquedo"] .die{border:3px solid #1d1340;box-shadow:0 4px 0 #1d1340;color:#1d1340}
html[data-tema="brinquedo"] .toast{background:#ffffff;color:#1d1340;border:3px solid #1d1340;border-radius:14px;box-shadow:0 4px 0 #1d1340}

/* histórico */
html[data-tema="brinquedo"] .loglist{color:#1d1340}
html[data-tema="brinquedo"] .loglist li{border-bottom:2px dashed rgba(29,19,64,.25)}
html[data-tema="brinquedo"] .loglist .lt{color:#5b4f80}
html[data-tema="brinquedo"] .logchip{background:#ffffff;border:2px solid #1d1340;color:var(--dk);box-shadow:0 2px 0 #1d1340}
html[data-tema="brinquedo"] .logchip.trap{background:#6d28d9;color:#ffffff;border-style:solid}

/* abas Cartas e Regras */
html[data-tema="brinquedo"] .deck-sec h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.4rem}
html[data-tema="brinquedo"] .deck-sec h2[style]{color:#6d28d9!important}
html[data-tema="brinquedo"] .legend > div{background:#ffffff;border:3px solid #1d1340;border-radius:16px;box-shadow:0 4px 0 #1d1340}
html[data-tema="brinquedo"] .wr{background:#ffffff;border:2px solid #1d1340;color:#1d1340}
html[data-tema="brinquedo"] .wr i{color:#3d3266}
html[data-tema="brinquedo"] .tbl{background:#ffffff;border:3px solid #1d1340;border-radius:16px;padding:6px}
html[data-tema="brinquedo"] .tbl th{color:#3d3266}
html[data-tema="brinquedo"] .tbl th,html[data-tema="brinquedo"] .tbl td{border-bottom:2px dashed rgba(29,19,64,.2)}
html[data-tema="brinquedo"] .bar{border:1.5px solid #1d1340}
html[data-tema="brinquedo"] .rules h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.3rem;color:#6d28d9}
html[data-tema="brinquedo"] .rules{background:#ffffff;border:3px solid #1d1340;border-radius:20px;box-shadow:0 5px 0 #1d1340;padding:16px}

/* seletor de tema */
html[data-tema="brinquedo"] .temabtn{background:#ffffff;color:#1d1340;border:2.5px solid #1d1340;box-shadow:0 3px 0 #1d1340}
html[data-tema="brinquedo"] .temamenu{background:#ffffff;border:3px solid #1d1340;border-radius:16px;box-shadow:0 5px 0 #1d1340;color:#1d1340}
html[data-tema="brinquedo"] .temamenu .tm-title{color:#3d3266}
html[data-tema="brinquedo"] .temamenu button,html[data-tema="brinquedo"] .temagrid button{color:#1d1340;border:2px solid transparent}
html[data-tema="brinquedo"] .temamenu button[aria-pressed="true"],html[data-tema="brinquedo"] .temagrid button[aria-pressed="true"]{border-color:#1d1340;background:#22d3a6}
html[data-tema="brinquedo"] .deckgrid button:not([aria-pressed="true"]){background:#ffffff}

/* peça escolhida: Botão de roupa (borda costurada e quatro furinhos) */
html[data-tema="brinquedo"] .pc{background:var(--pc)}
html[data-tema="brinquedo"] .pc .pcs{display:block;position:absolute;inset:3px;border-radius:50%;border:1.5px dashed rgba(29,19,64,.55);pointer-events:none}
html[data-tema="brinquedo"] .pc .pcs::after{content:"";position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);
  background:radial-gradient(circle closest-side at 25% 25%,#1d1340 0 70%,transparent 85%),radial-gradient(circle closest-side at 75% 25%,#1d1340 0 70%,transparent 85%),
  radial-gradient(circle closest-side at 25% 75%,#1d1340 0 70%,transparent 85%),radial-gradient(circle closest-side at 75% 75%,#1d1340 0 70%,transparent 85%)}
html[data-tema="brinquedo"] .pc:has(.crown) .pcs::after{display:none}
html[data-tema="brinquedo"] .pc .crown{position:relative;z-index:1}
html[data-tema="brinquedo"] .pc .pcs::after{width:42%;height:42%;background:radial-gradient(circle,#1d1340 0 36%,transparent 41%) 0 0/50% 50% repeat}
html[data-tema="brinquedo"] .pc .pcs{inset:2px;border-width:1px}

/* tema: neon.css */
/* ===== Tema: Fliperama Neon ===== */
html[data-tema="neon"]{
  --bg:#0a0618; --surface:#12082b; --surface2:#1a0f3a; --line:#3a2f6b;
  --fg:#e9e6ff; --muted:#8f86c9; --hi:#ffe14d; --danger:#ff3fa4;
  --f-display:'Press Start 2P','Courier New',monospace; --f-body:'VT323','Courier New',monospace;
  --card-hi:#0c1230; --card-lo:#0a0618;
  --sq-light:#0e0826; --sq-dark:#22125a; --wood1:#0a0618; --wood2:#0a0618;
  --nc:#29e3ff; --np:#ff3fa4; --ny:#ffe14d;
  color-scheme:dark;
}
html[data-tema="neon"] body{background:#0a0618;color:#e9e6ff;font-family:'VT323','Courier New',monospace;font-size:19px;line-height:1.15}

html[data-tema="neon"] .bg{animation:none;inset:0;background:
  linear-gradient(rgba(41,227,255,.05) 1px,transparent 1px) 0 0/100% 4px,
  radial-gradient(60% 40% at 50% 110%,rgba(255,63,164,.18),transparent 70%);}

/* cabeçalho */
html[data-tema="neon"] header{background:rgba(10,6,24,.94);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:2px solid rgba(41,227,255,.25)}
html[data-tema="neon"] .brand h1{font-family:'Press Start 2P',monospace;font-size:.95rem;line-height:1.3;background:none;-webkit-background-clip:initial;background-clip:initial;color:#ffe14d;filter:none;text-shadow:1px 1px 0 #ff3fa4;letter-spacing:0}
html[data-tema="neon"] body.ingame .brand h1{font-size:.62rem}
html[data-tema="neon"] .brand small{font-family:'Press Start 2P',monospace;font-size:.45rem;color:#8f86c9}
html[data-tema="neon"] .brand .suits i{border-radius:0;transform:none}
html[data-tema="neon"] .tabs{background:transparent;border:2px solid #3a2f6b;border-radius:0;gap:4px}
html[data-tema="neon"] .tabs button{font-family:'Press Start 2P',monospace;font-size:.5rem;letter-spacing:0;border-radius:0;color:#8f86c9;padding:8px 4px}
html[data-tema="neon"] body.ingame .tabs button{font-size:.45rem;padding:7px 2px}
html[data-tema="neon"] .tabs button[aria-selected="true"]{background:#29e3ff;color:#0a0618;box-shadow:0 0 12px rgba(41,227,255,.6)}

/* botões e controles */
html[data-tema="neon"] .btn{font-family:'Press Start 2P',monospace;font-size:.55rem;letter-spacing:0;border-radius:0;padding:12px 12px;background:transparent;border:2px solid #29e3ff;color:#29e3ff;line-height:1.3}

html[data-tema="neon"] .btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #ff3fa4}
html[data-tema="neon"] .btn.ghost{background:transparent;border:2px solid #3a2f6b;color:#8f86c9}
html[data-tema="neon"] .btn:disabled{opacity:.4}
html[data-tema="neon"] .seg{background:transparent;border:2px solid #3a2f6b;border-radius:0}
html[data-tema="neon"] .seg button{font-family:'Press Start 2P',monospace;font-size:.5rem;border-radius:0;color:#8f86c9;letter-spacing:0}

/* configuração */
html[data-tema="neon"] .lead,html[data-tema="neon"] .note,html[data-tema="neon"] .deckblurb{font-size:1.1rem;color:#b9b2ec}
html[data-tema="neon"] .seat{background:#12082b;border:2px solid #3a2f6b;border-radius:0}
html[data-tema="neon"] .seat-h h3{font-family:'Press Start 2P',monospace;font-size:.62rem;line-height:1.5}
html[data-tema="neon"] .seat-h small{font-family:'VT323',monospace;font-size:1rem;color:#8f86c9}
html[data-tema="neon"] .deckgrid button{background:#0a0618;border:2px solid #3a2f6b;border-radius:0;font-size:1.1rem}
html[data-tema="neon"] .deckgrid button[aria-pressed="true"]{border-color:var(--dk);background:#0a0618;box-shadow:0 0 12px var(--dk),inset 0 0 8px color-mix(in srgb,var(--dk) 40%,transparent)}

/* placas e colunas */

/* status, mão, painel */

html[data-tema="neon"] .trapchip{border-radius:0;font-family:'VT323',monospace;font-size:.95rem}

/* tabuleiro */
html[data-tema="neon"] .boardwrap{background:#0a0618;border:2px solid #ff3fa4;border-radius:0;box-shadow:0 0 18px rgba(255,63,164,.55),inset 0 0 12px rgba(255,63,164,.3)}

/* peças: anel de luz na cor do jogador */
html[data-tema="neon"] .pc,html[data-tema="neon"] .token{
  background:radial-gradient(circle,color-mix(in srgb,var(--pc) 35%,transparent) 0 22%,transparent 26%),#0a0618;

html[data-tema="neon"] .hand .card[aria-pressed="true"],html[data-tema="neon"] .traprail .card[aria-pressed="true"],html[data-tema="neon"] .slots .card[aria-pressed="true"]{box-shadow:0 0 0 2px #ffe14d,0 0 22px #ffe14d}

html[data-tema="neon"] .who-line{font-family:'Press Start 2P',monospace;font-size:.5rem;letter-spacing:0;line-height:1.6;text-align:center}

/* ===== Tema Taverna: madeira escura, pergaminho, ouro e cera ===== */
html[data-tema="taverna"]{
  --bg:#2b1b12; --surface:#3a2518; --surface2:#4a2f1d; --line:#6b4a2e;

  --f-display:'Cinzel',Georgia,serif; --f-body:'Crimson Pro',Georgia,serif;
  --card-hi:#4a2f1d; --card-lo:#2b1b12;
  --sq-light:#ead7a8; --sq-dark:#7b4b27; --wood1:#5a3519; --wood2:#3a2010;
  --parch:#f1e3c2; --ink:#3b2416; --gold:#c9a24a; --wax:#a8322a;
  color-scheme:dark;
